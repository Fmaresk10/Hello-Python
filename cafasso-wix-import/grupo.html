<!doctype html><html lang="es"><head><script src="./auth-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAFASSO · Grupo</title><style>:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--red:#A64747;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,var(--navy),#0A2440);color:#fff;padding:26px 20px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center}.brand img{width:42px;height:50px;object-fit:contain}.brand b{font-family:Georgia,serif;font-size:25px}.brand small{display:block;opacity:.72;margin-top:4px}.menu{margin-top:32px;display:grid;gap:8px}.menu a{color:#fff;text-decoration:none;padding:12px 13px;border-radius:13px;font-weight:750}.menu a:hover{background:rgba(255,255,255,.11)}.back{position:absolute;left:20px;right:20px;bottom:22px;color:#fff;text-decoration:none;border-top:1px solid rgba(255,255,255,.18);padding-top:15px;font-weight:700;font-size:13px}main{padding:34px 36px;max-width:1500px;width:100%;margin:auto;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#B77D00}.head h1{font-family:Georgia,serif;color:var(--navy);font-size:40px;margin:7px 0}.head p{margin:0;color:var(--muted);max-width:760px}.status{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:12px;font-weight:800}.status.ok{color:var(--green)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 20px}.btn{border:0;background:var(--gold);color:var(--navy);font-weight:850;border-radius:12px;padding:10px 13px;cursor:pointer;text-decoration:none;font:inherit}.btn.alt{background:#fff;border:1px solid var(--line)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 9px 24px rgba(25,37,54,.06)}.kpi{padding:20px}.kpi span{font-size:12px;color:var(--muted);font-weight:700}.kpi strong{display:block;font:34px Georgia,serif;color:var(--navy);margin-top:7px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}.box{padding:22px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.title h3{margin:0;font:26px Georgia,serif;color:var(--navy)}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:17px}table{width:100%;border-collapse:collapse;min-width:690px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#FBF7F0}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#EDF5F1;color:var(--green);font-size:11px;font-weight:800}.badge.gold{background:#FFF4CC;color:#8C6700}.badge.gray{background:#F0F1F2;color:#69717C}.tiny{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.bar{height:8px;background:#EEE6DB;border-radius:999px;overflow:hidden;min-width:100px}.bar span{display:block;height:100%;background:var(--green)}.progressline{display:flex;gap:8px;align-items:center}.empty{padding:24px;text-align:center;color:var(--muted)}.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bulk select,.bulk input{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.coursebox{display:grid;gap:10px}.course{padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff}.course-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.course strong{color:var(--navy)}.course small{color:var(--muted)}.modal-wrap{position:fixed;inset:0;background:rgba(10,25,45,.45);display:none;place-items:center;padding:18px;z-index:50}.modal-wrap.show{display:grid}.modal{width:min(500px,100%);background:var(--card);border-radius:22px;padding:24px;border:1px solid var(--line)}.modal h3{font:28px Georgia,serif;color:var(--navy);margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px}.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.loading{opacity:.55;pointer-events:none}@media(max-width:1000px){.shell{grid-template-columns:86px 1fr}.brand div,.menu span,.back{display:none}.brand{justify-content:center}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.side{height:auto;position:static;padding:12px;display:flex}.menu{margin:0;display:flex;overflow:auto}.menu a{white-space:nowrap}main{padding:20px 14px}.head{flex-direction:column}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><aside class="side"><div class="brand"><img src="https://static.wixstatic.com/media/47bf07_3bf4fe6421f34a05990caa87c98fffc2~mv2.webp" alt="Maturana"><div><b>CAFASSO</b><small>Gestión de grupo</small></div></div><div class="menu"><a href="./admin.html#grupos"><span>◉ &nbsp; Grupos</span></a><a href="./reportes.html"><span>📊 &nbsp; Reportes</span></a><a href="./entregas.html"><span>📥 &nbsp; Entregas</span></a></div><a class="back" href="./admin.html#grupos">← Volver a Administración</a></aside><main id="main"><div class="head"><div><div class="eyebrow">Grupo CAFASSO</div><h1 id="groupName">Cargando grupo…</h1><p id="groupDesc"></p></div><div class="status" id="status">Conectando…</div></div><div class="actions"><button class="btn" id="assignBtn">+ Asignar curso al grupo</button><button class="btn alt" id="exportBtn">Exportar grupo CSV</button></div><div class="kpis"><article class="card kpi"><span>Integrantes</span><strong id="kMembers">0</strong></article><article class="card kpi"><span>Activos</span><strong id="kActive">0</strong></article><article class="card kpi"><span>Progreso promedio</span><strong id="kProgress">0%</strong></article><article class="card kpi"><span>Entregas pendientes</span><strong id="kPending">0</strong></article></div><div class="grid"><section class="card box"><div class="title"><h3>Animadores</h3><div class="bulk"><select id="bulkStatus"><option value="">Cambiar estado…</option><option>Activo</option><option>Invitado</option><option>Bloqueado</option><option>Inactivo</option></select><button class="tiny" id="applyBulk">Aplicar a seleccionados</button></div></div><div class="table"><table><thead><tr><th><input type="checkbox" id="checkAll"></th><th>Animador</th><th>Estado</th><th>Progreso</th><th>Último acceso</th><th></th></tr></thead><tbody id="membersBody"></tbody></table></div></section><section class="card box"><div class="title"><h3>Cursos del grupo</h3></div><div class="coursebox" id="coursesBox"></div></section></div></main></div><div class="modal-wrap" id="modal"><div class="modal"><h3>Asignar curso al grupo</h3><div class="field"><label>Curso</label><select id="courseSelect"></select></div><div class="modal-actions"><button class="btn alt" id="cancelModal">Cancelar</button><button class="btn" id="saveAssign">Asignar curso</button></div></div></div><script>const API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';const id=new URLSearchParams(location.search).get('id');let state=null,group=null,members=[],groupAssignments=[];const $=x=>document.getElementById(x);function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('es-UY',{day:'2-digit',month:'2-digit',year:'2-digit'})}function badge(v){const c=v==='Activo'?'badge':v==='Invitado'?'badge gold':'badge gray';return `<span class="${c}">${esc(v||'—')}</span>`}function busy(v){$('main').classList.toggle('loading',v)}function setStatus(t,ok=false){$('status').textContent=t;$('status').classList.toggle('ok',ok)}function progressForUser(userId){const rows=(state.progress||[]).filter(p=>p.userId===userId);return rows.length?Math.round(rows.reduce((a,p)=>a+Number(p.percent||0),0)/rows.length):0}function assignedCourseIds(){return new Set(groupAssignments.filter(a=>a.active!==false).map(a=>a.courseId))}function groupCourseProgress(courseId){if(!members.length)return 0;const vals=members.map(u=>{const p=(state.progress||[]).find(x=>x.userId===u._id&&x.courseId===courseId);return Number(p?.percent||0)});return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)}function render(){group=(state.groups||[]).find(g=>g._id===id);if(!group){$('groupName').textContent='Grupo no encontrado';return}members=(state.users||[]).filter(u=>u.groupId===id);groupAssignments=(state.assignments||[]).filter(a=>a.targetType==='group'&&a.targetId===id);$('groupName').textContent=group.name;$('groupDesc').textContent=group.description||'Sin descripción.';$('kMembers').textContent=members.length;$('kActive').textContent=members.filter(u=>u.status==='Activo').length;const avg=members.length?Math.round(members.reduce((a,u)=>a+progressForUser(u._id),0)/members.length):0;$('kProgress').textContent=avg+'%';const pending=(state.submissions||[]).filter(s=>members.some(u=>u._id===s.userId)&&(!s.status||s.status==='Pendiente'||s.status==='En revisión')).length;$('kPending').textContent=pending;$('membersBody').innerHTML=members.length?members.map(u=>{const p=progressForUser(u._id);return `<tr><td><input type="checkbox" class="pick" value="${u._id}"></td><td><strong>${esc(u.name)}</strong><br><small>${esc(u.email)}</small></td><td>${badge(u.status)}</td><td><div class="progressline"><div class="bar"><span style="width:${p}%"></span></div><b>${p}%</b></div></td><td>${fmt(u.lastAccess)}</td><td><a class="tiny" href="./animador.html?id=${encodeURIComponent(u._id)}">Ver perfil</a></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Este grupo todavía no tiene integrantes.</td></tr>';const courseIds=assignedCourseIds();const courses=(state.courses||[]).filter(c=>courseIds.has(c._id));$('coursesBox').innerHTML=courses.length?courses.map(c=>{const a=groupAssignments.find(x=>x.courseId===c._id&&x.active!==false),p=groupCourseProgress(c._id);return `<div class="course"><div class="course-top"><div><strong>${esc(c.title)}</strong><br><small>${esc(c.status||'')}</small></div><button class="tiny" data-remove="${a?._id||''}">Quitar</button></div><div class="progressline" style="margin-top:10px"><div class="bar" style="flex:1"><span style="width:${p}%"></span></div><b>${p}%</b></div></div>`}).join(''):'<div class="empty">No hay cursos asignados a este grupo.</div>';const available=(state.courses||[]).filter(c=>!courseIds.has(c._id)&&c.status!=='Archivado');$('courseSelect').innerHTML=available.map(c=>`<option value="${c._id}">${esc(c.title)}</option>`).join('')||'<option value="">No hay cursos disponibles</option>'}async function load(){if(!id){$('groupName').textContent='Falta seleccionar un grupo';return}busy(true);try{const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');state=j;render();setStatus('Conectado a Wix CMS',true)}catch(e){setStatus('No se pudo conectar');alert(e.message)}finally{busy(false)}}async function mutate(body){busy(true);setStatus('Guardando…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo guardar');state=j;render();setStatus('Guardado en Wix CMS',true);return j}catch(e){setStatus('Error al guardar');alert(e.message);throw e}finally{busy(false)}}$('assignBtn').onclick=()=>{if(!$('courseSelect').value)return alert('No hay cursos disponibles para asignar.');$('modal').classList.add('show')};$('cancelModal').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('saveAssign').onclick=async()=>{const courseId=$('courseSelect').value;if(!courseId)return;await mutate({action:'saveAssignment',assignment:{courseId,targetType:'group',targetId:id,active:true}});$('modal').classList.remove('show')};document.addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b&&b.dataset.remove&&confirm('¿Quitar este curso del grupo?'))mutate({action:'deleteAssignment',id:b.dataset.remove})});$('checkAll').onchange=e=>document.querySelectorAll('.pick').forEach(x=>x.checked=e.target.checked);$('applyBulk').onclick=async()=>{const status=$('bulkStatus').value,ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!status)return alert('Elegí un estado.');if(!ids.length)return alert('Seleccioná al menos un animador.');if(!confirm(`¿Cambiar ${ids.length} animador(es) a “${status}”?`))return;for(const uid of ids){const u=state.users.find(x=>x._id===uid);if(!u)continue;await mutate({action:'saveUser',user:{_id:u._id,name:u.name,email:u.email,groupId:u.groupId,role:u.role,status}})}alert('Estados actualizados.')};$('exportBtn').onclick=()=>{const rows=[['Nombre','Correo','Estado','Progreso','Último acceso'],...members.map(u=>[u.name,u.email,u.status,progressForUser(u._id)+'%',fmt(u.lastAccess)])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`CAFASSO-${group?.name||'grupo'}.csv`;a.click();URL.revokeObjectURL(a.href)};load();</script></body></html>
