<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAFASSO · Entregas</title><style>
:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--red:#A64747;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:30px 22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:44px}.brand h1{font:32px Georgia,serif;color:var(--navy);margin:0}.brand p{margin:4px 0 0;color:var(--muted)}a.btn,.btn{border:0;background:var(--gold);color:var(--navy);font-weight:800;border-radius:12px;padding:10px 13px;cursor:pointer;text-decoration:none}.btn.alt{background:#fff;border:1px solid var(--line)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.filters input,.filters select,textarea,select{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.filters input{flex:1;min-width:240px}.table{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#FBF7F0}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#FFF4CC;color:#886500;font-size:11px;font-weight:800}.badge.ok{background:#EDF5F1;color:var(--green)}.badge.red{background:#fff1f1;color:var(--red)}.empty{padding:34px;text-align:center;color:var(--muted)}.modal-wrap{position:fixed;inset:0;background:rgba(10,25,45,.45);display:none;place-items:center;padding:18px}.modal-wrap.show{display:grid}.modal{width:min(700px,100%);background:var(--card);border-radius:22px;padding:24px}.modal h2{font:28px Georgia,serif;color:var(--navy);margin-top:0}.answer{white-space:pre-wrap;background:#F7F1E8;border-radius:14px;padding:16px;line-height:1.6;margin:14px 0}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field textarea,.field select{width:100%}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><img src="https://static.wixstatic.com/media/47bf07_3bf4fe6421f34a05990caa87c98fffc2~mv2.webp"><div><h1>Entregas y devoluciones</h1><p>Respuestas de Reflexión, Entrega y Evaluación.</p></div></div><a class="btn alt" href="./admin.html">← Administración</a></div><div class="filters"><input id="q" placeholder="Buscar animador, curso o grupo"><select id="status"><option value="">Todos los estados</option><option>Pendiente</option><option>En revisión</option><option>Aprobada</option><option>Rehacer</option></select></div><div class="table"><table><thead><tr><th>Animador</th><th>Curso</th><th>Tipo</th><th>Respuesta</th><th>Estado</th><th>Actualizada</th><th></th></tr></thead><tbody id="body"></tbody></table></div></div><div class="modal-wrap" id="modal"><div class="modal"><h2 id="title">Revisar entrega</h2><div id="meta"></div><div class="answer" id="answer"></div><div class="field"><label>Estado</label><select id="reviewStatus"><option>Pendiente</option><option>En revisión</option><option>Aprobada</option><option>Rehacer</option></select></div><div class="field"><label>Devolución para el animador</label><textarea id="feedback" rows="5" placeholder="Escribí una devolución…"></textarea></div><div class="actions"><button class="btn alt" id="cancel">Cancelar</button><button class="btn" id="save">Guardar devolución</button></div></div></div><script>
const API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';let state={submissions:[]},current=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function fmt(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('es-UY',{dateStyle:'short',timeStyle:'short'});}function badge(s){let c=s==='Aprobada'?'ok':s==='Rehacer'?'red':'';return `<span class="badge ${c}">${esc(s||'Pendiente')}</span>`;}async function load(){const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');state=j;render();}function render(){const q=$('q').value.toLowerCase(),st=$('status').value,rows=(state.submissions||[]).filter(x=>(!q||[x.userName,x.userEmail,x.groupName,x.courseTitle,x.type,x.content].join(' ').toLowerCase().includes(q))&&(!st||(x.status||'Pendiente')===st));$('body').innerHTML=rows.length?rows.map(x=>`<tr><td><strong>${esc(x.userName||'Animador')}</strong><br><small>${esc(x.groupName||x.userEmail||'')}</small></td><td>${esc(x.courseTitle||'Curso')}</td><td>${esc(x.type||'Entrega')}</td><td>${esc((x.content||'').slice(0,90))}${(x.content||'').length>90?'…':''}</td><td>${badge(x.status)}</td><td>${fmt(x._updatedDate||x._createdDate)}</td><td><button class="btn alt" data-open="${x._id}">Revisar</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No hay entregas para mostrar.</td></tr>';}function openItem(id){current=(state.submissions||[]).find(x=>x._id===id);if(!current)return;$('title').textContent='Revisar · '+(current.userName||'Animador');$('meta').innerHTML='<strong>'+esc(current.courseTitle||'Curso')+'</strong> · '+esc(current.type||'Entrega');$('answer').textContent=current.content||'';$('reviewStatus').value=current.status||'Pendiente';$('feedback').value=current.feedback||'';$('modal').classList.add('show');}async function save(){if(!current)return;$('save').disabled=true;$('save').textContent='Guardando…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reviewSubmission',id:current._id,status:$('reviewStatus').value,feedback:$('feedback').value})}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo guardar');state=j;$('modal').classList.remove('show');render();}catch(e){alert(e.message);}finally{$('save').disabled=false;$('save').textContent='Guardar devolución';}}document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openItem(b.dataset.open);});$('q').oninput=render;$('status').onchange=render;$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=save;$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show');};load().catch(e=>$('body').innerHTML='<tr><td colspan="7" class="empty">'+esc(e.message)+'</td></tr>');
</script></body></html>
