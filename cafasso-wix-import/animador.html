<!doctype html><html lang="es"><head><script src="./auth-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAFASSO · Perfil del animador</title><style>:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--red:#A64747;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,var(--navy),#0A2440);color:#fff;padding:22px 26px}.top{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:50px;object-fit:contain}.brand b{font:25px Georgia,serif}.brand small{display:block;opacity:.72;margin-top:3px}.back{color:#fff;text-decoration:none;font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.25);padding:10px 13px;border-radius:12px}main{max-width:1240px;margin:auto;padding:30px 22px 50px}.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#B77D00}.hero h1{font:40px Georgia,serif;color:var(--navy);margin:7px 0}.hero p{margin:0;color:var(--muted)}.status{display:inline-block;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;background:#EDF5F1;color:var(--green)}.status.warn{background:#FFF4CC;color:#8C6700}.status.gray{background:#EEF0F2;color:#66717C}.status.red{background:#FFF0F0;color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 24px rgba(25,37,54,.05)}.kpi{padding:18px}.kpi small{color:var(--muted);font-weight:700}.kpi strong{display:block;font:31px Georgia,serif;color:var(--navy);margin-top:5px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.box{padding:22px}.box h2{font:26px Georgia,serif;color:var(--navy);margin:0 0 16px}.box h3{font:20px Georgia,serif;color:var(--navy);margin:0}.course-list,.activity,.timeline{display:grid;gap:12px}.course{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px}.course-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.course-head strong{color:var(--navy)}.bar{height:8px;background:#EEE6DB;border-radius:999px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:var(--green);border-radius:999px}.course-meta{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-size:12px}.module-list{display:grid;gap:7px;margin-top:13px}.module-row{display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center;background:#F8F4ED;border-radius:12px;padding:9px 10px;font-size:12px}.module-check{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#E9ECEF;color:#7A8490;font-weight:900}.module-check.done{background:#DCEFE6;color:var(--green)}.module-row b{color:var(--navy)}.module-row span:last-child{color:var(--muted)}.activity-item{border-left:4px solid var(--gold);padding:12px 14px;background:#fff;border-radius:0 14px 14px 0}.activity-item.approved{border-left-color:var(--green)}.activity-item.redo{border-left-color:var(--red)}.activity-item strong{color:var(--navy);display:block}.activity-item small{color:var(--muted)}.activity-item p{margin:7px 0 0;font-size:13px;white-space:pre-wrap;line-height:1.5}.feedback{margin-top:9px;background:#FFF8DD;border:1px solid #F3DF91;border-radius:12px;padding:10px 11px;font-size:12px;line-height:1.45}.feedback b{display:block;color:var(--navy);margin-bottom:3px}.info{display:grid;gap:10px}.info-row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--line)}.info-row span{color:var(--muted);font-size:13px}.info-row b{text-align:right;color:var(--navy)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--gold);color:var(--navy)}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.soft{background:#EDF5F1;color:var(--green)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.loading{padding:60px 20px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:800;color:var(--muted);cursor:pointer}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.timeline-item{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}.timeline-item time{font-size:11px;color:var(--muted)}.timeline-item strong{color:var(--navy);display:block;margin-bottom:3px}.timeline-item p{margin:0;color:#526173;font-size:13px;line-height:1.45}.note-area{width:100%;min-height:150px;border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;background:#fff;resize:vertical}.note-help{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 12px}.note-status{font-size:12px;font-weight:800;color:var(--green);min-height:18px;margin-top:8px}.section-gap{margin-top:18px}@media(max-width:930px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}}@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.hero h1{font-size:32px}.course-head,.course-meta{align-items:flex-start;flex-direction:column}.timeline-item{grid-template-columns:1fr}.box{padding:17px}}@media(max-width:420px){.kpis{grid-template-columns:1fr 1fr}.kpi strong{font-size:27px}}</style></head><body><header><div class="top"><div class="brand"><a href="./" aria-label="Volver al inicio" title="Volver al inicio"><img src="./cafasso-mark.svg" alt="CAFASSO"></a><div><b>CAFASSO</b><small>Seguimiento del animador</small></div></div><a class="back" href="./admin.html">← Administración</a></div></header><main id="main"><div class="loading">Cargando perfil…</div></main><script>const API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';const COURSE_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';const $=id=>document.getElementById(id);const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let currentState=null,currentUser=null,courseTrees={};function fmtDate(v,withTime=true){if(!v)return'—';const d=new Date(v);if(Number.isNaN(d.getTime()))return'—';return d.toLocaleString('es-UY',withTime?{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'2-digit',year:'numeric'})}function statusClass(v){return v==='Activo'||v==='Aprobada'?'status':v==='Invitado'||v==='Pendiente'||v==='En revisión'?'status warn':v==='Rehacer'||v==='Bloqueado'?'status red':'status gray'}function assignedCourseIds(state,user){const ids=new Set();(state.assignments||[]).filter(a=>a.active!==false).forEach(a=>{if(a.targetType==='user'&&a.targetId===user._id)ids.add(a.courseId);if(a.targetType==='group'&&user.groupId&&a.targetId===user.groupId)ids.add(a.courseId)});return ids}function noteKey(user){return 'cafasso-internal-note-'+user._id}function readNote(user){try{return localStorage.getItem(noteKey(user))||''}catch(e){return''}}function saveNote(){if(!currentUser)return;const el=$('staffNote'),msg=$('noteStatus');try{localStorage.setItem(noteKey(currentUser),el.value||'');msg.textContent='✓ Nota guardada en este dispositivo';setTimeout(()=>{if(msg)msg.textContent=''},2200)}catch(e){msg.textContent='No se pudo guardar la nota.'}}function timeline(state,user,courses,progressByCourse,subs){const items=[];if(user.lastAccess)items.push({date:user.lastAccess,title:'Último acceso a CAFASSO',body:'El animador ingresó a su espacio personal.'});courses.forEach(c=>{const p=progressByCourse.get(c._id);if(p&&p.updatedAt)items.push({date:p.updatedAt,title:'Progreso actualizado',body:`${c.title}: ${Number(p.percent||0)}% completado.`})});subs.forEach(s=>{items.push({date:s._updatedDate||s._createdDate,title:s.status==='Aprobada'?'Entrega aprobada':s.status==='Rehacer'?'Entrega con devolución':'Entrega registrada',body:`${s.courseTitle||'Curso'} · ${s.type||'Entrega'} · ${s.status||'Pendiente'}`})});return items.filter(x=>x.date).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20)}async function fetchCourseTrees(courses){const results=await Promise.all(courses.map(async c=>{try{const r=await fetch(COURSE_API+'?id='+encodeURIComponent(c._id),{cache:'no-store'}),j=await r.json();if(r.ok&&j.ok&&j.course)return [c._id,j.course]}catch(e){}return [c._id,null]}));courseTrees=Object.fromEntries(results)}function courseHtml(c,p){const pc=Math.max(0,Math.min(100,Number(p?.percent||0))),tree=courseTrees[c._id],completed=new Set(Array.isArray(p?.completedModules)?p.completedModules:[]),mods=tree&&Array.isArray(tree.modules)?tree.modules:[];return `<div class="course"><div class="course-head"><strong>${esc(c.title)}</strong><span class="${statusClass(pc>=100?'Aprobada':pc>0?'En revisión':'Pendiente')}">${pc>=100?'Completado':pc>0?'En curso':'Sin empezar'}</span></div><div class="bar"><span style="width:${pc}%"></span></div><div class="course-meta"><span>${pc}% completado</span><span>${mods.length||c.moduleCount||0} módulos</span></div>${mods.length?`<div class="module-list">${mods.map((m,i)=>{const done=completed.has(m._id);return `<div class="module-row"><span class="module-check ${done?'done':''}">${done?'✓':i+1}</span><b>${esc(m.title||`Módulo ${i+1}`)}</b><span>${done?'Completado':'Pendiente'}</span></div>`}).join('')}</div>`:''}</div>`}function deliveryHtml(s){const cls=s.status==='Aprobada'?'approved':s.status==='Rehacer'?'redo':'';return `<div class="activity-item ${cls}"><strong>${esc(s.courseTitle||'Curso')} · ${esc(s.type||'Entrega')}</strong><small>${fmtDate(s._updatedDate||s._createdDate)} · <span class="${statusClass(s.status)}">${esc(s.status||'Pendiente')}</span></small><p>${esc(String(s.content||'').slice(0,300))}${String(s.content||'').length>300?'…':''}</p>${s.feedback?`<div class="feedback"><b>Devolución del equipo formador</b>${esc(s.feedback)}</div>`:''}</div>`}function render(state,user){currentState=state;currentUser=user;const assigned=assignedCourseIds(state,user);const courses=(state.courses||[]).filter(c=>assigned.has(c._id));const progress=(state.progress||[]).filter(p=>p.userId===user._id);const progressByCourse=new Map(progress.map(p=>[p.courseId,p]));const subs=(state.submissions||[]).filter(s=>s.userId===user._id).sort((a,b)=>new Date(b._updatedDate||b._createdDate||0)-new Date(a._updatedDate||a._createdDate||0));const avg=courses.length?Math.round(courses.reduce((sum,c)=>sum+Number(progressByCourse.get(c._id)?.percent||0),0)/courses.length):0;const pending=subs.filter(s=>!s.status||['Pendiente','En revisión'].includes(s.status)).length;const completed=courses.filter(c=>Number(progressByCourse.get(c._id)?.percent||0)>=100).length;const approved=subs.filter(s=>s.status==='Aprobada').length;const events=timeline(state,user,courses,progressByCourse,subs);document.title=`CAFASSO · ${user.name}`;$('main').innerHTML=`<section class="hero"><div><div class="eyebrow">Ficha integral de acompañamiento</div><h1>${esc(user.name)}</h1><p>${esc(user.email)} · ${esc(user.groupName||'Sin grupo')}</p></div><span class="${statusClass(user.status)}">${esc(user.status||'—')}</span></section><section class="kpis"><article class="card kpi"><small>Cursos asignados</small><strong>${courses.length}</strong></article><article class="card kpi"><small>Progreso promedio</small><strong>${avg}%</strong></article><article class="card kpi"><small>Cursos completados</small><strong>${completed}</strong></article><article class="card kpi"><small>Entregas pendientes</small><strong>${pending}</strong></article><article class="card kpi"><small>Entregas aprobadas</small><strong>${approved}</strong></article></section><section class="grid"><div><article class="card box"><h2>Recorrido formativo</h2><div class="course-list">${courses.length?courses.map(c=>courseHtml(c,progressByCourse.get(c._id))).join(''):'<div class="empty">No tiene cursos asignados.</div>'}</div></article><article class="card box section-gap"><div class="tabs"><button class="tab active" data-tab="deliveries">Entregas y devoluciones</button><button class="tab" data-tab="history">Historial</button></div><div id="tabDeliveries"><div class="activity">${subs.length?subs.map(deliveryHtml).join(''):'<div class="empty">Todavía no hay entregas registradas.</div>'}</div></div><div id="tabHistory" style="display:none"><div class="timeline">${events.length?events.map(e=>`<div class="timeline-item"><time>${fmtDate(e.date)}</time><div><strong>${esc(e.title)}</strong><p>${esc(e.body)}</p></div></div>`).join(''):'<div class="empty">Todavía no hay actividad registrada.</div>'}</div></div></article></div><aside><article class="card box"><h2>Datos del animador</h2><div class="info"><div class="info-row"><span>Grupo</span><b>${esc(user.groupName||'Sin grupo')}</b></div><div class="info-row"><span>Rol</span><b>${esc(user.role||'Animador')}</b></div><div class="info-row"><span>Estado</span><b>${esc(user.status||'—')}</b></div><div class="info-row"><span>Último acceso</span><b>${fmtDate(user.lastAccess)}</b></div><div class="info-row"><span>Entregas realizadas</span><b>${subs.length}</b></div><div class="info-row"><span>Formaciones activas</span><b>${courses.filter(c=>Number(progressByCourse.get(c._id)?.percent||0)<100).length}</b></div></div><div class="actions"><a class="btn" href="./reportes.html">Ver reportes</a><a class="btn alt" href="./entregas.html">Ver entregas</a></div></article><article class="card box section-gap"><h2>Notas internas</h2><p class="note-help">Espacio privado para registrar observaciones de acompañamiento. En esta primera versión se guarda únicamente en este dispositivo; no la ve el animador.</p><textarea id="staffNote" class="note-area" placeholder="Ej.: acompañar el inicio del curso, conversar sobre una devolución, registrar un acuerdo…">${esc(readNote(user))}</textarea><div class="actions"><button id="saveNote" class="btn soft">Guardar nota</button></div><div id="noteStatus" class="note-status"></div></article></aside></section>`;document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===btn));$('tabDeliveries').style.display=btn.dataset.tab==='deliveries'?'':'none';$('tabHistory').style.display=btn.dataset.tab==='history'?'':'none'});$('saveNote').onclick=saveNote}async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('main').innerHTML='<div class="empty">Falta identificar al animador.</div>';return}try{const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudieron cargar los datos.');const user=(j.users||[]).find(u=>u._id===id);if(!user)throw new Error('Animador no encontrado.');const assigned=assignedCourseIds(j,user);const courses=(j.courses||[]).filter(c=>assigned.has(c._id));await fetchCourseTrees(courses);render(j,user)}catch(e){$('main').innerHTML=`<div class="empty"><b>No se pudo abrir el perfil.</b><br>${esc(e.message)}</div>`}}load();</script></body></html>
