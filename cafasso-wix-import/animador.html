<!doctype html><html lang="es"><head><script src="./auth-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAFASSO · Perfil del animador</title><style>:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--red:#A64747;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(135deg,var(--navy),#0A2440);color:#fff;padding:22px 26px}.top{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:50px;object-fit:contain}.brand b{font:25px Georgia,serif}.brand small{display:block;opacity:.72;margin-top:3px}.back{color:#fff;text-decoration:none;font-weight:800;font-size:13px;border:1px solid rgba(255,255,255,.25);padding:10px 13px;border-radius:12px}main{max-width:1200px;margin:auto;padding:30px 22px 50px}.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#B77D00}.hero h1{font:40px Georgia,serif;color:var(--navy);margin:7px 0}.hero p{margin:0;color:var(--muted)}.status{display:inline-block;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;background:#EDF5F1;color:var(--green)}.status.warn{background:#FFF4CC;color:#8C6700}.status.gray{background:#EEF0F2;color:#66717C}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:20px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 24px rgba(25,37,54,.05)}.kpi{padding:18px}.kpi small{color:var(--muted);font-weight:700}.kpi strong{display:block;font:31px Georgia,serif;color:var(--navy);margin-top:5px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.box{padding:22px}.box h2{font:26px Georgia,serif;color:var(--navy);margin:0 0 16px}.course-list,.activity{display:grid;gap:12px}.course{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px}.course-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.course-head strong{color:var(--navy)}.bar{height:8px;background:#EEE6DB;border-radius:999px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:var(--green);border-radius:999px}.course-meta{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-size:12px}.activity-item{border-left:4px solid var(--gold);padding:11px 13px;background:#fff;border-radius:0 14px 14px 0}.activity-item strong{color:var(--navy);display:block}.activity-item small{color:var(--muted)}.activity-item p{margin:7px 0 0;font-size:13px;white-space:pre-wrap}.info{display:grid;gap:10px}.info-row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--line)}.info-row span{color:var(--muted);font-size:13px}.info-row b{text-align:right;color:var(--navy)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{display:inline-block;text-decoration:none;border:0;border-radius:12px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--gold);color:var(--navy)}.btn.alt{background:#fff;border:1px solid var(--line)}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.loading{padding:60px 20px;text-align:center;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}}@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.hero h1{font-size:32px}}</style></head><body><header><div class="top"><div class="brand"><a href="./" aria-label="Volver al inicio" title="Volver al inicio"><img src="https://static.wixstatic.com/media/47bf07_3bf4fe6421f34a05990caa87c98fffc2~mv2.webp" alt="Maturana"></a><div><b>CAFASSO</b><small>Seguimiento del animador</small></div></div><a class="back" href="./admin.html">← Administración</a></div></header><main id="main"><div class="loading">Cargando perfil…</div></main><script>const API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';const $=id=>document.getElementById(id);const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function fmtDate(v){if(!v)return'—';const d=new Date(v);if(Number.isNaN(d.getTime()))return'—';return d.toLocaleString('es-UY',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}function statusClass(v){return v==='Activo'||v==='Aprobada'?'status':v==='Invitado'||v==='Pendiente'||v==='En revisión'?'status warn':'status gray'}function assignedCourseIds(state,user){const ids=new Set();(state.assignments||[]).filter(a=>a.active!==false).forEach(a=>{if(a.targetType==='user'&&a.targetId===user._id)ids.add(a.courseId);if(a.targetType==='group'&&user.groupId&&a.targetId===user.groupId)ids.add(a.courseId)});return ids}function render(state,user){const assigned=assignedCourseIds(state,user);const courses=(state.courses||[]).filter(c=>assigned.has(c._id));const progress=(state.progress||[]).filter(p=>p.userId===user._id);const progressByCourse=new Map(progress.map(p=>[p.courseId,p]));const subs=(state.submissions||[]).filter(s=>s.userId===user._id).sort((a,b)=>new Date(b._updatedDate||b._createdDate||0)-new Date(a._updatedDate||a._createdDate||0));const avg=courses.length?Math.round(courses.reduce((sum,c)=>sum+Number(progressByCourse.get(c._id)?.percent||0),0)/courses.length):0;const pending=subs.filter(s=>!s.status||['Pendiente','En revisión'].includes(s.status)).length;const completed=courses.filter(c=>Number(progressByCourse.get(c._id)?.percent||0)>=100).length;document.title=`CAFASSO · ${user.name}`;$('main').innerHTML=`<section class="hero"><div><div class="eyebrow">Perfil de seguimiento</div><h1>${esc(user.name)}</h1><p>${esc(user.email)} · ${esc(user.groupName||'Sin grupo')}</p></div><span class="${statusClass(user.status)}">${esc(user.status||'—')}</span></section><section class="kpis"><article class="card kpi"><small>Cursos asignados</small><strong>${courses.length}</strong></article><article class="card kpi"><small>Progreso promedio</small><strong>${avg}%</strong></article><article class="card kpi"><small>Cursos completados</small><strong>${completed}</strong></article><article class="card kpi"><small>Entregas pendientes</small><strong>${pending}</strong></article></section><section class="grid"><div><article class="card box"><h2>Cursos y progreso</h2><div class="course-list">${courses.length?courses.map(c=>{const p=progressByCourse.get(c._id)||{};const pc=Math.max(0,Math.min(100,Number(p.percent||0)));return `<div class="course"><div class="course-head"><strong>${esc(c.title)}</strong><span class="${statusClass(pc>=100?'Aprobada':pc>0?'En revisión':'Pendiente')}">${pc>=100?'Completado':pc>0?'En curso':'Sin empezar'}</span></div><div class="bar"><span style="width:${pc}%"></span></div><div class="course-meta"><span>${pc}% completado</span><span>${c.moduleCount||0} módulos</span></div></div>`}).join(''):'<div class="empty">No tiene cursos asignados.</div>'}</div></article><article class="card box" style="margin-top:18px"><h2>Últimas entregas y actividad</h2><div class="activity">${subs.length?subs.slice(0,10).map(s=>`<div class="activity-item"><strong>${esc(s.courseTitle||'Curso')} · ${esc(s.type||'Entrega')}</strong><small>${fmtDate(s._updatedDate||s._createdDate)} · <span class="${statusClass(s.status)}">${esc(s.status||'Pendiente')}</span></small><p>${esc(String(s.content||'').slice(0,220))}${String(s.content||'').length>220?'…':''}</p></div>`).join(''):'<div class="empty">Todavía no hay entregas registradas.</div>'}</div></article></div><aside><article class="card box"><h2>Datos del animador</h2><div class="info"><div class="info-row"><span>Grupo</span><b>${esc(user.groupName||'Sin grupo')}</b></div><div class="info-row"><span>Rol</span><b>${esc(user.role||'Animador')}</b></div><div class="info-row"><span>Estado</span><b>${esc(user.status||'—')}</b></div><div class="info-row"><span>Último acceso</span><b>${fmtDate(user.lastAccess)}</b></div><div class="info-row"><span>Entregas realizadas</span><b>${subs.length}</b></div></div><div class="actions"><a class="btn" href="./reportes.html">Ver reportes</a><a class="btn alt" href="./entregas.html">Ver entregas</a></div></article></aside></section>`}async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('main').innerHTML='<div class="empty">Falta identificar al animador.</div>';return}try{const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudieron cargar los datos.');const user=(j.users||[]).find(u=>u._id===id);if(!user)throw new Error('Animador no encontrado.');render(j,user)}catch(e){$('main').innerHTML=`<div class="empty"><b>No se pudo abrir el perfil.</b><br>${esc(e.message)}</div>`}}load();</script></body></html>
