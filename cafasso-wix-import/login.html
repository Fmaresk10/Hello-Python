<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAFASSO · Ingreso</title>
<style>
:root{
  --deep:#102f33;
  --paper:#f3e5c6;
  --ink:#3a3028;
  --green:#657247;
  --green-deep:#515d39;
  --red:#8f3f3f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#17271f}
body{
  overflow:hidden;
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-shell{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#17271f;
}
.login-shell:before{
  content:"";
  position:absolute;
  z-index:4;
  inset:-14%;
  pointer-events:none;
  background:
    radial-gradient(circle at 18% 22%,rgba(255,208,111,.17),transparent 22%),
    radial-gradient(circle at 78% 20%,rgba(255,232,180,.12),transparent 20%),
    linear-gradient(110deg,transparent 22%,rgba(255,225,158,.055) 48%,transparent 68%);
  mix-blend-mode:screen;
  animation:cafassoAmbientLight 11s ease-in-out infinite alternate;
}
.login-shell:after{
  content:"";
  position:absolute;
  z-index:5;
  inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 130px 40px rgba(10,20,15,.24);
  background:
    radial-gradient(circle at 24% 26%,rgba(255,236,190,.13) 0 1px,transparent 1.5px),
    radial-gradient(circle at 74% 34%,rgba(255,236,190,.10) 0 1px,transparent 1.5px),
    radial-gradient(circle at 44% 68%,rgba(255,236,190,.09) 0 1px,transparent 1.5px);
  background-size:190px 170px,260px 230px,320px 290px;
  opacity:.45;
  animation:cafassoDust 14s linear infinite;
}

.login-scene-stage{
  position:absolute;
  z-index:1;
  left:50%;
  top:50%;
  width:max(100vw,177.68vh);
  height:max(100vh,56.28vw);
  transform:translate(-50%,-50%);
  transform-origin:center;
  container-type:size;
  animation:cafassoSceneBreath 18s ease-in-out infinite alternate;
}
.login-scene-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

.cafasso-mark,.bitacora-prop,.bitacora-label{display:none!important}

.login-object{
  position:absolute;
  inset:0;
  z-index:3;
  width:100%;
  height:100%;
  pointer-events:none;
}
.login-sheet{
  position:absolute;
  inset:0;
  min-height:0;
  padding:0;
  border:0;
  border-radius:0;
  background:none;
  box-shadow:none;
  transform:none;
  pointer-events:none;
}
.sheet-kicker,.login-sheet>h1,.sheet-lead,.sheet-signature{display:none}

#loginBox{
  position:absolute;
  inset:0;
  pointer-events:none;
}
#loginBox .field{
  position:absolute;
  left:41.567%;
  width:25.299%;
  height:6.376%;
  margin:0;
  pointer-events:auto;
}
#loginBox .field:nth-child(1){top:55.367%}
#loginBox .field:nth-child(2){top:63.337%}

.field label{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
#loginBox .field input{
  width:calc(100% - .26cqw);
  height:calc(100% - .26cqw);
  min-height:0;
  margin:.13cqw;
  padding:0 1.05cqw;
  border:0;
  border-radius:.66cqw;
  outline:0;
  background:rgba(49,28,18,.96);
  color:#f2e1c0;
  caret-color:#f2e1c0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  font:500 .93cqw/1 Inter,system-ui,sans-serif;
  letter-spacing:.005em;
}
#loginBox .field input::placeholder{color:rgba(242,225,192,.52)}
#loginBox .field input:focus{
  box-shadow:
    0 0 0 .13cqw rgba(229,199,143,.12),
    inset 0 1px 0 rgba(255,255,255,.04);
}
#loginBox .field input:-webkit-autofill,
#loginBox .field input:-webkit-autofill:hover,
#loginBox .field input:-webkit-autofill:focus,
#loginBox .field input:-webkit-autofill:active{
  -webkit-text-fill-color:#f2e1c0!important;
  caret-color:#f2e1c0!important;
  -webkit-box-shadow:
    0 0 0 1000px rgb(49,28,18) inset!important;
  box-shadow:
    0 0 0 1000px rgb(49,28,18) inset!important;
  border-color:transparent!important;
  transition:background-color 9999s ease-out 0s!important;
}

#go{
  position:absolute;
  left:41.507%;
  top:72.051%;
  width:25.359%;
  height:7.970%;
  min-height:0;
  margin:0;
  padding:0;
  border:0;
  border-radius:.8cqw;
  color:transparent;
  background:transparent;
  box-shadow:none;
  font:600 1.34cqw/1 Georgia,serif;
  letter-spacing:.01em;
  pointer-events:auto;
  transition:transform .15s ease,filter .15s ease;
}
#go:hover{background:rgba(255,255,255,.035);filter:brightness(1.03)}
#go:active{background:rgba(0,0,0,.045)}
#go:focus-visible{outline:.13cqw solid rgba(255,239,199,.52);outline-offset:.08cqw}
#go:disabled{opacity:.58;cursor:wait}

.message{
  position:absolute;
  z-index:6;
  left:41.507%;
  top:80.65%;
  width:25.359%;
  display:none;
  margin:0;
  padding:.55cqw .7cqw;
  border-radius:.48cqw;
  font:600 .64cqw/1.35 Inter,system-ui,sans-serif;
  pointer-events:auto;
  box-shadow:0 .25cqw .65cqw rgba(35,21,12,.13);
}
.message.show{display:block}
.message.err{
  color:#fff1ea;
  background:rgba(115,45,39,.90);
  border:1px solid rgba(255,215,205,.22);
}
.message.ok{
  color:#eff8ef;
  background:rgba(54,92,67,.91);
  border:1px solid rgba(225,244,226,.20);
}

.session-note{
  position:absolute;
  z-index:6;
  left:41.507%;
  top:81.15%;
  width:25.359%;
  display:none;
  padding:.55cqw .7cqw;
  border:1px solid rgba(233,216,176,.28);
  border-radius:.55cqw;
  color:#f5ead2;
  background:rgba(48,31,20,.88);
  pointer-events:auto;
}
.session-note.show{display:block}
.session-note-text{
  display:flex;
  gap:.45cqw;
  align-items:center;
  color:#eadcc2;
  font:600 .62cqw/1.3 Inter,system-ui,sans-serif;
}
.session-note-dot{
  flex:0 0 auto;
  width:.36cqw;
  height:.36cqw;
  border-radius:50%;
  background:#96b18f;
}
.session-note-actions{
  display:flex;
  gap:.6cqw;
  margin-top:.38cqw;
}
.session-note-actions button{
  border:0;
  padding:0;
  background:transparent;
  color:#f0dfbd;
  font:700 .58cqw Inter,system-ui,sans-serif;
  text-decoration:underline;
  text-underline-offset:2px;
}
.session-note-actions #continueSession{
  padding:.32cqw .48cqw;
  border:1px solid rgba(240,221,178,.24);
  border-radius:.38cqw;
  text-decoration:none;
  background:rgba(120,112,75,.24);
}

/* Cambio obligatorio de contraseña */
#changeBox{
  position:absolute;
  z-index:7;
  left:38.6%;
  top:39.5%;
  width:30.1%;
  padding:1.6cqw;
  border:1px solid rgba(103,69,42,.34);
  border-radius:.85cqw;
  color:#49372a;
  background:
    linear-gradient(100deg,rgba(239,218,178,.98),rgba(249,236,207,.98));
  box-shadow:0 1.4cqw 3.2cqw rgba(26,15,9,.35);
  pointer-events:auto;
}
#changeBox .secure{
  display:flex;
  gap:.7cqw;
  margin:0 0 .9cqw;
  padding:.7cqw;
  border:1px solid rgba(93,67,43,.14);
  background:rgba(255,249,234,.35);
}
#changeBox .secure b{
  display:block;
  font:700 .76cqw Georgia,serif;
}
#changeBox .secure small{
  display:block;
  margin-top:.2cqw;
  font:.58cqw/1.4 Inter,system-ui,sans-serif;
  color:#78624d;
}
#changeBox .field{
  position:relative;
  margin:.7cqw 0;
}
#changeBox .field label{
  position:static;
  width:auto;height:auto;margin:0 0 .24cqw;
  overflow:visible;clip:auto;white-space:normal;
  display:block;
  color:#775a41;
  font:800 .54cqw Inter,system-ui,sans-serif;
  letter-spacing:.08em;
  text-transform:uppercase;
}
#changeBox .field input{
  width:100%;
  min-height:2.45cqw;
  padding:.55cqw .7cqw;
  border:1px solid rgba(103,75,49,.20);
  border-radius:.52cqw;
  outline:0;
  background:rgba(255,253,245,.72);
  color:#423228;
  font:.76cqw Inter,system-ui,sans-serif;
}
#change{
  width:100%;
  min-height:2.5cqw;
  margin-top:.7cqw;
  border:1px solid #735239;
  border-radius:.52cqw;
  color:#fff7e7;
  background:#69503b;
  font:700 .75cqw Georgia,serif;
}
.login-shell.changing .message{
  left:38.6%;
  top:78%;
  width:30.1%;
}

.login-transition{
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  background:rgba(8,24,20,.80);
  transition:opacity .32s ease,visibility .32s ease;
}
.login-transition__inner{
  color:#fff1cf;
  text-align:center;
  transform:translateY(8px);
  opacity:0;
  transition:transform .32s ease,opacity .32s ease;
}
.login-transition strong{display:block;font:500 clamp(29px,4.8vw,46px)/1 Georgia,serif}
.login-transition span{
  display:block;
  margin-top:8px;
  color:rgba(255,240,205,.62);
  font-size:9px;
  font-weight:850;
  letter-spacing:.14em;
  text-transform:uppercase;
}

.login-shell.entering .login-scene-stage{
  animation:none;
  transform:translate(-50%,-50%) scale(1.035);
  filter:brightness(.72);
  transition:transform .52s ease,filter .48s ease;
}
.login-shell.entering .login-transition{opacity:1;visibility:visible}
.login-shell.entering .login-transition__inner{opacity:1;transform:none}

@keyframes cafassoSceneBreath{
  from{transform:translate(-50%,-50%) scale(1)}
  to{transform:translate(-50%,-50%) scale(1.012)}
}
@keyframes cafassoAmbientLight{
  from{transform:translate3d(-1.5%,-.8%,0);opacity:.72}
  to{transform:translate3d(1.8%,1.2%,0);opacity:1}
}
@keyframes cafassoDust{
  from{background-position:0 0,0 0,0 0}
  to{background-position:18px -36px,-26px -48px,14px -56px}
}

@media(max-width:760px){
  .login-shell:after{box-shadow:inset 0 0 80px 25px rgba(10,20,15,.18)}
  #loginBox .field input{font-size:1.12cqw}
  #go{font-size:1.55cqw}
  .message{font-size:.68cqw}
  .session-note-text{font-size:.65cqw}
  .session-note-actions button{font-size:.62cqw}
}
@media(prefers-reduced-motion:reduce){
  .login-scene-stage,.login-shell:before,.login-shell:after{animation:none!important}
  .login-transition,.login-transition__inner{transition:none!important}
}
</style>
</head>
<body>
<main class="login-shell" id="loginShell">
  <div class="login-scene-stage">
    <img
      class="login-scene-image"
      src="https://static.wixstatic.com/media/47bf07_8b2cea8727f749adab08dedca208311b~mv2.jpg"
      alt=""
      aria-hidden="true"
      fetchpriority="high"
      decoding="async">

    <section class="login-object" aria-label="Ingreso a CAFASSO">
    <article class="login-sheet">
      <div class="sheet-kicker">CAFASSO</div>
      <h1 id="title">Bienvenido.</h1>
      <p id="lead" class="sheet-lead">Identificate para continuar.</p>

      <div id="loginBox">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="Correo electrónico">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
        </div>
        <button id="go" type="button">Entrar →</button>
      </div>

      <div id="changeBox" class="hidden">
        <div class="secure">
          <div>✦</div>
          <div>
            <b>Elegí tu contraseña definitiva</b>
            <small>La contraseña temporal dejará de servir cuando completes este paso.</small>
          </div>
        </div>
        <div class="field">
          <label for="newPassword">Nueva contraseña</label>
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="Al menos 10 caracteres">
        </div>
        <div class="field">
          <label for="repeatPassword">Repetir contraseña</label>
          <input id="repeatPassword" type="password" autocomplete="new-password" placeholder="Repetila">
        </div>
        <button id="change" type="button">Guardar y entrar →</button>
      </div>

      <div id="msg" class="message"></div>

      <div id="sessionNote" class="session-note">
        <div class="session-note-text">
          <span class="session-note-dot"></span>
          <span>Ya hay una sesión iniciada en este dispositivo.</span>
        </div>
        <div class="session-note-actions">
          <button id="continueSession" type="button">Continuar</button>
          <button id="newLogin" type="button">Ingresar de nuevo</button>
        </div>
      </div>
    </article>
    </section>
  </div>

  <div class="login-transition" id="loginTransition" aria-hidden="true">
    <div class="login-transition__inner">
      <strong id="transitionTitle">Entrando a Casa…</strong>
      <span>CAFASSO</span>
    </div>
  </div>
</main>
<script>
const AUTH_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAuth';
const $=id=>document.getElementById(id);
const go=$('go'),change=$('change'),msg=$('msg'),sessionNote=$('sessionNote');
let pending=null;
const loginReason=new URLSearchParams(location.search).get('reason');

function message(text,type){
  msg.textContent=text;
  msg.className='message show '+type;
}

async function api(body,token=''){
  const r=await fetch(AUTH_API,{
    method:'POST',
    headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},
    body:JSON.stringify(body)
  });
  let j={};
  try{j=await r.json()}catch(e){}
  if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo completar el acceso.');
  return j;
}

function save(j){
  localStorage.setItem('cafassoAuth',JSON.stringify({
    sessionToken:j.token,
    expiresAt:new Date(j.expiresAt).getTime()
  }));
  localStorage.setItem('cafassoSession',JSON.stringify({
    authenticated:true,
    user:j.user,
    checkedAt:Date.now()
  }));
}

function clearLocalSession(){
  localStorage.removeItem('cafassoSession');
  localStorage.removeItem('cafassoAuth');
  sessionNote.classList.remove('show');
}

function route(user){
  const shell=$('loginShell');
  $('transitionTitle').textContent='Entrando a Casa…';
  shell.classList.add('entering');
  $('loginTransition').setAttribute('aria-hidden','false');
  setTimeout(()=>location.replace('./'),420);
}

async function login(){
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  if(!email||!password){
    message('Ingresá correo y contraseña.','err');
    return;
  }

  go.disabled=true;
  go.textContent='Ingresando…';
  try{
    const j=await api({action:'login',email,password});
    pending=j;
    sessionNote.classList.remove('show');

    if(j.mustChangePassword){
      $('loginBox').classList.add('hidden');
      $('changeBox').classList.remove('hidden');
      $('loginShell').classList.add('changing');
      $('title').textContent='Elegí tu contraseña';
      $('lead').textContent='Tu identidad ya fue validada. Falta definir tu contraseña.';
      message('Acceso temporal correcto. Elegí ahora tu contraseña definitiva.','ok');
      $('newPassword').focus();
      return;
    }

    save(j);
    message('Bienvenido/a, '+(j.user.name||'')+'.','ok');
    setTimeout(()=>route(j.user),140);
  }catch(e){
    message(e.message,'err');
  }finally{
    go.disabled=false;
    go.textContent='Entrar →';
  }
}

async function changePassword(){
  const a=$('newPassword').value;
  const b=$('repeatPassword').value;

  if(a.length<10){
    message('La nueva contraseña debe tener al menos 10 caracteres.','err');
    return;
  }
  if(a!==b){
    message('Las dos contraseñas no coinciden.','err');
    return;
  }

  change.disabled=true;
  change.textContent='Guardando…';
  try{
    const j=await api({action:'changePassword',newPassword:a},pending.token);
    save(j);
    message('Contraseña guardada.','ok');
    setTimeout(()=>route(j.user),140);
  }catch(e){
    message(e.message,'err');
  }finally{
    change.disabled=false;
    change.textContent='Guardar y entrar →';
  }
}

if(loginReason==='session'){
  message('Tu sesión guardada dejó de ser válida. Ingresá nuevamente.','err');
}

go.onclick=login;
change.onclick=changePassword;
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('repeatPassword').addEventListener('keydown',e=>{if(e.key==='Enter')changePassword()});

(()=>{
  try{
    const s=JSON.parse(localStorage.getItem('cafassoSession')||'null');
    const a=JSON.parse(localStorage.getItem('cafassoAuth')||'null');

    if(!s?.authenticated||!s?.user||!a?.sessionToken)return;
    if(Number(a.expiresAt||0)<=Date.now()){
      clearLocalSession();
      return;
    }

    sessionNote.classList.add('show');
    $('continueSession').onclick=()=>route(s.user);
    $('newLogin').onclick=()=>{
      clearLocalSession();
      $('email').focus();
    };
  }catch(e){
    clearLocalSession();
  }
})();
</script>
</body>
</html>
