<!doctype html><html lang="es"><head><script src="./auth-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAFASSO · Gestión de grupos</title><style>:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:32px 22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.brand{display:flex;gap:12px;align-items:center}.brand img{width:44px;height:52px;object-fit:contain}.brand b{font:28px Georgia,serif;color:var(--navy)}.brand small{display:block;color:var(--muted)}h1{font:40px Georgia,serif;color:var(--navy);margin:28px 0 5px}.lead{color:var(--muted);margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--gold);color:var(--navy);font-weight:850;text-decoration:none;cursor:pointer}.btn.alt{background:#fff;border:1px solid var(--line)}.filters{margin:24px 0 16px;display:flex;gap:10px}.filters input{flex:1;min-width:220px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 9px 24px rgba(25,37,54,.06)}.card h3{font:27px Georgia,serif;color:var(--navy);margin:0 0 7px}.card p{color:var(--muted);min-height:42px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:#F7F1E8;border-radius:13px;padding:11px}.stat small{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.stat strong{display:block;color:var(--navy);font-size:19px;margin-top:4px}.foot{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{padding:6px 9px;border-radius:999px;background:#EDF5F1;color:var(--green);font-size:11px;font-weight:800}.badge.off{background:#F0F1F2;color:#687386}.status{font-size:12px;font-weight:800;color:var(--muted);padding-top:12px}.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.top{flex-direction:column}.grid{grid-template-columns:1fr}.wrap{padding:20px 14px}}</style></head><body><main class="wrap"><div class="top"><div class="brand"><a href="./" aria-label="Volver al inicio" title="Volver al inicio"><img src="https://static.wixstatic.com/media/47bf07_3bf4fe6421f34a05990caa87c98fffc2~mv2.webp" alt="Maturana"></a><div><b>CAFASSO</b><small>Gestión de grupos</small></div></div><div class="actions"><a class="btn alt" href="./admin.html#grupos">← Administración</a><a class="btn alt" href="./reportes.html">Reportes</a></div></div><h1>Grupos</h1><p class="lead">Entrá a cada grupo para gestionar integrantes, cursos, progreso y entregas.</p><div class="filters"><input id="search" placeholder="Buscar grupo"></div><div class="grid" id="grid"><div class="empty">Cargando grupos…</div></div><div class="status" id="status">Conectando con Wix CMS…</div></main><script>const API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';let state=null;const $=x=>document.getElementById(x);function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function groupProgress(gid){const users=(state.users||[]).filter(u=>u.groupId===gid);if(!users.length)return 0;const vals=users.map(u=>{const p=(state.progress||[]).filter(x=>x.userId===u._id);return p.length?Math.round(p.reduce((a,x)=>a+Number(x.percent||0),0)/p.length):0});return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)}function pending(gid){const ids=new Set((state.users||[]).filter(u=>u.groupId===gid).map(u=>u._id));return(state.submissions||[]).filter(s=>ids.has(s.userId)&&(!s.status||s.status==='Pendiente'||s.status==='En revisión')).length}function courses(gid){return new Set((state.assignments||[]).filter(a=>a.targetType==='group'&&a.targetId===gid&&a.active!==false).map(a=>a.courseId)).size}function render(){const q=$('search').value.trim().toLowerCase(),groups=(state.groups||[]).filter(g=>!q||[g.name,g.description].join(' ').toLowerCase().includes(q));$('grid').innerHTML=groups.length?groups.map(g=>`<article class="card"><h3>${esc(g.name)}</h3><p>${esc(g.description||'Sin descripción.')}</p><div class="stats"><div class="stat"><small>Integrantes</small><strong>${g.memberCount||0}</strong></div><div class="stat"><small>Cursos</small><strong>${courses(g._id)}</strong></div><div class="stat"><small>Progreso</small><strong>${groupProgress(g._id)}%</strong></div></div><div class="foot"><span class="badge ${g.active===false?'off':''}">${g.active===false?'Inactivo':'Activo'}</span><a class="btn" href="./grupo.html?id=${encodeURIComponent(g._id)}">Gestionar grupo →</a></div>${pending(g._id)?`<div class="status">📥 ${pending(g._id)} entrega(s) pendiente(s)</div>`:''}</article>`).join(''):'<div class="empty">No hay grupos para mostrar.</div>'}async function load(){try{const r=await fetch(API,{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar');state=j;render();$('status').textContent='Datos actualizados desde Wix CMS.'}catch(e){$('grid').innerHTML='<div class="empty">No se pudieron cargar los grupos.</div>';$('status').textContent=e.message}}$('search').oninput=render;load();</script></body></html>
