<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAFASSO · Login formativo</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
:root{
  --ink:#fffaf0;
  --muted:rgba(255,250,240,.72);
  --gold:#f2c267;
  --panel:rgba(15,14,11,.965);
  --line:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#17271f}
body{
  overflow:hidden;
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login-shell{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#17271f;
}
.login-shell:after{
  content:"";
  position:absolute;
  z-index:2;
  inset:0;
  pointer-events:none;
  box-shadow:inset 0 0 120px 35px rgba(10,20,15,.22);
}

.login-scene-stage{
  position:absolute;
  z-index:1;
  left:50%;
  top:50%;
  width:max(100vw,177.68vh);
  aspect-ratio:1672/941;
  transform:translate3d(-50%,-50%,0);
  transform-origin:center;
  container-type:size;
}
.login-scene-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* Este panel cubre exclusivamente el panel dibujado en la imagen aprobada.
   Todo lo que se ve acá es interfaz real. */
.formative-panel{
  position:absolute;
  z-index:4;
  left:5.68%;
  top:6.60%;
  width:24.72%;
  height:74.45%;
  min-height:0;
  padding:3.4cqw 2.15cqw 2.4cqw;
  border-radius:1.35cqw;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 12%,rgba(244,198,108,.06),transparent 28%),
    linear-gradient(180deg,rgba(16,15,12,.985),rgba(20,18,14,.972));
  box-shadow:0 1.3cqw 3cqw rgba(0,0,0,.30);
  pointer-events:auto;
}
.formative-panel:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.035);
  border-radius:inherit;
}
.brand{
  display:flex;
  align-items:center;
  height:7.1cqw;
}
.brand img{
  display:block;
  width:100%;
  height:auto;
}
.formative-title{
  margin:2.6cqw 0 0;
  max-width:18cqw;
  color:#f0c986;
  font:500 1.62cqw/1.28 Inter,system-ui,sans-serif;
  letter-spacing:.105em;
  text-transform:uppercase;
}
.formative-lead{
  margin:1.35cqw 0 0;
  max-width:19.2cqw;
  color:rgba(255,255,255,.84);
  font:500 .88cqw/1.45 Inter,system-ui,sans-serif;
  letter-spacing:.025em;
}
.login-form{
  margin-top:2.15cqw;
}
.field{
  position:relative;
  margin-top:.78cqw;
}
.field label{
  position:absolute;
  width:1px;height:1px;
  overflow:hidden;clip:rect(0,0,0,0);
}
.field input{
  width:100%;
  height:3.05cqw;
  min-height:42px;
  padding:0 1.05cqw 0 3.25cqw;
  border:1px solid var(--line);
  border-radius:1.55cqw;
  outline:0;
  color:#f7f4ee;
  background:rgba(255,255,255,.025);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  font:500 .78cqw/1 Inter,system-ui,sans-serif;
}
.field input::placeholder{color:rgba(255,255,255,.58)}
.field input:focus{
  border-color:rgba(242,194,103,.50);
  box-shadow:0 0 0 .11cqw rgba(242,194,103,.08);
}
.field:before{
  content:"";
  position:absolute;
  z-index:1;
  left:1.12cqw;
  top:50%;
  width:.86cqw;
  height:.86cqw;
  transform:translateY(-50%);
  opacity:.88;
  pointer-events:none;
}
.field.user:before{
  border:.10cqw solid rgba(255,255,255,.82);
  border-radius:50% 50% 44% 44%;
  box-shadow:0 .62cqw 0 -.19cqw rgba(255,255,255,.82);
}
.field.pass:before{
  width:.78cqw;height:.63cqw;
  border:.10cqw solid rgba(255,255,255,.82);
  border-radius:.17cqw;
}
.field.pass:after{
  content:"";
  position:absolute;
  z-index:1;
  left:1.29cqw;
  top:.72cqw;
  width:.46cqw;
  height:.42cqw;
  border:.10cqw solid rgba(255,255,255,.82);
  border-bottom:0;
  border-radius:.35cqw .35cqw 0 0;
  pointer-events:none;
}
#go{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:3.05cqw;
  min-height:44px;
  margin-top:1.55cqw;
  border:0;
  border-radius:1.6cqw;
  color:#211b14;
  background:linear-gradient(90deg,#ffd8a8,#ffe5c5);
  box-shadow:0 .35cqw .9cqw rgba(0,0,0,.12);
  font:750 .88cqw/1 Inter,system-ui,sans-serif;
  transition:transform .15s ease,filter .15s ease;
}
#go:hover{filter:brightness(1.035);transform:translateY(-1px)}
#go:active{transform:translateY(0)}
#go:disabled{opacity:.58;cursor:wait}
.remember{
  display:flex;
  align-items:center;
  gap:.65cqw;
  margin-top:1.1cqw;
  color:rgba(255,255,255,.80);
  font:500 .72cqw/1 Inter,system-ui,sans-serif;
}
.remember-box{
  width:1.1cqw;height:1.1cqw;
  border:1px solid rgba(242,194,103,.70);
  border-radius:.25cqw;
}
.message{
  display:none;
  margin-top:.85cqw;
  padding:.62cqw .75cqw;
  border-radius:.55cqw;
  font:650 .62cqw/1.35 Inter,system-ui,sans-serif;
}
.message.show{display:block}
.message.err{background:rgba(115,45,39,.88);color:#fff1ea}
.message.ok{background:rgba(54,92,67,.88);color:#eff8ef}

.session-note{
  display:none;
  margin-top:.8cqw;
  padding:.65cqw .75cqw;
  border:1px solid rgba(233,216,176,.22);
  border-radius:.55cqw;
  background:rgba(48,31,20,.78);
}
.session-note.show{display:block}
.session-note-text{font:600 .61cqw/1.3 Inter,system-ui,sans-serif;color:#eadcc2}
.session-note-actions{display:flex;gap:.65cqw;margin-top:.45cqw}
.session-note-actions button{
  border:0;background:transparent;color:#f0dfbd;
  font:700 .58cqw Inter,system-ui,sans-serif;text-decoration:underline;
}

#changeBox{
  position:absolute;
  z-index:8;
  left:50%;top:50%;
  width:min(470px,90vw);
  transform:translate(-50%,-50%);
  padding:24px;
  border-radius:20px;
  color:#49372a;
  background:linear-gradient(100deg,rgba(239,218,178,.99),rgba(249,236,207,.99));
  box-shadow:0 24px 60px rgba(26,15,9,.35);
  pointer-events:auto;
}
#changeBox .secure{margin-bottom:14px}
#changeBox .secure b{display:block;font:700 19px Georgia,serif}
#changeBox .secure small{display:block;margin-top:5px;font:13px/1.4 Inter,sans-serif;color:#78624d}
#changeBox .field{margin:12px 0}
#changeBox .field:before,#changeBox .field:after{display:none}
#changeBox .field label{
  position:static;width:auto;height:auto;overflow:visible;clip:auto;
  display:block;margin-bottom:5px;color:#775a41;font:800 11px Inter,sans-serif;
  letter-spacing:.08em;text-transform:uppercase
}
#changeBox .field input{
  min-height:48px;height:auto;padding:10px 12px;
  border:1px solid rgba(103,75,49,.20);border-radius:10px;
  background:rgba(255,253,245,.72);color:#423228;font-size:16px
}
#change{
  width:100%;min-height:48px;margin-top:12px;border:1px solid #735239;
  border-radius:10px;color:#fff7e7;background:#69503b;font:700 16px Georgia,serif
}
.login-shell.changing .formative-panel{filter:brightness(.72)}

.login-transition{
  position:fixed;inset:0;z-index:30;display:grid;place-items:center;
  opacity:0;visibility:hidden;pointer-events:none;background:rgba(8,24,20,.80);
  transition:opacity .32s ease,visibility .32s ease;
}
.login-transition__inner{color:#fff1cf;text-align:center}
.login-transition strong{display:block;font:500 clamp(29px,4.8vw,46px)/1 Georgia,serif}
.login-transition span{display:block;margin-top:8px;color:rgba(255,240,205,.62);font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
.login-shell.entering .login-scene-stage{filter:brightness(.72);transition:filter .48s ease}
.login-shell.entering .login-transition{opacity:1;visibility:visible}

@media(max-width:760px) and (orientation:portrait){
  .login-scene-stage{
    left:173%;
    top:50%;
    width:max(100vw,177.68svh);
  }
  .formative-panel{
    padding:3.1cqw 2.15cqw 2.2cqw;
  }
  .field input{font-size:16px}
  .formative-title{font-size:1.75cqw}
  .formative-lead{font-size:.93cqw}
}
@supports not (height:100svh){
  @media(max-width:760px) and (orientation:portrait){
    .login-scene-stage{width:max(100vw,177.68vh)}
  }
}
@media(prefers-reduced-motion:reduce){
  .login-transition{transition:none!important}
}
</style>
</head>
<body>
<main class="login-shell" id="loginShell">
  <div class="login-scene-stage">
    <img class="login-scene-image"
      src="https://static.wixstatic.com/media/47bf07_522938aeaaaa4ff2802523b250fb2a08~mv2.png"
      alt="" aria-hidden="true" fetchpriority="high" decoding="async">

    <section class="formative-panel" aria-label="Ingreso a CAFASSO">
      <div class="brand"><img src="./cafasso-logo.svg" alt="CAFASSO"></div>
      <h1 class="formative-title">Formación para<br>un futuro<br>más humano</h1>
      <p class="formative-lead">Aprende, comparte y construye comunidades que transforman territorios.</p>

      <div id="loginBox" class="login-form">
        <div class="field user">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="Usuario o correo">
        </div>
        <div class="field pass">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
        </div>
        <button id="go" type="button">Ingresar</button>
        <div class="remember" aria-hidden="true"><span class="remember-box"></span><span>Recordarme</span></div>
      </div>

      <div id="msg" class="message"></div>
      <div id="sessionNote" class="session-note">
        <div class="session-note-text">Ya hay una sesión iniciada en este dispositivo.</div>
        <div class="session-note-actions">
          <button id="continueSession" type="button">Continuar</button>
          <button id="newLogin" type="button">Ingresar de nuevo</button>
        </div>
      </div>
    </section>
  </div>

  <div id="changeBox" class="hidden">
    <div class="secure">
      <b>Elegí tu contraseña definitiva</b>
      <small>La contraseña temporal dejará de servir cuando completes este paso.</small>
    </div>
    <div class="field">
      <label for="newPassword">Nueva contraseña</label>
      <input id="newPassword" type="password" autocomplete="new-password" placeholder="Al menos 10 caracteres">
    </div>
    <div class="field">
      <label for="repeatPassword">Repetir contraseña</label>
      <input id="repeatPassword" type="password" autocomplete="new-password" placeholder="Repetila">
    </div>
    <button id="change" type="button">Guardar y entrar →</button>
  </div>

  <div class="login-transition" id="loginTransition" aria-hidden="true">
    <div class="login-transition__inner">
      <strong id="transitionTitle">Entrando a Casa…</strong>
      <span>CAFASSO</span>
    </div>
  </div>
</main>
<script>
const AUTH_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAuth';
const $=id=>document.getElementById(id);
const go=$('go'),change=$('change'),msg=$('msg'),sessionNote=$('sessionNote');
let pending=null;

function message(text,type){
  msg.textContent=text;
  msg.className='message show '+type;
}
async function api(body,token=''){
  const r=await fetch(AUTH_API,{
    method:'POST',
    headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},
    body:JSON.stringify(body)
  });
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo completar el acceso.');
  return j;
}
function save(j){
  localStorage.setItem('cafassoAuth',JSON.stringify({sessionToken:j.token,expiresAt:new Date(j.expiresAt).getTime()}));
  localStorage.setItem('cafassoSession',JSON.stringify({authenticated:true,user:j.user,checkedAt:Date.now()}));
}
function clearLocalSession(){
  localStorage.removeItem('cafassoSession');
  localStorage.removeItem('cafassoAuth');
  sessionNote.classList.remove('show');
}
function route(user){
  $('transitionTitle').textContent='Entrando a Casa…';
  $('loginShell').classList.add('entering');
  $('loginTransition').setAttribute('aria-hidden','false');
  setTimeout(()=>location.replace('./'),420);
}
async function login(){
  const email=$('email').value.trim().toLowerCase();
  const password=$('password').value;
  if(!email||!password){message('Ingresá correo y contraseña.','err');return}
  go.disabled=true;go.textContent='Ingresando…';
  try{
    const j=await api({action:'login',email,password});
    pending=j;sessionNote.classList.remove('show');
    if(j.mustChangePassword){
      $('loginBox').classList.add('hidden');
      $('changeBox').classList.remove('hidden');
      $('loginShell').classList.add('changing');
      message('Acceso temporal correcto. Elegí ahora tu contraseña definitiva.','ok');
      $('newPassword').focus();return;
    }
    save(j);message('Bienvenido/a, '+(j.user.name||'')+'.','ok');
    setTimeout(()=>route(j.user),140);
  }catch(e){message(e.message,'err')}
  finally{go.disabled=false;go.textContent='Ingresar'}
}
async function changePassword(){
  const a=$('newPassword').value,b=$('repeatPassword').value;
  if(a.length<10){message('La nueva contraseña debe tener al menos 10 caracteres.','err');return}
  if(a!==b){message('Las dos contraseñas no coinciden.','err');return}
  change.disabled=true;change.textContent='Guardando…';
  try{
    const j=await api({action:'changePassword',newPassword:a},pending.token);
    save(j);message('Contraseña guardada.','ok');setTimeout(()=>route(j.user),140);
  }catch(e){message(e.message,'err')}
  finally{change.disabled=false;change.textContent='Guardar y entrar →'}
}
go.onclick=login;change.onclick=changePassword;
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('repeatPassword').addEventListener('keydown',e=>{if(e.key==='Enter')changePassword()});
(()=>{
  try{
    const s=JSON.parse(localStorage.getItem('cafassoSession')||'null');
    const a=JSON.parse(localStorage.getItem('cafassoAuth')||'null');
    if(!s?.authenticated||!s?.user||!a?.sessionToken)return;
    if(Number(a.expiresAt||0)<=Date.now()){clearLocalSession();return}
    sessionNote.classList.add('show');
    $('continueSession').onclick=()=>route(s.user);
    $('newLogin').onclick=()=>{clearLocalSession();$('email').focus()};
  }catch(e){clearLocalSession()}
})();
</script>
</body>
</html>
