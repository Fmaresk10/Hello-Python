<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f42">
<title>CAFASSO · Elegí tu experiencia</title>
<link rel="icon" href="./favicon.svg">
<style>
:root{--ink:#173f42;--cream:#f6f1e7;--paper:#fffaf1;--gold:#d8b85c;--muted:#687b76}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#173f42;color:#243c3b}
body{min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:
linear-gradient(rgba(9,35,37,.54),rgba(9,35,37,.70)),
url("https://static.wixstatic.com/media/47bf07_522938aeaaaa4ff2802523b250fb2a08~mv2.png") center/cover fixed}
.shell{width:min(1080px,100%)}.brand{display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:22px}.brand img{width:52px;height:52px}.brand strong{display:block;font:600 28px/1 Georgia,serif;letter-spacing:.02em}.brand span{display:block;margin-top:4px;color:rgba(255,255,255,.68);font-size:11px;letter-spacing:.10em;text-transform:uppercase}
.panel{padding:clamp(22px,4vw,42px);border:1px solid rgba(255,255,255,.16);border-radius:28px;background:rgba(247,241,229,.94);box-shadow:0 28px 80px rgba(0,0,0,.28);backdrop-filter:blur(16px)}
.eyebrow{color:#71827b;font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.panel h1{margin:8px 0 8px;font:500 clamp(34px,5vw,58px)/1.02 Georgia,serif;color:var(--ink)}.lead{max-width:720px;margin:0;color:#5f706a;font-size:14px;line-height:1.55}
.options{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.option{position:relative;min-height:315px;padding:26px;border:1px solid #ddd3c2;border-radius:22px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;transition:.22s ease}.option:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(33,54,51,.14);border-color:#cab777}.option:before{content:"";position:absolute;inset:0;opacity:.17;pointer-events:none}.option.animadores:before{background:radial-gradient(circle at 82% 16%,#e0c66c,transparent 30%),linear-gradient(135deg,#16444a,#6f8c72)}.option.educadores:before{background:radial-gradient(circle at 78% 18%,#d7bb70,transparent 30%),linear-gradient(135deg,#f0e4cb,#8aa08f)}
.icon{position:relative;display:grid;place-items:center;width:54px;height:54px;border-radius:18px;background:rgba(23,63,66,.92);color:#fff;font-size:24px}.option h2{position:relative;margin:60px 0 6px;font:600 28px/1.05 Georgia,serif;color:#173f42}.option p{position:relative;max-width:390px;margin:0;color:#61706b;font-size:13px;line-height:1.5}.cta{position:absolute;left:26px;bottom:24px;display:inline-flex;align-items:center;gap:8px;color:#173f42;font-size:11px;font-weight:900;letter-spacing:.04em}.cta b{font-size:18px}
.note{margin-top:16px;color:#7b817a;font-size:10px;text-align:center}
@media(max-width:760px){body{place-items:start center}.brand{margin-top:8px}.panel{border-radius:22px}.options{grid-template-columns:1fr}.option{min-height:230px}.option h2{margin-top:35px}.lead{font-size:13px}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><img src="./cafasso-logo.svg" alt=""><div><strong>CAFASSO</strong><span>Una misma casa · dos maneras de habitarla</span></div></div>
  <section class="panel">
    <div class="eyebrow">Tu experiencia</div>
    <h1>¿Cómo querés entrar hoy?</h1>
    <p class="lead">CAFASSO conserva la misma comunidad, los mismos cursos y tu mismo progreso. Lo que cambia es la manera de recorrerlo.</p>
    <div class="options">
      <button class="option animadores" data-experience="animadores" type="button">
        <span class="icon">✦</span>
        <h2>CAFASSO Animadores</h2>
        <p>La experiencia inmersiva: mundos, exploración, misiones y recorrido gamificado.</p>
        <span class="cta">Entrar al mundo <b>→</b></span>
      </button>
      <button class="option educadores" data-experience="educadores" type="button">
        <span class="icon">⌂</span>
        <h2>Casa de Formación</h2>
        <p>Una experiencia serena y directa para educadores: formación, recursos, interioridad y camino personal.</p>
        <span class="cta">Entrar a la casa <b>→</b></span>
      </button>
    </div>
    <div class="note">Podés cambiar de experiencia más adelante sin perder ningún avance.</div>
  </section>
</main>
<script>
(()=>{
  let session=null;
  try{session=JSON.parse(localStorage.getItem('cafassoSession')||'null')}catch(e){}
  if(!session?.authenticated||!session?.user){location.replace('./login.html');return}
  document.querySelectorAll('[data-experience]').forEach(btn=>btn.addEventListener('click',()=>{
    const mode=btn.dataset.experience;
    localStorage.setItem('cafassoExperience',mode);
    location.replace(mode==='educadores'?'./educadores.html':'./');
  }));
})();
</script>
</body>
</html>
