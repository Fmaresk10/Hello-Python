<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFASSO</title>
<style>
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#102f33}
.cafasso-foundation{background:#102f33}
.cafasso-house{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden}
.cafasso-house:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 38% 34% at 63% 24%,rgba(255,210,124,.18),transparent 72%);mix-blend-mode:screen;opacity:.72;animation:cafassoHouseLight 6s ease-in-out infinite alternate}
.cafasso-house__image{display:block;width:100%;height:100%;object-fit:cover}
@keyframes cafassoHouseLight{from{opacity:.48;transform:translate(-2%,2%)}to{opacity:.94;transform:translate(2%,-2%)}}
@media (prefers-reduced-motion:reduce){.cafasso-house:after{animation:none!important}}
</style>
</head>
<body><div id="app"></div><script src="./animator-foundation-v1.js?v=20260914-3"></script></body>
</html>
