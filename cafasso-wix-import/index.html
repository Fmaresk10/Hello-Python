<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFASSO · Formación de Animadores</title>
<style>
:root{--navy:#0F2D4D;--navy2:#123A61;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A;--shadow:0 14px 35px rgba(22,34,55,.10)}*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--navy),#0A2440);color:#fff;padding:28px 22px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:13px;align-items:center;margin-bottom:34px}.brand img{width:44px;height:52px;object-fit:contain}.brand-title{font-family:Georgia,serif;font-size:26px}.brand-sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.76;margin-top:5px}.school{font-size:11px;opacity:.65;margin-top:4px}.nav{display:grid;gap:8px}.nav a{color:#fff;text-decoration:none;padding:13px 14px;border-radius:14px;font-size:14px;font-weight:700;display:flex;gap:10px;align-items:center}.nav a.active,.nav a:hover{background:rgba(255,255,255,.1)}.dot{width:9px;height:9px;border:2px solid var(--gold);border-radius:50%}.sidebar-bottom{position:absolute;left:22px;right:22px;bottom:24px}.motto{font-family:Georgia,serif;font-style:italic;color:#F7D276;line-height:1.4}.account-links{margin-top:18px;border-top:1px solid rgba(255,255,255,.17);padding-top:14px;display:grid;gap:10px}.account-links a,.account-links button{background:none;border:0;color:#fff;text-decoration:none;padding:0;font:inherit;font-size:12px;text-align:left;cursor:pointer;opacity:.9}main{padding:34px 36px 48px;max-width:1450px;width:100%;margin:auto;min-width:0}.view{display:none}.view.active{display:block}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:24px}.greeting h1,.page-head h1{font-family:Georgia,serif;color:var(--navy);font-size:38px;margin:0}.greeting p,.page-head p{margin:7px 0 0;color:var(--muted)}.user-pill{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900;color:var(--navy)}.hero{background:var(--navy);color:#fff;border-radius:30px;box-shadow:var(--shadow);padding:38px 40px;display:grid;grid-template-columns:1.25fr .75fr;gap:25px;align-items:end}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#F5D274;font-weight:800}.hero h2{font-family:Georgia,serif;font-size:45px;margin:10px 0 12px}.hero p{color:#E5EBF1;line-height:1.55}.progress-row{display:flex;justify-content:space-between;font-size:13px;margin:18px 0 7px}.bar{height:9px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}.bar span{height:100%;display:block;background:var(--gold);border-radius:999px}.quote-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:20px;border-radius:20px}.quote-box strong{font-family:Georgia,serif;font-size:23px;display:block}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:13px;padding:12px 16px;background:var(--gold);color:var(--navy);font-weight:850;text-decoration:none;cursor:pointer}.btn.alt{background:#fff;border:1px solid var(--line)}.section-title{display:flex;align-items:end;justify-content:space-between;margin:32px 0 14px}.section-title h3{font-family:Georgia,serif;font-size:28px;color:var(--navy);margin:0}.section-title a{color:var(--navy);font-weight:800;font-size:13px;text-decoration:none}.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:23px;box-shadow:0 8px 22px rgba(25,37,54,.05)}.course{padding:20px}.course-top{display:flex;justify-content:space-between;gap:12px}.course-icon{width:46px;height:46px;border-radius:14px;background:#EAF0F7;display:grid;place-items:center;font-size:22px}.badge{font-size:11px;font-weight:850;border-radius:999px;padding:7px 10px;background:#EDF5F1;color:var(--green);height:max-content}.badge.gold{background:#FFF4CC;color:#886500}.badge.gray{background:#F0F1F2;color:#69717C}.course h4{font-size:19px;color:var(--navy);margin:17px 0 7px}.course p{color:var(--muted);font-size:13px;line-height:1.45;min-height:38px}.mini{height:7px;background:#ECE5D9;border-radius:999px;overflow:hidden;margin:17px 0 13px}.mini span{display:block;height:100%;background:var(--green)}.course-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.course-foot button{border:0;background:none;color:var(--navy);font-weight:850;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{padding:19px;background:#F7F1E8;border-radius:18px}.stat strong{display:block;font-family:Georgia,serif;font-size:29px;color:var(--navy)}.stat span{font-size:12px;color:var(--muted)}.list{display:grid;gap:12px}.module{padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.module strong{color:var(--navy)}.module small{color:var(--muted)}.profile-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.profile-card{padding:24px}.big-avatar{width:88px;height:88px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--navy)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12px;font-weight:750}.empty{padding:36px;text-align:center;color:var(--muted)}.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted)}.error{background:#FFF1F1;border:1px solid #EBC7C7;color:#A64747;border-radius:18px;padding:18px}.admin-only{display:none}@media(max-width:1050px){.shell{grid-template-columns:88px 1fr}.brand-copy,.nav .label,.sidebar-bottom{display:none}.brand{justify-content:center}.nav a{justify-content:center}.courses{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:720px){.shell{display:block}.sidebar{height:auto;position:static;padding:11px 13px;display:flex;align-items:center;justify-content:space-between}.brand{margin:0}.brand img{width:34px;height:40px}.nav{display:flex}.nav a{padding:10px}.nav a:nth-child(n+4){display:none}main{padding:20px 14px 34px}.topbar{align-items:flex-start;flex-direction:column}.greeting h1,.page-head h1{font-size:31px}.courses,.profile-grid{grid-template-columns:1fr}.hero{padding:27px 23px}.hero h2{font-size:37px}}
</style>
</head>
<body>
<div id="app" class="loading">Cargando tu espacio CAFASSO…</div>
<script>
const ADMIN_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';
const COURSE_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';
const CREST='https://static.wixstatic.com/media/47bf07_3bf4fe6421f34a05990caa87c98fffc2~mv2.webp';
let session=null,data=null,myCourses=[],selectedCourse=null;
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function getSession(){try{return JSON.parse(localStorage.getItem('cafassoSession')||'null')}catch(e){return null}}
function initials(name=''){const p=name.trim().split(/\s+/).filter(Boolean);return ((p[0]?.[0]||'A')+(p[1]?.[0]||'')).toUpperCase()}
function progressFor(courseId){const rows=(data.progress||[]).filter(p=>p.userId===session.user._id&&p.courseId===courseId);if(!rows.length)return 0;return Math.max(0,Math.min(100,Math.round(rows.reduce((s,p)=>s+Number(p.percent||0),0)/rows.length)))}
function courseState(p){return p>=100?['COMPLETADO','gold']:p>0?['EN CURSO','']:['NO INICIADO','gray']}
function assignedCourses(){const uid=session.user._id,gid=session.user.groupId;const ids=new Set((data.assignments||[]).filter(a=>a.active!==false&&((a.targetType==='user'&&a.targetId===uid)||(a.targetType==='group'&&a.targetId===gid))).map(a=>a.courseId));return (data.courses||[]).filter(c=>ids.has(c._id)&&c.status==='Publicado').map(c=>({...c,myProgress:progressFor(c._id)}))}
function goto(view,replace=false){const hash='#'+view;if(replace)history.replaceState(null,'',hash);else if(location.hash!==hash)history.pushState(null,'',hash);renderView(view)}
function shell(){const u=session.user;const isAdmin=String(u.role||'').toLowerCase().includes('admin');document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><img src="${CREST}" alt="Maturana"><div class="brand-copy"><div class="brand-title">CAFASSO</div><div class="brand-sub">Formación de Animadores</div><div class="school">Colegio Salesiano Maturana</div></div></div><nav class="nav"><a href="#inicio" data-nav="inicio"><span class="dot"></span><span class="label">Inicio</span></a><a href="#cursos" data-nav="cursos"><span class="dot"></span><span class="label">Mis cursos</span></a><a href="#certificados" data-nav="certificados"><span class="dot"></span><span class="label">Certificados</span></a><a href="#perfil" data-nav="perfil"><span class="dot"></span><span class="label">Mi perfil</span></a></nav><div class="sidebar-bottom"><div class="motto">Caminamos juntos,<br>animamos con el corazón.</div><div class="account-links">${isAdmin?'<a href="./admin.html">Administración →</a>':''}<button id="logout">Cerrar sesión</button></div></div></aside><main id="main"></main></div>`;document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();goto(a.dataset.nav)});document.getElementById('logout').onclick=()=>{localStorage.removeItem('cafassoSession');location.replace('./login.html')};}
function top(title,sub=''){const u=session.user;return `<div class="topbar"><div class="greeting"><h1>${title}</h1><p>${sub}</p></div><div class="user-pill"><div class="avatar">${initials(u.name)}</div><span>${esc(u.name)}</span></div></div>`}
function courseCard(c){const [label,cls]=courseState(c.myProgress);return `<article class="card course"><div class="course-top"><div class="course-icon">📘</div><span class="badge ${cls}">${label}</span></div><h4>${esc(c.title)}</h4><p>${esc(c.subtitle||c.description||'Recorrido de formación CAFASSO.')}</p><div class="mini"><span style="width:${c.myProgress}%"></span></div><div class="course-foot"><span>${c.myProgress}% completado</span><button data-course="${c._id}">${c.myProgress?'Continuar':'Comenzar'} →</button></div></article>`}
function bindCourses(){document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course))}
function renderView(view){if(!document.getElementById('main'))shell();document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===view));const main=document.getElementById('main'),u=session.user;myCourses=assignedCourses();const avg=myCourses.length?Math.round(myCourses.reduce((s,c)=>s+c.myProgress,0)/myCourses.length):0;const completed=myCourses.filter(c=>c.myProgress>=100).length;
if(view==='inicio'){const current=myCourses.find(c=>c.myProgress>0&&c.myProgress<100)||myCourses[0];main.innerHTML=top(`¡Buenas, ${esc((u.name||'').split(' ')[0]||'animador/a')}! 👋`,'Qué bueno encontrarte de nuevo. Sigamos caminando.')+(current?`<section class="hero"><div><div class="eyebrow">Continuá tu formación</div><h2>${esc(current.title)}</h2><p>${esc(current.subtitle||current.description||'Tu recorrido de formación salesiana.')}</p><div class="progress-row"><span>Tu avance</span><strong>${current.myProgress}%</strong></div><div class="bar"><span style="width:${current.myProgress}%"></span></div><div style="margin-top:20px"><button class="btn" data-course="${current._id}">Continuar recorrido →</button></div></div><div class="quote-box"><strong>Formarnos para acompañar</strong><span>Presencia, cercanía y misión en el camino de cada joven.</span></div></section>`:`<div class="card empty">Todavía no tenés cursos publicados asignados.</div>`)+`<div class="section-title"><h3>Mis cursos</h3><a href="#cursos" data-go="cursos">Ver todos →</a></div><section class="courses">${myCourses.length?myCourses.slice(0,3).map(courseCard).join(''):'<div class="card empty">Cuando te asignemos un curso va a aparecer acá.</div>'}</section><section class="stats"><div class="stat"><strong>${myCourses.length}</strong><span>Cursos asignados</span></div><div class="stat"><strong>${completed}</strong><span>Cursos completados</span></div><div class="stat"><strong>${avg}%</strong><span>Progreso promedio</span></div><div class="stat"><strong>${esc(u.groupName||'—')}</strong><span>Grupo</span></div></section>`;bindCourses();main.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();goto(a.dataset.go)});return}
if(view==='cursos'){main.innerHTML=top('Mis cursos','Acá aparecen únicamente los recorridos que te fueron asignados.')+`<section class="courses">${myCourses.length?myCourses.map(courseCard).join(''):'<div class="card empty">No tenés cursos asignados todavía.</div>'}</section>`;bindCourses();return}
if(view==='certificados'){const done=myCourses.filter(c=>c.myProgress>=100);main.innerHTML=top('Mis certificados','Reconocimientos de los recorridos que ya completaste.')+`<section class="courses">${done.length?done.map(c=>`<article class="card course"><div class="course-top"><div class="course-icon">🏅</div><span class="badge gold">COMPLETADO</span></div><h4>${esc(c.title)}</h4><p>Curso completado al 100%.</p><div class="course-foot"><span>Certificado habilitado</span><span>Próximamente PDF</span></div></article>`).join(''):'<div class="card empty">Tus certificados aparecerán acá cuando completes un curso.</div>'}</section>`;return}
if(view==='perfil'){main.innerHTML=top('Mi perfil','Tu recorrido personal dentro de CAFASSO.')+`<div class="profile-grid"><article class="card profile-card"><div class="big-avatar">${initials(u.name)}</div><h2 style="font-family:Georgia,serif;color:var(--navy);margin-bottom:5px">${esc(u.name)}</h2><p style="color:var(--muted)">${esc(u.role||'Animador')} · ${esc(u.groupName||'Sin grupo')}</p><p style="color:var(--muted);font-size:13px">${esc(u.email)}</p><div class="chips"><span class="chip">${myCourses.length} cursos</span><span class="chip">${completed} certificados</span><span class="chip">${avg}% progreso</span></div></article><article class="card profile-card"><h3 style="font-family:Georgia,serif;color:var(--navy);font-size:26px;margin-top:0">Mi camino</h3><div class="list">${myCourses.length?myCourses.map(c=>`<div class="module"><div><strong>${esc(c.title)}</strong><br><small>${c.myProgress>=100?'Completado':c.myProgress>0?'En curso':'No iniciado'} · ${c.myProgress}%</small></div></div>`).join(''):'<div class="empty">Todavía no hay recorridos.</div>'}</div></article></div>`;return}
if(view==='curso'&&selectedCourse){renderCourse(selectedCourse);return}goto('inicio',true)}
async function openCourse(id){const summary=myCourses.find(c=>c._id===id);document.getElementById('main').innerHTML='<div class="loading">Cargando curso…</div>';try{const r=await fetch(COURSE_API+'?id='+encodeURIComponent(id));const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar el curso.');selectedCourse={...j.course,myProgress:summary?.myProgress||0};goto('curso')}catch(e){document.getElementById('main').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderCourse(c){const main=document.getElementById('main');main.innerHTML=top(c.title,`${c.modules.length} módulos · ${c.myProgress}% completado`)+`<section class="hero" style="margin-bottom:20px"><div><div class="eyebrow">Tu recorrido</div><h2>${esc(c.title)}</h2><p>${esc(c.description||c.subtitle||'Recorrido formativo CAFASSO.')}</p><div class="progress-row"><span>Avance del curso</span><strong>${c.myProgress}%</strong></div><div class="bar"><span style="width:${c.myProgress}%"></span></div></div><div class="quote-box"><strong>Un paso a la vez</strong><span>Los módulos y contenidos se actualizan desde Administración.</span></div></section><div class="list">${c.modules.length?c.modules.map((m,i)=>`<article class="card module"><div><strong>${i+1} · ${esc(m.title)}</strong><br><small>${esc(m.desc||'Módulo de formación')} · ${Number(m.estimatedMinutes||0)} min</small></div><span class="badge ${m.status==='Publicado'?'':'gray'}">${esc(m.status||'Borrador')}</span></article>`).join(''):'<div class="card empty">Este curso todavía no tiene módulos publicados.</div>'}</div>`}
async function init(){session=getSession();if(!session?.user?.email){location.replace('./login.html');return}try{const r=await fetch(ADMIN_API);const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar CAFASSO.');data=j;const fresh=(data.users||[]).find(u=>String(u.email).toLowerCase()===String(session.user.email).toLowerCase());if(!fresh||['Bloqueado','Inactivo'].includes(fresh.status)){localStorage.removeItem('cafassoSession');location.replace('./login.html');return}session.user={...session.user,...fresh};localStorage.setItem('cafassoSession',JSON.stringify({...session, user:session.user, checkedAt:Date.now()}));shell();renderView((location.hash||'#inicio').slice(1))}catch(e){document.getElementById('app').className='';document.getElementById('app').innerHTML=`<main><div class="error"><strong>No pudimos cargar tu espacio.</strong><br>${esc(e.message)}</div></main>`}}
window.addEventListener('popstate',()=>renderView((location.hash||'#inicio').slice(1)));window.addEventListener('hashchange',()=>renderView((location.hash||'#inicio').slice(1)));init();
</script>
</body>
</html>
