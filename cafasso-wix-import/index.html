<div id="app" class="loading">Cargando tu espacio CAFASSO…</div>
<script>
(function(){
  var ADMIN_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';
  var AUTH_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAuth';
  var COURSE_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';
  var PROGRESS_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoProgress';
  var SUBMISSION_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoSubmission';
  var CREST='./cafasso-mark.svg';
  var session=null,data=null,myCourses=[],selectedCourse=null,selectedModule=null,courseSubmissions=[];
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
  function readSession(){try{return JSON.parse(localStorage.getItem('cafassoSession')||'null');}catch(e){return null;}}
  function initials(name){var p=String(name||'').trim().split(/\s+/);return ((p[0]&&p[0][0]||'A')+(p[1]&&p[1][0]||'')).toUpperCase();}
  function isAdmin(){return String(session.user.role||'').toLowerCase().indexOf('admin')!==-1;}
  function progressRecord(courseId){return (data.progress||[]).filter(function(p){return p.userId===session.user._id&&p.courseId===courseId;})[0]||null;}
  function getProgress(courseId){var p=progressRecord(courseId);return p?Number(p.percent||0):0;}
  function completedModules(courseId){var p=progressRecord(courseId);return p&&Array.isArray(p.completedModules)?p.completedModules:[];}
  function assignedCourses(){var uid=session.user._id,gid=session.user.groupId,ids={};(data.assignments||[]).forEach(function(a){if(a.active===false)return;if(a.targetType==='user'&&a.targetId===uid)ids[a.courseId]=true;if(a.targetType==='group'&&gid&&a.targetId===gid)ids[a.courseId]=true;});return (data.courses||[]).filter(function(c){return ids[c._id]&&c.status==='Publicado';}).map(function(c){var copy={};for(var k in c)copy[k]=c[k];copy.myProgress=getProgress(c._id);return copy;});}
  function moduleStoreKey(){return 'cafasso-module-work-'+session.user._id+'-'+selectedCourse._id+'-'+selectedModule._id;}
  function readModuleWork(){try{return JSON.parse(localStorage.getItem(moduleStoreKey())||'{"done":{},"answers":{}}');}catch(e){return {done:{},answers:{}};}}
  function saveModuleWork(work){localStorage.setItem(moduleStoreKey(),JSON.stringify(work));}
  function submissionFor(blockId){return courseSubmissions.filter(function(s){return s.activityId===blockId;})[0]||null;}
  function activityAnswer(blockId,work){var s=submissionFor(blockId);return s&&s.content!=null?s.content:((work.answers||{})[blockId]||'');}
  function requiredBlocks(){return (selectedModule.contents||[]).filter(function(b){return b.required!==false;});}
  function isBlockDone(block,work){if(block.required===false)return true;var t=String(block.type||'').toLowerCase();if(t==='reflexión'||t==='entrega'||t==='evaluación')return !!String(activityAnswer(block._id,work)||'').trim();return !!(work.done||{})[block._id];}
  function requiredStatus(){var work=readModuleWork(),req=requiredBlocks(),done=req.filter(function(b){return isBlockDone(b,work);}).length;return {work:work,total:req.length,done:done,ready:req.length===0||done===req.length};}
  function layout(){document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="shell"><aside class="side"><div class="brand"><a href="./" aria-label="Volver al inicio" style="display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none"><img src="'+CREST+'" alt="Maturana"><div><b>CAFASSO</b><small>Formación de Animadores</small></div></a></div><div class="nav"><button data-view="inicio"><span>Inicio</span></button><button data-view="cursos"><span>Mis cursos</span></button><button data-view="certificados"><span>Certificados</span></button><button data-view="perfil"><span>Mi perfil</span></button></div><div class="foot"><div class="motto">Caminamos juntos,<br>animamos con el corazón.</div>'+(isAdmin()?'<a href="./admin.html">Administración →</a>':'')+'<button id="logout">Cerrar sesión</button></div></aside><header class="mobile-head"><a class="mobile-brand" href="./" aria-label="Inicio CAFASSO"><img src="'+CREST+'" alt="Maturana"><div><b>CAFASSO</b><small>FORMACIÓN DE ANIMADORES</small></div></a><button class="mobile-user" data-view="perfil" aria-label="Mi perfil"><div class="avatar">'+initials(session.user.name)+'</div></button></header><main id="main"></main><nav class="mobilebar" aria-label="Navegación principal"><button data-view="inicio">Inicio</button><button data-view="cursos">Cursos</button><button data-view="certificados">Logros</button><button data-view="perfil">Perfil</button></nav><nav class="mobile-nav" aria-label="Navegación principal"><button data-view="inicio"><span class="ico">⌂</span><span>Inicio</span></button><button data-view="cursos"><span class="ico">▤</span><span>Cursos</span></button><button data-view="perfil"><span class="ico">●</span><span>Perfil</span></button><button id="mobileMore"><span class="ico">•••</span><span>Más</span></button></nav><div id="mobileMoreWrap" class="mobile-more"><section class="mobile-sheet"><div class="mobile-sheet-head"><strong>Más opciones</strong><button class="close" id="mobileMoreClose" aria-label="Cerrar">×</button></div><button data-view="certificados">🏅 Certificados</button>'+(isAdmin()?'<a href="./admin.html">⚙️ Administración</a>':'')+'<button class="danger" id="mobileLogout">↪ Cerrar sesión</button></section></div></div>';Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){b.onclick=function(){var w=document.getElementById('mobileMoreWrap');if(w)w.classList.remove('show');navigate(b.getAttribute('data-view'));};});document.getElementById('logout').onclick=logout;var more=document.getElementById('mobileMore'),wrap=document.getElementById('mobileMoreWrap'),close=document.getElementById('mobileMoreClose'),ml=document.getElementById('mobileLogout');if(more)more.onclick=function(){wrap.classList.add('show');};if(close)close.onclick=function(){wrap.classList.remove('show');};if(wrap)wrap.onclick=function(e){if(e.target===wrap)wrap.classList.remove('show');};if(ml)ml.onclick=logout;}
  function top(title,sub){var u=session.user;return '<div class="top"><div><h1>'+title+'</h1><p>'+esc(sub||'')+'</p></div><div class="pill"><div class="avatar">'+initials(u.name)+'</div><span>'+esc(u.name)+'</span></div></div>';}
  function badge(p){if(p>=100)return '<span class="badge gold">COMPLETADO</span>';if(p>0)return '<span class="badge">EN CURSO</span>';return '<span class="badge gray">NO INICIADO</span>';}

  async function changeOwnPassword(){var a=document.getElementById('profilePassword'),b=document.getElementById('profilePassword2'),msg=document.getElementById('passwordMsg'),btn=document.getElementById('savePassword');if(!a||!b)return;var next=a.value,repeat=b.value;if(next.length<10){msg.textContent='La contraseña debe tener al menos 10 caracteres.';msg.style.color='var(--red)';return}if(next!==repeat){msg.textContent='Las dos contraseñas no coinciden.';msg.style.color='var(--red)';return}btn.disabled=true;btn.textContent='Guardando…';try{var r=await fetch(AUTH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'changePassword',newPassword:next})});var j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cambiar la contraseña.');localStorage.setItem('cafassoAuth',JSON.stringify({sessionToken:j.token,expiresAt:new Date(j.expiresAt).getTime()}));session.user=j.user||session.user;localStorage.setItem('cafassoSession',JSON.stringify({authenticated:true,user:session.user,checkedAt:Date.now()}));a.value='';b.value='';msg.textContent='Contraseña actualizada correctamente.';msg.style.color='var(--green)';}catch(e){msg.textContent=e.message||'No se pudo cambiar la contraseña.';msg.style.color='var(--red)';}finally{btn.disabled=false;btn.textContent='Cambiar contraseña';}}
  function navigate(view,replace){var url=location.pathname+location.search+'#'+view;if(replace)history.replaceState({view:view},'',url);else if(location.hash!=='#'+view)history.pushState({view:view},'',url);render(view);}

aseña</button></div><div id="passwordMsg" style="min-height:20px;font-size:13px;font-weight:700"></div></div></div>';document.getElementById('savePassword').onclick=changeOwnPassword;return;}if(view==='curso'&&selectedCourse){renderCourse();return;}if(view==='modulo'&&selectedCourse&&selectedModule){renderModule();return;}navigate('inicio',true);}
  function loadCourseSubmissions(courseId){return fetch(SUBMISSION_API+'?userId='+encodeURIComponent(session.user._id)+'&courseId='+encodeURIComponent(courseId),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudieron cargar las respuestas.');courseSubmissions=x.j.submissions||[];}).catch(function(e){console.warn(e);courseSubmissions=[];});}
  function openCourse(id){var main=document.getElementById('main');main.innerHTML='<div class="loading">Cargando curso…</div>';fetch(COURSE_API+'?id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo cargar el curso.');selectedCourse=x.j.course;selectedCourse.myProgress=getProgress(id);selectedModule=null;return loadCourseSubmissions(id);}).then(function(){navigate('curso');}).catch(function(e){main.innerHTML='<div class="error">'+esc(e.message)+'</div>';});}
  function publishedModules(){return (selectedCourse.modules||[]).filter(function(m){return m.status==='Publicado';});}
  function moduleUnlocked(mod,index,mods,doneIds){if(index===0)return true;if(mod.unlockAfterPrevious===false)return true;return doneIds.indexOf(mods[index-1]._id)!==-1;}
  function renderCourse(){var c=selectedCourse,main=document.getElementById('main'),mods=publishedModules(),doneIds=completedModules(c._id);c.myProgress=getProgress(c._id);var modules=mods.length?mods.map(function(m,i){var done=doneIds.indexOf(m._id)!==-1,unlocked=moduleUnlocked(m,i,mods,doneIds);return '<article class="card module"><div><strong>'+(i+1)+' · '+esc(m.title)+'</strong><br><small>'+esc(m.desc||'Módulo de formación')+' · '+Number(m.estimatedMinutes||0)+' min</small></div><div class="module-actions">'+(done?'<span class="badge gold">COMPLETADO</span>':unlocked?'<span class="badge">DISPONIBLE</span>':'<span class="badge gray">BLOQUEADO</span>')+'<button class="btn '+(done?'alt':'')+'" data-module="'+m._id+'" '+(unlocked?'':'disabled')+'>'+(done?'Revisar':'Abrir módulo')+'</button></div></article>';}).join(''):'<div class="card empty">Este curso todavía no tiene módulos publicados.</div>';main.innerHTML=top(esc(c.title),mods.length+' módulos · '+c.myProgress+'% completado')+'<div class="backline"><button id="backCourses">← Mis cursos</button></div><section class="hero"><div><h2>'+esc(c.title)+'</h2><p>'+esc(c.description||c.subtitle||'Recorrido formativo CAFASSO.')+'</p><div class="row"><span>Avance</span><strong>'+c.myProgress+'%</strong></div><div class="bar"><span style="width:'+c.myProgress+'%"></span></div></div><div class="quote"><strong>Un paso a la vez</strong><p>Tu progreso se guarda automáticamente en CAFASSO.</p></div></section><section class="section"><h3>Módulos</h3>'+modules+'</section>';document.getElementById('backCourses').onclick=function(){navigate('cursos');};Array.prototype.forEach.call(document.querySelectorAll('[data-module]'),function(b){b.onclick=function(){openModule(b.getAttribute('data-module'));};});}

  function blockText(block){var c=block.content||{};return c.text||c.body||c.description||c.url||c.link||'';}
  function youtubeEmbed(url){var s=String(url||''),m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);return m?'https://www.youtube.com/embed/'+m[1]:'';}

  function renderBlock(block,work){var type=String(block.type||'Texto'),low=type.toLowerCase(),body=blockText(block),required=block.required!==false,done=isBlockDone(block,work),submission=submissionFor(block._id),html='<article class="card block" data-block-card="'+esc(block._id)+'"><div class="block-meta"><div class="block-type">'+esc(type)+'</div>'+(required?'<span class="required">OBLIGATORIO</span>':'<span class="optional">Opcional</span>')+(required&&done?'<span class="badge">✓ LISTO</span>':'')+(submission?'<span class="badge '+(submission.status==='Aprobada'?'':'gold')+'">'+esc(submission.status||'Pendiente')+'</span>':'')+'</div><h4>'+esc(block.title||type||'Contenido')+'</h4>';

  function renderModule(){var c=selectedCourse,m=selectedModule,main=document.getElementById('main'),doneIds=completedModules(c._id),done=doneIds.indexOf(m._id)!==-1,status=requiredStatus(),blocks=(m.contents||[]).map(function(b){return renderBlock(b,status.work);}).join(''),pct=status.total?Math.round(status.done/status.total*100):100;main.innerHTML='<div class="module-detail">'+top(esc(m.title),esc(c.title))+'<div class="backline"><button id="backCourse">← Volver al curso</button></div><section class="card" style="margin-bottom:16px"><span class="badge '+(done?'gold':'')+'">'+(done?'COMPLETADO':'EN CURSO')+'</span><h2 style="font-family:Georgia,serif;color:var(--navy);font-size:32px;margin-bottom:8px">'+esc(m.title)+'</h2><p style="color:var(--muted);line-height:1.6">'+esc(m.desc||'Módulo de formación CAFASSO.')+'</p></section><div class="module-progress"><strong>Contenidos obligatorios: '+status.done+' de '+status.total+'</strong><div class="mini"><span style="width:'+pct+'%"></span></div><small style="color:var(--muted)">'+(status.ready?'Ya cumpliste todos los requisitos de este módulo.':'Completá los contenidos señalados como obligatorios para poder cerrar el módulo.')+'</small></div>'+(blocks||'<div class="card empty">Este módulo todavía no tiene contenidos cargados.</div>')+'<div class="complete-box '+(status.ready?'ready':'')+'"><div><strong>'+(done?'Módulo completado':status.ready?'¡Módulo listo para completar!':'Todavía faltan contenidos obligatorios')+'</strong><p>'+(done?'Podés volver a marcarlo como pendiente si necesitás revisarlo.':status.ready?'Al completarlo se actualizará tu porcentaje y podrá desbloquearse el siguiente módulo.':'Cuando completes los bloques obligatorios se habilitará este botón.')+'</p></div><button id="completeModule" class="btn '+(done?'done':'')+'" '+(!done&&!status.ready?'disabled':'')+'>'+(done?'✓ Completado · Desmarcar':'Marcar módulo como completado')+'</button></div></div>';document.getElementById('backCourse').onclick=fun   function toggleReview(blockId){var work=readModuleWork();work.done=work.done||{};work.done[blockId]=!work.done[blockId];saveModuleWork(work);renderModule();}
  function saveAnswer(blockId){var el=document.querySelector('[data-answer="'+CSS.escape(blockId)+'"]'),value=el?el.value.trim():'';if(!value){alert('Escribí una respuesta antes de guardarla.');return;}var block=(selectedModule.contents||[]).filter(function(b){return b._id===blockId;})[0];if(!block)return;var work=readModuleWork();work.answers=work.answers||{};work.answers[blockId]=value;saveModuleWork(work);var btn=document.querySelector('[data-save-answer="'+CSS.escape(blockId)+'"]');if(btn){btn.disabled=true;btn.textContent='Guardando…';}fetch(SUBMISSION_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,activityId:blockId,type:block.type||'Entrega',content:value})}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo guardar la respuesta.');var s=x.j.submission,found=false;for(var i=0;i<courseSubmissions.length;i++){if(courseSubmissions[i].activityId===blockId){courseSubmissions[i]=s;found=true;break;}}if(!found)courseSubmissions.push(s);renderModule();}).catch(function(e){alert('La respuesta quedó guardada en este dispositivo, pero no pudimos enviarla a CAFASSO: '+(e.message||'error de conexión'));renderModule();});}
  function saveModuleProgress(completed){if(completed&&!requiredStatus().ready){alert('Todavía faltan contenidos obligatorios por completar.');return;}var btn=document.getElementById('completeModule');if(btn){btn.disabled=true;btn.textContent='Guardando…';}fetch(PROGRESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,completed:completed})}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo guardar el progreso.');var record=x.j.progress||{},list=data.progress||[],found=false;for(var i=0;i<list.length;i++){if(list[i].userId===record.userId&&list[i].courseId===record.courseId){list[i]=record;found=true;break;}}if(!found)list.push(record);data.progress=list;selectedCourse.myProgress=Number(record.percent||0);renderModule();}).catch(function(e){alert(e.message||'No se pudo guardar el progreso.');renderModule();});}
