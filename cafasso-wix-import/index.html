<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>CAFASSO</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102f33}
*{box-sizing:border-box}
#cafassoWorld{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#102f33;display:block}
</style>
</head>
<body>
<iframe id="cafassoWorld" title="CAFASSO" allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
<script src="./cafasso-user-cloud.js?v=6"></script>
<script>window.CAFASSO_SPOTIFY_CLIENT_ID='464bbfd0f27d4b1fb743c6767d4a6620';</script>
<script src="./cafasso-spotify.js?v=6"></script>
<script src="./cafasso-global-music.js?v=6"></script>
<script>
(() => {
  const frame = document.getElementById('cafassoWorld');
  if (!frame) return;

  const worldUrl = () => {
    const url = new URL('./world.html', location.href);
    url.search = location.search;
    ['code','state','error','error_description'].forEach(key => url.searchParams.delete(key));
    url.hash = location.hash;
    return url.href;
  };

  let syncingFromFrame = false;
  Promise.resolve(window.CafassoUserCloud?.ready)
    .catch(() => null)
    .finally(() => { frame.src = worldUrl(); });

  window.addEventListener('message', event => {
    if (event.origin !== location.origin) return;
    const data = event.data || {};
    if (data.type !== 'cafasso-world-location') return;
    const next = new URL(location.href);
    next.search = data.search || '';
    next.hash = data.hash || '';
    if (next.href === location.href) return;
    syncingFromFrame = true;
    history.replaceState({ cafassoWorld:true }, '', next.href);
    queueMicrotask(() => { syncingFromFrame = false; });
  });

  window.addEventListener('popstate', () => {
    if (syncingFromFrame) return;
    const target = worldUrl();
    try {
      if (frame.contentWindow?.location?.href !== target) frame.src = target;
    } catch (error) {
      frame.src = target;
    }
  });
})();
</script>
</body>
</html>
