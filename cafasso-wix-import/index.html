<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAFASSO · Formación de Animadores</title>
<style>
:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--navy),#0A2440);color:white;padding:26px 20px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center}.brand img{width:44px;height:52px;object-fit:contain}.brand b{font:26px Georgia,serif}.brand small{display:block;opacity:.72;margin-top:4px}.nav{display:grid;gap:8px;margin-top:30px}.nav button,.foot button,.foot a{border:0;background:transparent;color:white;padding:12px;border-radius:12px;text-align:left;font-weight:700;cursor:pointer;text-decoration:none}.nav button.active,.nav button:hover{background:rgba(255,255,255,.11)}.foot{position:absolute;left:20px;right:20px;bottom:22px;display:grid;gap:10px}.motto{font:italic 17px Georgia,serif;color:#F7D276;line-height:1.35;margin-bottom:8px}main{padding:34px 36px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.top h1{font:38px Georgia,serif;color:var(--navy);margin:0}.top p{color:var(--muted);margin:6px 0 0}.pill{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900}.hero{background:var(--navy);color:white;border-radius:28px;padding:34px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.hero h2{font:42px Georgia,serif;margin:8px 0}.hero p{color:#e5ebf1}.quote{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:20px;align-self:end}.quote strong{font:23px Georgia,serif}.bar{height:9px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.bar span,.mini span{display:block;height:100%;background:var(--gold)}.row{display:flex;justify-content:space-between;font-size:13px;margin:18px 0 7px}.section{margin-top:30px}.section h3{font:28px Georgia,serif;color:var(--navy);margin:0 0 14px}.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.course h4{color:var(--navy);font-size:18px;margin:10px 0 6px}.course p{color:var(--muted);font-size:13px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#EDF5F1;color:var(--green);font-size:11px;font-weight:800}.badge.gray{background:#f0f1f2;color:#69717c}.badge.gold{background:#fff4cc;color:#886500}.mini{height:7px;background:#ece5d9;border-radius:999px;overflow:hidden;margin:16px 0}.btn{border:0;background:var(--gold);color:var(--navy);font-weight:800;border-radius:12px;padding:10px 13px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat{background:#F7F1E8;border-radius:16px;padding:18px}.stat strong{display:block;font:28px Georgia,serif;color:var(--navy)}.empty,.loading,.error{padding:32px;text-align:center}.error{color:#A64747;background:#fff1f1;border:1px solid #ebc7c7;border-radius:16px}.module{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:10px}.module small{color:var(--muted)}@media(max-width:900px){.shell{grid-template-columns:90px 1fr}.brand div,.nav button span,.foot{display:none}.brand{justify-content:center}.courses{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:680px){.shell{display:block}.side{height:auto;position:static;display:flex;justify-content:space-between;align-items:center;padding:10px}.nav{display:flex;margin:0}.nav button{padding:10px}.brand img{width:34px;height:40px}main{padding:20px 14px}.top{align-items:flex-start;flex-direction:column}.courses{grid-template-columns:1fr}.hero{padding:24px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app" class="loading">Cargando tu espacio CAFASSO…</div>
<script>
const ADMIN_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';
const COURSE_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';
const CREST='https://static.wixstatic.com/media/47bf07_3bf4fe6421f34a05990caa87c98fffc2~mv2.webp';
let session=null,data=null,myCourses=[],selectedCourse=null,currentView='inicio';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function readSession(){try{return JSON.parse(localStorage.getItem('cafassoSession')||'null')}catch{return null}}
function initials(name){const p=String(name||'').trim().split(/\s+/);return ((p[0]?.[0]||'A')+(p[1]?.[0]||'')).toUpperCase()}
function isAdmin(){return String(session?.user?.role||'').toLowerCase().includes('admin')}
function getProgress(courseId){const rows=(data.progress||[]).filter(p=>p.userId===session.user._id&&p.courseId===courseId);if(!rows.length)return 0;return Math.round(rows.reduce((s,p)=>s+Number(p.percent||0),0)/rows.length)}
function getAssignedCourses(){const uid=session.user._id,gid=session.user.groupId;const ids=new Set((data.assignments||[]).filter(a=>a.active!==false&&((a.targetType==='user'&&a.targetId===uid)||(a.targetType==='group'&&gid&&a.targetId===gid))).map(a=>a.courseId));return (data.courses||[]).filter(c=>ids.has(c._id)&&c.status==='Publicado').map(c=>({...c,myProgress:getProgress(c._id)}))}
function layout(){const u=session.user;document.getElementById('app').className='';document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><img src="${CREST}" alt="Maturana"><div><b>CAFASSO</b><small>Formación de Animadores</small></div></div><div class="nav"><button data-view="inicio"><span>Inicio</span></button><button data-view="cursos"><span>Mis cursos</span></button><button data-view="certificados"><span>Certificados</span></button><button data-view="perfil"><span>Mi perfil</span></button></div><div class="foot"><div class="motto">Caminamos juntos,<br>animamos con el corazón.</div>${isAdmin()?'<a href="./admin.html">Administración →</a>':''}<button id="logout">Cerrar sesión</button></div></aside><main id="main"></main></div>`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#logout').onclick=()=>{localStorage.removeItem('cafassoSession');location.replace('./login.html')};}
function top(title,sub){const u=session.user;return `<div class="top"><div><h1>${title}</h1><p>${sub||''}</p></div><div class="pill"><div class="avatar">${initials(u.name)}</div><span>${esc(u.name)}</span></div></div>`}
function badge(p){return p>=100?'<span class="badge gold">COMPLETADO</span>':p>0?'<span class="badge">EN CURSO</span>':'<span class="badge gray">NO INICIADO</span>'}
function card(c){return `<article class="card course">${badge(c.myProgress)}<h4>${esc(c.title)}</h4><p>${esc(c.subtitle||c.description||'Recorrido de formación CAFASSO.')}</p><div class="mini"><span style="width:${c.myProgress}%"></span></div><div style="display:flex;justify-content:space-between;align-items:center"><small>${c.myProgress}% completado</small><button class="btn" data-course="${c._id}">${c.myProgress?'Continuar':'Comenzar'}</button></div></article>`}
function bindCourseButtons(){document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>openCourse(b.dataset.course))}
function navigate(view,replace=false){currentView=view;if(replace)history.replaceState({view},'',location.pathname+location.search+'#'+view);else history.pushState({view},'',location.pathname+location.search+'#'+view);render(view)}
function render(view){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const main=$('#main');const u=session.user;myCourses=getAssignedCourses();const avg=myCourses.length?Math.round(myCourses.reduce((s,c)=>s+c.myProgress,0)/myCourses.length):0;const done=myCourses.filter(c=>c.myProgress>=100);
if(view==='inicio'){const cur=myCourses.find(c=>c.myProgress>0&&c.myProgress<100)||myCourses[0];main.innerHTML=top(`¡Buenas, ${esc((u.name||'').split(' ')[0]||'animador/a')}! 👋`,'Qué bueno encontrarte de nuevo. Sigamos caminando.')+(cur?`<section class="hero"><div><div>CONTINUÁ TU FORMACIÓN</div><h2>${esc(cur.title)}</h2><p>${esc(cur.subtitle||cur.description||'Tu recorrido de formación salesiana.')}</p><div class="row"><span>Tu avance</span><strong>${cur.myProgress}%</strong></div><div class="bar"><span style="width:${cur.myProgress}%"></span></div><div style="margin-top:18px"><button class="btn" data-course="${cur._id}">Continuar recorrido →</button></div></div><div class="quote"><strong>Formarnos para acompañar</strong><p>Presencia, cercanía y misión en el camino de cada joven.</p></div></section>`:'<div class="card empty">Todavía no tenés cursos publicados asignados.</div>')+`<section class="section"><h3>Mis cursos</h3><div class="courses">${myCourses.length?myCourses.slice(0,3).map(card).join(''):'<div class="card empty">Cuando te asignemos un curso va a aparecer acá.</div>'}</div></section><div class="stats"><div class="stat"><strong>${myCourses.length}</strong><span>Cursos asignados</span></div><div class="stat"><strong>${done.length}</strong><span>Completados</span></div><div class="stat"><strong>${avg}%</strong><span>Progreso promedio</span></div><div class="stat"><strong>${esc(u.groupName||'—')}</strong><span>Grupo</span></div></div>`;bindCourseButtons();return}
if(view==='cursos'){main.innerHTML=top('Mis cursos','Acá aparecen únicamente los recorridos que te fueron asignados.')+`<div class="courses">${myCourses.length?myCourses.map(card).join(''):'<div class="card empty">No tenés cursos asignados todavía.</div>'}</div>`;bindCourseButtons();return}
if(view==='certificados'){main.innerHTML=top('Mis certificados','Se habilitan al completar un curso.')+`<div class="courses">${done.length?done.map(c=>`<article class="card course"><span class="badge gold">COMPLETADO</span><h4>${esc(c.title)}</h4><p>Certificado habilitado.</p></article>`).join(''):'<div class="card empty">Todavía no tenés certificados.</div>'}</div>`;return}
if(view==='perfil'){main.innerHTML=top('Mi perfil','Tu recorrido personal dentro de CAFASSO.')+`<div class="card"><h2 style="font-family:Georgia,serif;color:var(--navy)">${esc(u.name)}</h2><p>${esc(u.role||'Animador')} · ${esc(u.groupName||'Sin grupo')}</p><p>${esc(u.email)}</p><div class="stats"><div class="stat"><strong>${myCourses.length}</strong><span>Cursos</span></div><div class="stat"><strong>${done.length}</strong><span>Certificados</span></div><div class="stat"><strong>${avg}%</strong><span>Progreso</span></div></div></div>`;return}
if(view==='curso'&&selectedCourse){renderCourse();return}
navigate('inicio',true)}
async function openCourse(id){const main=$('#main');main.innerHTML='<div class="loading">Cargando curso…</div>';try{const r=await fetch(COURSE_API+'?id='+encodeURIComponent(id),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar el curso.');selectedCourse={...j.course,myProgress:getProgress(id)};navigate('curso')}catch(e){main.innerHTML=`<div class="error">${esc(e.message)}</div>`}}
function renderCourse(){const c=selectedCourse;const main=$('#main');main.innerHTML=top(c.title,`${(c.modules||[]).length} módulos · ${c.myProgress}% completado`)+`<section class="hero"><div><h2>${esc(c.title)}</h2><p>${esc(c.description||c.subtitle||'Recorrido formativo CAFASSO.')}</p><div class="row"><span>Avance</span><strong>${c.myProgress}%</strong></div><div class="bar"><span style="width:${c.myProgress}%"></span></div></div><div class="quote"><strong>Un paso a la vez</strong><p>Los contenidos se actualizan desde Administración.</p></div></section><section class="section"><h3>Módulos</h3>${(c.modules||[]).length?c.modules.map((m,i)=>`<article class="card module"><div><strong>${i+1} · ${esc(m.title)}</strong><br><small>${esc(m.desc||'Módulo de formación')}</small></div><span class="badge ${m.status==='Publicado'?'':'gray'}">${esc(m.status||'Borrador')}</span></article>`).join(''):'<div class="card empty">Este curso todavía no tiene módulos.</div>'}</section>`}
async function init(){session=readSession();if(!session?.user?.email){location.replace('./login.html');return}try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);const r=await fetch(ADMIN_API,{cache:'no-store',signal:controller.signal});clearTimeout(timer);const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo cargar CAFASSO.');data=j;const fresh=(data.users||[]).find(u=>String(u.email||'').toLowerCase()===String(session.user.email||'').toLowerCase());if(!fresh||['Bloqueado','Inactivo'].includes(fresh.status)){localStorage.removeItem('cafassoSession');location.replace('./login.html');return}session.user={...session.user,...fresh};localStorage.setItem('cafassoSession',JSON.stringify({...session,user:session.user,checkedAt:Date.now()}));layout();const view=(location.hash||'#inicio').slice(1);render(view)}catch(e){document.getElementById('app').className='';document.getElementById('app').innerHTML=`<main><div class="error"><strong>No pudimos cargar tu espacio.</strong><br>${esc(e.name==='AbortError'?'La conexión demoró demasiado. Recargá la página.':e.message)}</div></main>`}}
window.addEventListener('popstate',()=>{const view=(location.hash||'#inicio').slice(1);render(view)});init();
</script></body></html>
