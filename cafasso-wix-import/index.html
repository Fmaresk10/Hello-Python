<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFASSO · Formación de Animadores</title>
<style>
:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A;--red:#A64747}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,var(--navy),#0A2440);color:#fff;padding:26px 20px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center}.brand img{width:44px;height:52px;object-fit:contain}.brand b{font-family:Georgia,serif;font-size:26px}.brand small{display:block;opacity:.72;margin-top:4px}.nav{display:grid;gap:8px;margin-top:30px}.nav button,.foot button,.foot a{border:0;background:transparent;color:#fff;padding:12px;border-radius:12px;text-align:left;font-weight:700;cursor:pointer;text-decoration:none;font:inherit}.nav button.active,.nav button:hover{background:rgba(255,255,255,.11)}.foot{position:absolute;left:20px;right:20px;bottom:22px;display:grid;gap:10px}.motto{font-family:Georgia,serif;font-style:italic;color:#F7D276;line-height:1.35;margin-bottom:8px}main{padding:34px 36px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.top h1{font-family:Georgia,serif;font-size:38px;color:var(--navy);margin:0}.top p{color:var(--muted);margin:6px 0 0}.pill{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-weight:900}.hero{background:var(--navy);color:#fff;border-radius:28px;padding:34px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px}.hero h2{font-family:Georgia,serif;font-size:42px;margin:8px 0}.hero p{color:#e5ebf1}.quote{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:20px;align-self:end}.quote strong{font-family:Georgia,serif;font-size:23px}.bar{height:9px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.bar span,.mini span{display:block;height:100%;background:var(--gold)}.row{display:flex;justify-content:space-between;font-size:13px;margin:18px 0 7px}.section{margin-top:30px}.section h3{font-family:Georgia,serif;font-size:28px;color:var(--navy);margin:0 0 14px}.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}.course h4{color:var(--navy);font-size:18px;margin:10px 0 6px}.course p{color:var(--muted);font-size:13px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#EDF5F1;color:var(--green);font-size:11px;font-weight:800}.badge.gray{background:#f0f1f2;color:#69717c}.badge.gold{background:#fff4cc;color:#886500}.badge.red{background:#fff1f1;color:var(--red)}.mini{height:7px;background:#ece5d9;border-radius:999px;overflow:hidden;margin:16px 0}.btn{border:0;background:var(--gold);color:var(--navy);font-weight:800;border-radius:12px;padding:10px 13px;cursor:pointer}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.done{background:#EDF5F1;color:var(--green);border:1px solid #CDE2D8}.btn:disabled{opacity:.5;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.stat{background:#F7F1E8;border-radius:16px;padding:18px}.stat strong{display:block;font-family:Georgia,serif;font-size:28px;color:var(--navy)}.loading,.error,.empty{padding:36px;text-align:center}.error{margin:30px;background:#fff1f1;border:1px solid #ebc7c7;color:var(--red);border-radius:16px}.module{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:10px}.module small{color:var(--muted)}.module-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.block{margin-bottom:12px}.block h4{margin:0 0 8px;color:var(--navy)}.block p{margin:0;color:var(--muted);line-height:1.55}.block-type{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#B77D00;font-weight:800;margin-bottom:8px}.backline{margin-bottom:16px}.backline button{border:0;background:none;color:var(--navy);font-weight:800;cursor:pointer;padding:0}.module-detail{max-width:900px}.complete-box{margin-top:20px;background:#FFF7D7;border:1px solid #F3DF91;border-radius:18px;padding:18px;display:flex;justify-content:space-between;gap:14px;align-items:center}.complete-box p{margin:4px 0 0;color:#6C5500;font-size:13px}
@media(max-width:900px){.shell{grid-template-columns:90px 1fr}.brand div,.nav button span,.foot{display:none}.brand{justify-content:center}.courses{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.shell{display:block}.side{height:auto;position:static;display:flex;justify-content:space-between;align-items:center;padding:10px}.nav{display:flex;margin:0}.nav button{padding:10px}.brand img{width:34px;height:40px}main{padding:20px 14px}.top{align-items:flex-start;flex-direction:column}.courses{grid-template-columns:1fr}.hero{padding:24px}.stats{grid-template-columns:1fr 1fr}.module,.complete-box{align-items:flex-start;flex-direction:column}.module-actions{justify-content:flex-start}}
</style>
</head>
<body>
<div id="app" class="loading">Cargando tu espacio CAFASSO…</div>
<script>
(function(){
  var ADMIN_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAdmin';
  var COURSE_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';
  var PROGRESS_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoProgress';
  var CREST='https://static.wixstatic.com/media/47bf07_3bf4fe6421f34a05990caa87c98fffc2~mv2.webp';
  var session=null, data=null, myCourses=[], selectedCourse=null, selectedModule=null;

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
  function readSession(){try{return JSON.parse(localStorage.getItem('cafassoSession')||'null');}catch(e){return null;}}
  function initials(name){var p=String(name||'').trim().split(/\s+/);return ((p[0]&&p[0][0]||'A')+(p[1]&&p[1][0]||'')).toUpperCase();}
  function isAdmin(){return String(session.user.role||'').toLowerCase().indexOf('admin')!==-1;}
  function progressRecord(courseId){return (data.progress||[]).filter(function(p){return p.userId===session.user._id&&p.courseId===courseId;})[0]||null;}
  function getProgress(courseId){var p=progressRecord(courseId);return p?Number(p.percent||0):0;}
  function completedModules(courseId){var p=progressRecord(courseId);return p&&Array.isArray(p.completedModules)?p.completedModules:[];}
  function assignedCourses(){var uid=session.user._id,gid=session.user.groupId;var ids={};(data.assignments||[]).forEach(function(a){if(a.active===false)return;if(a.targetType==='user'&&a.targetId===uid)ids[a.courseId]=true;if(a.targetType==='group'&&gid&&a.targetId===gid)ids[a.courseId]=true;});return (data.courses||[]).filter(function(c){return ids[c._id]&&c.status==='Publicado';}).map(function(c){var copy={};for(var k in c)copy[k]=c[k];copy.myProgress=getProgress(c._id);return copy;});}

  function layout(){var u=session.user;document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="shell"><aside class="side"><div class="brand"><img src="'+CREST+'" alt="Maturana"><div><b>CAFASSO</b><small>Formación de Animadores</small></div></div><div class="nav"><button data-view="inicio"><span>Inicio</span></button><button data-view="cursos"><span>Mis cursos</span></button><button data-view="certificados"><span>Certificados</span></button><button data-view="perfil"><span>Mi perfil</span></button></div><div class="foot"><div class="motto">Caminamos juntos,<br>animamos con el corazón.</div>'+(isAdmin()?'<a href="./admin.html">Administración →</a>':'')+'<button id="logout">Cerrar sesión</button></div></aside><main id="main"></main></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){b.onclick=function(){navigate(b.getAttribute('data-view'));};});
    document.getElementById('logout').onclick=function(){localStorage.removeItem('cafassoSession');location.replace('./login.html');};
  }
  function top(title,sub){var u=session.user;return '<div class="top"><div><h1>'+title+'</h1><p>'+esc(sub||'')+'</p></div><div class="pill"><div class="avatar">'+initials(u.name)+'</div><span>'+esc(u.name)+'</span></div></div>';}
  function badge(p){if(p>=100)return '<span class="badge gold">COMPLETADO</span>';if(p>0)return '<span class="badge">EN CURSO</span>';return '<span class="badge gray">NO INICIADO</span>';}
  function card(c){return '<article class="card course">'+badge(c.myProgress)+'<h4>'+esc(c.title)+'</h4><p>'+esc(c.subtitle||c.description||'Recorrido de formación CAFASSO.')+'</p><div class="mini"><span style="width:'+c.myProgress+'%"></span></div><div style="display:flex;justify-content:space-between;align-items:center"><small>'+c.myProgress+'% completado</small><button class="btn" data-course="'+c._id+'">'+(c.myProgress?'Continuar':'Comenzar')+'</button></div></article>';}
  function bindCourses(){Array.prototype.forEach.call(document.querySelectorAll('[data-course]'),function(b){b.onclick=function(){openCourse(b.getAttribute('data-course'));};});}
  function navigate(view,replace){var url=location.pathname+location.search+'#'+view;if(replace)history.replaceState({view:view},'',url);else if(location.hash!=='#'+view)history.pushState({view:view},'',url);render(view);}

  function render(view){var main=document.getElementById('main');if(!main)return;Array.prototype.forEach.call(document.querySelectorAll('[data-view]'),function(b){b.classList.toggle('active',b.getAttribute('data-view')===view);});var u=session.user;myCourses=assignedCourses();var avg=myCourses.length?Math.round(myCourses.reduce(function(s,c){return s+c.myProgress;},0)/myCourses.length):0;var done=myCourses.filter(function(c){return c.myProgress>=100;});
    if(view==='inicio'){
      var cur=myCourses.filter(function(c){return c.myProgress>0&&c.myProgress<100;})[0]||myCourses[0];
      var hero=cur?'<section class="hero"><div><div>CONTINUÁ TU FORMACIÓN</div><h2>'+esc(cur.title)+'</h2><p>'+esc(cur.subtitle||cur.description||'Tu recorrido de formación salesiana.')+'</p><div class="row"><span>Tu avance</span><strong>'+cur.myProgress+'%</strong></div><div class="bar"><span style="width:'+cur.myProgress+'%"></span></div><div style="margin-top:18px"><button class="btn" data-course="'+cur._id+'">Continuar recorrido →</button></div></div><div class="quote"><strong>Formarnos para acompañar</strong><p>Presencia, cercanía y misión en el camino de cada joven.</p></div></section>':'<div class="card empty">Todavía no tenés cursos publicados asignados.</div>';
      main.innerHTML=top('¡Buenas, '+esc(String(u.name||'').split(' ')[0]||'animador/a')+'! 👋','Qué bueno encontrarte de nuevo. Sigamos caminando.')+hero+'<section class="section"><h3>Mis cursos</h3><div class="courses">'+(myCourses.length?myCourses.slice(0,3).map(card).join(''):'<div class="card empty">Cuando te asignemos un curso va a aparecer acá.</div>')+'</div></section><div class="stats"><div class="stat"><strong>'+myCourses.length+'</strong><span>Cursos asignados</span></div><div class="stat"><strong>'+done.length+'</strong><span>Completados</span></div><div class="stat"><strong>'+avg+'%</strong><span>Progreso promedio</span></div><div class="stat"><strong>'+esc(u.groupName||'—')+'</strong><span>Grupo</span></div></div>';bindCourses();return;
    }
    if(view==='cursos'){main.innerHTML=top('Mis cursos','Acá aparecen únicamente los recorridos que te fueron asignados.')+'<div class="courses">'+(myCourses.length?myCourses.map(card).join(''):'<div class="card empty">No tenés cursos asignados todavía.</div>')+'</div>';bindCourses();return;}
    if(view==='certificados'){main.innerHTML=top('Mis certificados','Se habilitan al completar un curso.')+'<div class="courses">'+(done.length?done.map(function(c){return '<article class="card course"><span class="badge gold">COMPLETADO</span><h4>'+esc(c.title)+'</h4><p>Curso completado al 100%. El certificado se habilitará desde acá.</p></article>';}).join(''):'<div class="card empty">Todavía no tenés certificados.</div>')+'</div>';return;}
    if(view==='perfil'){main.innerHTML=top('Mi perfil','Tu recorrido personal dentro de CAFASSO.')+'<div class="card"><h2 style="font-family:Georgia,serif;color:var(--navy)">'+esc(u.name)+'</h2><p>'+esc(u.role||'Animador')+' · '+esc(u.groupName||'Sin grupo')+'</p><p>'+esc(u.email)+'</p><div class="stats"><div class="stat"><strong>'+myCourses.length+'</strong><span>Cursos</span></div><div class="stat"><strong>'+done.length+'</strong><span>Certificados</span></div><div class="stat"><strong>'+avg+'%</strong><span>Progreso</span></div></div></div>';return;}
    if(view==='curso'&&selectedCourse){renderCourse();return;}
    if(view==='modulo'&&selectedCourse&&selectedModule){renderModule();return;}
    navigate('inicio',true);
  }

  function openCourse(id){var main=document.getElementById('main');main.innerHTML='<div class="loading">Cargando curso…</div>';fetch(COURSE_API+'?id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo cargar el curso.');selectedCourse=x.j.course;selectedCourse.myProgress=getProgress(id);selectedModule=null;navigate('curso');}).catch(function(e){main.innerHTML='<div class="error">'+esc(e.message)+'</div>';});}

  function publishedModules(){return (selectedCourse.modules||[]).filter(function(m){return m.status==='Publicado';});}
  function moduleUnlocked(mod,index,mods,doneIds){if(index===0)return true;if(mod.unlockAfterPrevious===false)return true;return doneIds.indexOf(mods[index-1]._id)!==-1;}
  function renderCourse(){var c=selectedCourse,main=document.getElementById('main'),mods=publishedModules(),doneIds=completedModules(c._id);c.myProgress=getProgress(c._id);var modules=mods.length?mods.map(function(m,i){var done=doneIds.indexOf(m._id)!==-1;var unlocked=moduleUnlocked(m,i,mods,doneIds);return '<article class="card module"><div><strong>'+(i+1)+' · '+esc(m.title)+'</strong><br><small>'+esc(m.desc||'Módulo de formación')+' · '+Number(m.estimatedMinutes||0)+' min</small></div><div class="module-actions">'+(done?'<span class="badge gold">COMPLETADO</span>':unlocked?'<span class="badge">DISPONIBLE</span>':'<span class="badge gray">BLOQUEADO</span>')+'<button class="btn '+(done?'alt':'')+'" data-module="'+m._id+'" '+(unlocked?'':'disabled')+'>'+(done?'Revisar':'Abrir módulo')+'</button></div></article>';}).join(''):'<div class="card empty">Este curso todavía no tiene módulos publicados.</div>';main.innerHTML=top(esc(c.title),mods.length+' módulos · '+c.myProgress+'% completado')+'<div class="backline"><button id="backCourses">← Mis cursos</button></div><section class="hero"><div><h2>'+esc(c.title)+'</h2><p>'+esc(c.description||c.subtitle||'Recorrido formativo CAFASSO.')+'</p><div class="row"><span>Avance</span><strong>'+c.myProgress+'%</strong></div><div class="bar"><span style="width:'+c.myProgress+'%"></span></div></div><div class="quote"><strong>Un paso a la vez</strong><p>Tu progreso se guarda automáticamente en CAFASSO.</p></div></section><section class="section"><h3>Módulos</h3>'+modules+'</section>';
    document.getElementById('backCourses').onclick=function(){navigate('cursos');};
    Array.prototype.forEach.call(document.querySelectorAll('[data-module]'),function(b){b.onclick=function(){openModule(b.getAttribute('data-module'));};});
  }

  function openModule(id){var mods=publishedModules();selectedModule=mods.filter(function(m){return m._id===id;})[0]||null;if(!selectedModule)return;navigate('modulo');}
  function blockText(block){var c=block.content||{};return c.text||c.body||c.description||c.url||c.link||'';}
  function renderModule(){var c=selectedCourse,m=selectedModule,main=document.getElementById('main'),doneIds=completedModules(c._id),done=doneIds.indexOf(m._id)!==-1;var blocks=(m.contents||[]).map(function(b){return '<article class="card block"><div class="block-type">'+esc(b.type||'Contenido')+'</div><h4>'+esc(b.title||b.type||'Contenido')+'</h4><p>'+esc(blockText(b)||'Este contenido se completará desde el editor del curso.')+'</p></article>';}).join('');main.innerHTML='<div class="module-detail">'+top(esc(m.title),esc(c.title))+'<div class="backline"><button id="backCourse">← Volver al curso</button></div><section class="card" style="margin-bottom:16px"><span class="badge '+(done?'gold':'')+'">'+(done?'COMPLETADO':'EN CURSO')+'</span><h2 style="font-family:Georgia,serif;color:var(--navy);font-size:32px;margin-bottom:8px">'+esc(m.title)+'</h2><p style="color:var(--muted);line-height:1.6">'+esc(m.desc||'Módulo de formación CAFASSO.')+'</p></section>'+(blocks||'<div class="card empty">Este módulo todavía no tiene contenidos cargados.</div>')+'<div class="complete-box"><div><strong>'+(done?'Módulo completado':'¿Terminaste este módulo?')+'</strong><p>'+(done?'Podés volver a marcarlo como pendiente si necesitás revisarlo.':'Al completarlo se actualizará tu porcentaje y podrá desbloquearse el siguiente módulo.')+'</p></div><button id="completeModule" class="btn '+(done?'done':'')+'">'+(done?'✓ Completado · Desmarcar':'Marcar módulo como completado')+'</button></div></div>';
    document.getElementById('backCourse').onclick=function(){navigate('curso');};
    document.getElementById('completeModule').onclick=function(){saveModuleProgress(!done);};
  }

  function saveModuleProgress(completed){var btn=document.getElementById('completeModule');if(btn){btn.disabled=true;btn.textContent='Guardando…';}fetch(PROGRESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,completed:completed})}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo guardar el progreso.');var record=x.j.progress||{};var list=data.progress||[];var found=false;for(var i=0;i<list.length;i++){if(list[i].userId===record.userId&&list[i].courseId===record.courseId){list[i]=record;found=true;break;}}if(!found)list.push(record);data.progress=list;selectedCourse.myProgress=Number(record.percent||0);renderModule();}).catch(function(e){alert(e.message||'No se pudo guardar el progreso.');renderModule();});}

  function fail(message){document.getElementById('app').className='';document.getElementById('app').innerHTML='<div class="error"><strong>No pudimos cargar tu espacio.</strong><br>'+esc(message)+'</div>';}
  function init(){session=readSession();if(!session||!session.user||!session.user.email){location.replace('./login.html');return;}var timedOut=false;var timer=setTimeout(function(){timedOut=true;fail('La conexión con CAFASSO demoró demasiado. Probá recargar la página.');},12000);fetch(ADMIN_API,{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(timedOut)return;clearTimeout(timer);if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo cargar CAFASSO.');data=x.j;var fresh=(data.users||[]).filter(function(u){return String(u.email||'').toLowerCase()===String(session.user.email||'').toLowerCase();})[0];if(!fresh||fresh.status==='Bloqueado'||fresh.status==='Inactivo'){localStorage.removeItem('cafassoSession');location.replace('./login.html');return;}for(var k in fresh)session.user[k]=fresh[k];localStorage.setItem('cafassoSession',JSON.stringify(session));layout();var view=(location.hash||'#inicio').slice(1);if((view==='curso'||view==='modulo')&&!selectedCourse)view='inicio';render(view);}).catch(function(e){if(timedOut)return;clearTimeout(timer);fail(e.message||'Error al conectar con CAFASSO.');});}

  window.addEventListener('popstate',function(){if(!data||!session)return;var view=(location.hash||'#inicio').slice(1);if(view==='curso'&&!selectedCourse)view='cursos';if(view==='modulo'&&(!selectedCourse||!selectedModule))view='cursos';render(view);});
  init();
})();
</script>
</body>
</html>
