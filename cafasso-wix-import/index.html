<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>CAFASSO</title>
<style>
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#102f33}
*{box-sizing:border-box}
[hidden]{display:none!important}
.cafasso-foundation{background:#102f33}
.cafasso-house,.cafasso-patio,.cafasso-parroquia,.cafasso-escuela,.cafasso-recursos{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden}
.cafasso-house__image,.cafasso-patio__image,.cafasso-parroquia__image,.cafasso-escuela__image,.cafasso-recursos__image{display:block;width:100%;height:100%;object-fit:cover}
.cafasso-space-link{position:absolute;z-index:4;border:1px solid rgba(239,195,93,.8);border-radius:4px;padding:10px 16px;background:rgba(15,39,40,.78);color:#fff8e9;font:15px Georgia,serif;letter-spacing:.04em;cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.35);text-shadow:0 1px 5px rgba(0,0,0,.5);transition:transform .2s ease,background .2s ease}
.cafasso-space-link:hover{transform:translateY(-2px);background:rgba(32,62,58,.92)}
.cafasso-space-link:focus-visible{outline:3px solid #f2c95a;outline-offset:4px}
.cafasso-admin-home-link{position:absolute;right:3.2%;top:4%;z-index:7;padding:9px 13px;border:1px solid rgba(242,201,76,.72);border-radius:999px;background:rgba(15,45,77,.82);color:#fff7dc;text-decoration:none;font:700 12px Inter,system-ui,sans-serif;letter-spacing:.02em;box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(5px);transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.cafasso-admin-home-link:hover{transform:translateY(-2px);background:rgba(15,45,77,.96);box-shadow:0 9px 22px rgba(0,0,0,.34)}
.cafasso-admin-home-link:focus-visible{outline:3px solid #f2c95a;outline-offset:4px}
.cafasso-space-link--casa{left:calc(66% - 114px);top:calc(40% - 113px)}
.cafasso-space-link--house-recursos{left:auto;right:8%;top:24%}
.cafasso-space-link--patio-home{left:16%;top:48%}
.cafasso-space-link--patio-escuela{left:auto;right:9%;top:9%}
.cafasso-space-link--patio-parroquia{left:70%;top:58%}
.cafasso-space-link--parroquia-patio{left:calc(50% - 8cm);top:47%;transform:translate(-50%,-50%)}
.cafasso-space-link--parroquia-patio:hover{transform:translate(-50%,calc(-50% - 2px))}
.cafasso-space-link--escuela-patio{right:20%;top:44%}
.cafasso-space-link--recursos-home{left:4%;top:7%}
.cafasso-recursos__shelf{position:absolute;inset:0;z-index:3;pointer-events:none}
.cafasso-resource-row{position:absolute;display:flex;align-items:flex-end;gap:clamp(2px,.26vw,5px);height:13%;padding:0 .25%;pointer-events:none}
.cafasso-resource-row--1{left:7.8%;top:10.6%;width:23.5%}
.cafasso-resource-row--2{left:7.8%;top:28.3%;width:23.5%}
.cafasso-resource-row--3{left:7.8%;top:46.1%;width:23.5%}
.cafasso-resource-row--4{left:7.8%;top:63.9%;width:23.5%}
.cafasso-resource-row--5{left:68.7%;top:10.6%;width:23.5%}
.cafasso-resource-row--6{left:68.7%;top:28.3%;width:23.5%}
.cafasso-resource-row--7{left:68.7%;top:46.1%;width:23.5%}
.cafasso-resource-row--8{left:68.7%;top:63.9%;width:23.5%}
.cafasso-resource-book{position:relative;display:block;flex:0 0 clamp(18px,1.7vw,31px);height:var(--book-height);min-height:62px;margin:0;padding:0;border:1px solid rgba(34,18,10,.52);border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,rgba(255,255,255,.12),transparent 18%,rgba(0,0,0,.12) 72%,rgba(255,255,255,.08)),var(--book-color);box-shadow:inset 2px 0 2px rgba(255,255,255,.09),inset -3px 0 4px rgba(0,0,0,.18),0 4px 5px rgba(21,11,6,.42);color:#f2dfb5;text-decoration:none;cursor:pointer;pointer-events:auto;transform-origin:bottom center;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
.cafasso-resource-book:before,.cafasso-resource-book:after{content:"";position:absolute;left:2px;right:2px;height:2px;background:rgba(224,190,119,.5);box-shadow:0 1px rgba(31,17,9,.28)}
.cafasso-resource-book:before{top:8%}
.cafasso-resource-book:after{bottom:8%}
.cafasso-resource-book:hover{transform:translateY(-7px) rotate(-1deg);filter:brightness(1.12);box-shadow:inset 2px 0 2px rgba(255,255,255,.12),inset -3px 0 4px rgba(0,0,0,.18),0 9px 10px rgba(21,11,6,.5)}
.cafasso-resource-book:focus-visible{outline:3px solid #f2c95a;outline-offset:3px}
.cafasso-resource-book:disabled{cursor:default}
.cafasso-resource-book__spine{position:absolute;inset:8% 2px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cafasso-resource-book__title{display:block;max-height:100%;overflow:hidden;color:#fff4cf;font:700 16px/1 Georgia,serif;letter-spacing:.01em;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.35);writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;text-overflow:ellipsis}
.cafasso-house:after{content:"";position:absolute;inset:-10%;pointer-events:none;background:radial-gradient(ellipse 42% 38% at 62% 24%,rgba(255,210,124,.34),transparent 68%);mix-blend-mode:screen;opacity:.72;animation:cafassoHouseLight 5s ease-in-out infinite alternate}
@keyframes cafassoHouseLight{from{opacity:.36;transform:translate(-8%,4%) scale(1.02)}to{opacity:1;transform:translate(8%,-4%) scale(1.06)}}
.cafasso-bitacora-object{position:absolute;left:50.5%;bottom:11.5%;z-index:5;width:168px;height:148px;padding:0;border:0;background:transparent;cursor:pointer;overflow:visible;display:flex;align-items:center;justify-content:center;line-height:0;filter:drop-shadow(0 10px 9px rgba(0,0,0,.42));transform:rotate(-5deg);transition:transform .18s ease,filter .18s ease}
.cafasso-bitacora-object img{display:block;width:100%;height:100%;max-width:none;object-fit:contain;object-position:center;pointer-events:none}
.cafasso-bitacora-object:hover{transform:rotate(-5deg) translateY(-5px) scale(1.04);filter:brightness(1.05) drop-shadow(0 13px 11px rgba(0,0,0,.5))}
.cafasso-bitacora-object:focus-visible{outline:3px solid #f2c95a;outline-offset:5px;border-radius:8px}
.cafasso-bitacora-panel{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(7,25,27,.67);backdrop-filter:blur(5px)}
.cafasso-bitacora-book{position:relative;width:min(760px,92vw);min-height:min(620px,82vh);padding:52px 58px 38px;border:1px solid rgba(95,63,36,.35);border-radius:7px 19px 19px 7px;background:repeating-linear-gradient(180deg,rgba(120,94,62,.08) 0,rgba(120,94,62,.08) 1px,transparent 1px,transparent 31px),linear-gradient(90deg,#e5d0a7 0 3%,#f5ead0 3% 52%,#efe0bf 52% 100%);box-shadow:0 30px 80px rgba(0,0,0,.52),inset 18px 0 30px rgba(94,63,36,.13);color:#3c3026;font-family:Georgia,serif}
.cafasso-bitacora-book:after{content:"";position:absolute;left:50%;top:4%;bottom:4%;width:1px;background:rgba(104,75,43,.18);box-shadow:1px 0 rgba(255,255,255,.48)}
.cafasso-bitacora-close{position:absolute;right:18px;top:14px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;background:rgba(61,47,35,.09);color:#514132;font:29px/1 Georgia,serif;cursor:pointer}
.cafasso-bitacora-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8a6748}
.cafasso-bitacora-book h2{margin:7px 0 10px;font-size:42px;font-weight:500;color:#3c3026}
.cafasso-bitacora-prompt{max-width:620px;margin:0 0 24px;font-size:16px;line-height:1.55;color:#6a5745}
.cafasso-bitacora-text{display:block;width:100%;height:300px;resize:none;border:0;outline:0;padding:5px 8px;background:transparent;color:#3a3028;font:19px/31px Georgia,serif;caret-color:#78552f}
.cafasso-bitacora-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px;padding-top:14px;border-top:1px solid rgba(105,77,49,.2);font-size:13px;color:#786650}
.cafasso-bitacora-save{border:1px solid #84613d;border-radius:4px;padding:10px 18px;background:#725033;color:#fff7e7;font:14px Georgia,serif;cursor:pointer;box-shadow:0 4px 10px rgba(77,51,29,.18)}
.cafasso-bitacora-save:hover{background:#5e412a}
@media(max-width:680px){
  .cafasso-space-link{padding:9px 13px;font-size:13px}
  .cafasso-admin-home-link{right:4%;top:3%;padding:8px 11px;font-size:11px}
  .cafasso-space-link--casa{left:47%;top:24%}
  .cafasso-space-link--house-recursos{left:auto;right:5%;top:26%}
  .cafasso-space-link--patio-home{left:8%;top:50%}
  .cafasso-space-link--patio-escuela{left:auto;right:7%;top:10%}
  .cafasso-space-link--patio-parroquia{left:auto;right:8%;top:57%}
  .cafasso-space-link--parroquia-patio{left:calc(50% - 8cm);top:47%;bottom:auto;transform:translate(-50%,-50%)}
  .cafasso-space-link--escuela-patio{right:10%;top:45%}
  .cafasso-space-link--recursos-home{left:6%;top:6%}
  .cafasso-resource-row{gap:1px;height:11%}
  .cafasso-resource-book{flex-basis:13px;min-height:42px}
  .cafasso-resource-book__title{font-size:13px}
  .cafasso-bitacora-object{left:47.5%;bottom:12.5%;width:118px;height:104px}
  .cafasso-bitacora-panel{padding:14px}
  .cafasso-bitacora-book{width:96vw;min-height:78vh;padding:45px 24px 24px;background:repeating-linear-gradient(180deg,rgba(120,94,62,.08) 0,rgba(120,94,62,.08) 1px,transparent 1px,transparent 29px),#f3e5c6}
  .cafasso-bitacora-book:after{display:none}
  .cafasso-bitacora-book h2{font-size:34px}
  .cafasso-bitacora-text{height:45vh;font-size:18px;line-height:29px}
  .cafasso-bitacora-footer{align-items:flex-end;flex-direction:column}
}
@media (prefers-reduced-motion:reduce){.cafasso-house:after{animation:none!important}.cafasso-space-link,.cafasso-admin-home-link,.cafasso-bitacora-object,.cafasso-resource-book{transition:none}}
</style>
</head>
<body><div id="app"></div><script src="./animator-foundation-v1.js?v=20260919-1"></script><script src="./house-profile.js?v=2"></script><script src="./house-profile-progress.js?v=2"></script><script src="./cafasso-global-counters.js?v=1"></script><script src="./wix-resources-cms.js?v=16-2"></script><script src="./cafasso-book-size-rule.js?v=43"></script></body>
</html>
