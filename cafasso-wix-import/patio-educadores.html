<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#103c3b">
<title>CAFASSO · Patio</title>
<link rel="icon" href="./favicon.svg">
<link rel="stylesheet" href="./educadores.css?v=17">
</head>
<body>
<div class="edu-app" id="eduApp">
  <aside class="house-sidebar" aria-label="Navegación de La Casa">
    <a class="house-brand" href="./educadores.html" aria-label="CAFASSO La Casa">
      <img src="./cafasso-logo.svg" alt="">
      <span><strong>CAFASSO</strong><small>La Casa</small></span>
    </a>
    <nav class="house-nav">
      <button data-nav="home"><i>⌂</i><span>Casa</span></button>
      <button data-nav="formacion"><i>▤</i><span>Escuela</span></button>
      <button data-nav="biblioteca"><i>▥</i><span>Recursos</span></button>
      <button data-nav="comunidad" class="active"><i>◎</i><span>Patio</span></button>
      <button data-nav="interioridad"><i>♧</i><span>Parroquia</span></button>
      <button data-nav="camino"><i>◇</i><span>Mi camino</span></button>
    </nav>
    <div class="house-sidebar-bottom">
      <button class="house-person" id="sidebarUser" type="button">
        <span class="house-person-avatar" id="sidebarAvatar">CF</span>
        <span><strong id="sidebarUserName">Mi cuenta</strong><small>Educador</small></span>
      </button>
      <button class="house-side-action house-admin-entry" id="adminEntry" type="button" hidden><i>⚙</i><span>Administración</span></button>
      <button class="house-side-action" id="switchExperience" type="button"><i>↔</i><span>Cambiar experiencia</span></button>
      <button class="house-side-action" id="logout" type="button"><i>↪</i><span>Cerrar sesión</span></button>
    </div>
  </aside>

  <header class="house-mobile-header">
    <a class="house-mobile-brand" href="./educadores.html">
      <img src="./cafasso-logo.svg" alt="">
      <span><strong>CAFASSO</strong><small>La Casa</small></span>
    </a>
    <button class="edu-avatar" id="userMenu" type="button" aria-label="Mi cuenta">CF</button>
    <div class="edu-user-menu" id="userMenuPanel" hidden>
      <strong id="userMenuName">Mi cuenta</strong>
      <button type="button" data-nav="camino">Mi camino</button>
      <button type="button" id="mobileAdminEntry" hidden>⚙ Administración</button>
      <button type="button" id="mobileSwitchExperience">Cambiar experiencia</button>
      <button type="button" id="mobileLogout">Cerrar sesión</button>
    </div>
  </header>

  <main class="edu-main" id="main" aria-live="polite">
    <div class="edu-loading"><span></span><strong>Abriendo el Patio…</strong></div>
  </main>

  <nav class="edu-mobile-nav" aria-label="Navegación móvil">
    <button data-nav="home"><i>⌂</i><span>Casa</span></button>
    <button data-nav="comunidad" class="active"><i>◎</i><span>Patio</span></button>
    <button data-nav="formacion"><i>▤</i><span>Escuela</span></button>
    <button data-nav="interioridad"><i>♧</i><span>Parroquia</span></button>
    <button data-nav="biblioteca"><i>▥</i><span>Recursos</span></button>
  </nav>
</div>
<script src="./cafasso-experience-access.js?v=1"></script>
<script src="./patio-educadores.js?v=3"></script>
<script defer src="./cafasso-admin-experience-switch.js?v=1"></script></body>
</html>
