<script>document.documentElement.dataset.cafassoBoot='animator';document.documentElement.dataset.cafassoPlayer='1';if(location.hash==='#cursos')document.documentElement.dataset.cafassoCoursesBoot='1';if(!location.hash||location.hash==='#inicio')document.documentElement.dataset.cafassoHomeV2='1';</script>
<title>CAFASSO · Curso</title>
<style>
:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A;--red:#A64747}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#102f35;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-cafasso-boot="animator"] #app{visibility:hidden;opacity:0}
html[data-cafasso-boot="animator"] #app.cafasso-boot-ready{visibility:visible;opacity:1;transition:opacity .16s ease-out}
html[data-cafasso-boot="animator"] body.cafasso-mission-mode #app{visibility:hidden!important;opacity:0!important}
html[data-cafasso-boot="animator"] body.cafasso-mission-mode #app.cafasso-boot-ready{visibility:visible!important;opacity:1!important}
#app{min-height:100vh;min-height:100dvh}
.player-shell{display:block;min-height:100vh;min-height:100dvh}
#main{width:100%;min-height:100vh;min-height:100dvh;margin:0;padding:0}
.loading,.error,.empty{padding:36px;text-align:center;color:#f7f1e4}
.error{margin:30px;background:#4b2525;border:1px solid rgba(255,255,255,.16);border-radius:12px}
.module-detail{width:100%;max-width:none;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:#EDF5F1;color:var(--green);font-size:11px;font-weight:800}
.badge.gold{background:#fff4cc;color:#886500}.badge.gray{background:#f0f1f2;color:#69717c}
.mini{height:7px;background:#ece5d9;border-radius:999px;overflow:hidden;margin:16px 0}.mini span{display:block;height:100%;background:var(--gold)}
.btn{border:0;background:var(--gold);color:var(--navy);font-weight:800;border-radius:12px;padding:10px 13px;cursor:pointer}
.btn.alt{background:#fff;border:1px solid var(--line)}.btn.done{background:#EDF5F1;color:var(--green);border:1px solid #CDE2D8}.btn:disabled{opacity:.48;cursor:not-allowed}
.block{margin-bottom:14px}.block h4{margin:0 0 10px;color:var(--navy);font-size:20px}
.block-type{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#B77D00;font-weight:800;margin-bottom:8px}
.block-text{color:#34465A;line-height:1.7;white-space:pre-wrap}.block-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.required{font-size:11px;font-weight:800;color:#8A6500;background:#FFF4CC;border-radius:999px;padding:5px 8px}.optional{font-size:11px;color:var(--muted)}
.media-img{display:block;max-width:100%;max-height:560px;border-radius:16px;border:1px solid var(--line);margin-top:12px}
.video-frame{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;background:#000;margin-top:12px}.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.resource-link{display:inline-flex;margin-top:12px;text-decoration:none}
.activity{margin-top:14px;padding:16px;background:#F7F1E8;border-radius:16px}.activity label{display:block;color:var(--navy);font-weight:800;margin-bottom:8px}
.activity textarea{width:100%;min-height:120px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;resize:vertical}
.activity-actions,.review-row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px}.saved-note{font-size:12px;color:var(--green);font-weight:700}
.feedback{margin-top:12px;padding:14px;border-left:4px solid var(--gold);background:#FFF8DD;border-radius:12px}.feedback strong{display:block;color:var(--navy);margin-bottom:6px}.feedback p{margin:0;white-space:pre-wrap;line-height:1.55}
.review-row{border-top:1px solid var(--line);padding-top:14px}.review-row small{color:var(--muted)}
.module-progress{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.complete-box{margin-top:20px;background:#FFF7D7;border:1px solid #F3DF91;border-radius:18px;padding:18px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.complete-box p{margin:4px 0 0;color:#6C5500;font-size:13px}.complete-box.ready{background:#EDF5F1;border-color:#CDE2D8}.complete-box.ready p{color:#245F48}
.challenge-reward{display:inline-flex;align-items:center;gap:6px;margin:2px 0 12px;padding:7px 10px;border-radius:999px;background:#FFF4CC;color:#795900;font-size:12px;font-weight:850}
.challenge-criteria{margin:10px 0 0;padding:11px 12px;border-left:3px solid var(--gold);background:#FFF8DD;border-radius:10px;color:#6C5500;font-size:12px;line-height:1.5}
.challenge-approved{background:#EDF5F1!important;border-color:#CDE2D8!important;color:#245F48!important}
@media(max-width:680px){
 .card{border-radius:16px;padding:17px}.block h4{font-size:19px}.block-text{font-size:15px;line-height:1.65}
 .activity{padding:14px}.activity textarea{min-height:150px;font-size:16px}
 .activity-actions,.review-row,.complete-box{display:grid;grid-template-columns:1fr;align-items:stretch}
 .activity-actions .btn,.review-row .btn,.complete-box .btn{width:100%;min-height:46px}
}
</style>

 html[data-cafasso-player="1"] body.cafasso-mission-mode .cafasso-mission-nav{grid-template-columns:repeat(5,minmax(72px,1fr))!important;gap:8px!important;overflow-x:auto!important;overscroll-behavior-inline:contain;padding:5px 2px 10px!important;scrollbar-width:none}
 html[data-cafasso-player="1"] body.cafasso-mission-mode .cafasso-mission-nav::-webkit-scrollbar{display:none}

 html[data-cafasso-player="1"] body.cafasso-mission-mode .cafasso-mission-shell{padding:12px max(18px,4vw) 20px!important}

<body>
<div id="app" class="loading">Cargando tu espacio CAFASSO…</div>
<script>
(function(){
  var ME_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoMe';
  var PROFILE_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoAnimatorProfile';
  var COURSE_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';
  var PROGRESS_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoProgress';
  var SUBMISSION_API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoSubmission';
  var session=null,data=null,selectedCourse=null,selectedModule=null,courseSubmissions=[];
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c];});}
  function readSession(){try{return JSON.parse(localStorage.getItem('cafassoSession')||'null');}catch(e){return null;}}
  function initialDataApi(){var id=new URLSearchParams(location.search).get('previewUser');return id?PROFILE_API+'?userId='+encodeURIComponent(id):ME_API;}
  function isAdmin(){return String(session.user.role||'').toLowerCase().indexOf('admin')!==-1;}
  function progressRecord(courseId){return (data.progress||[]).filter(function(p){return p.userId===session.user._id&&p.courseId===courseId;})[0]||null;}
  function getProgress(courseId){var p=progressRecord(courseId);return p?Number(p.percent||0):0;}
  function completedModules(courseId){var p=progressRecord(courseId);return p&&Array.isArray(p.completedModules)?p.completedModules:[];}
  function assignedCourses(){var uid=session.user._id,gid=session.user.groupId,ids={};(data.assignments||[]).forEach(function(a){if(a.active===false)return;if(a.targetType==='user'&&a.targetId===uid)ids[a.courseId]=true;if(a.targetType==='group'&&gid&&a.targetId===gid)ids[a.courseId]=true;});return (data.courses||[]).filter(function(c){return ids[c._id]&&(c.status==='Publicado'||isAdmin());}).map(function(c){var copy={};for(var k in c)copy[k]=c[k];copy.myProgress=getProgress(c._id);return copy;});}
  function moduleStoreKey(){return 'cafasso-module-work-'+session.user._id+'-'+selectedCourse._id+'-'+selectedModule._id;}
  function readModuleWork(){var local={done:{},answers:{}};try{local=JSON.parse(localStorage.getItem(moduleStoreKey())||'{"done":{},"answers":{}}');}catch(e){}var p=progressRecord(selectedCourse&&selectedCourse._id),done=Object.assign({},local.done||{}),answers=Object.assign({},local.answers||{});(p&&p.completedBlocks||[]).forEach(function(id){done[id]=true;});Object.assign(answers,(p&&p.blockAnswers)||{});return {done:done,answers:answers};}
  function storeModuleWorkLocal(work){try{localStorage.setItem(moduleStoreKey(),JSON.stringify(work));}catch(e){}}
  function saveModuleWork(work){storeModuleWorkLocal(work);var blockAnswers=work.answers||{},completedBlocks=Object.keys(work.done||{}).filter(function(id){return work.done[id];});fetch(PROGRESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,completedBlocks:completedBlocks,blockAnswers:blockAnswers})}).then(function(r){return r.json();}).then(function(j){if(j&&j.ok&&j.progress){var list=data.progress||[],found=false;for(var i=0;i<list.length;i++){if(list[i].userId===j.progress.userId&&list[i].courseId===j.progress.courseId){list[i]=Object.assign(list[i],j.progress);found=true;break;}}if(!found)list.push(j.progress);data.progress=list;publishAnimatorState();}}).catch(function(e){console.warn('No se pudo sincronizar el avance de contenidos.',e);});}
  function submissionFor(blockId){return courseSubmissions.filter(function(s){return s.activityId===blockId;})[0]||null;}
  function activityAnswer(blockId,work){var s=submissionFor(blockId);return s&&s.content!=null?s.content:((work.answers||{})[blockId]||'');}
  function requiredBlocks(){return (selectedModule.contents||[]).filter(function(b){return b.required!==false;});}
  function isBlockDone(block,work){if(block.required===false)return true;var t=String(block.type||'').toLowerCase(),submission=submissionFor(block._id),approved=submission&&/^aprobad/i.test(String(submission.status||'').trim());if(approved)return true;if(t==='desafío')return !!approved;if(t==='reflexión'||t==='entrega'||t==='evaluación')return !!String(activityAnswer(block._id,work)||'').trim();return !!(work.done||{})[block._id];}
  function requiredStatus(){var work=readModuleWork(),req=requiredBlocks(),done=req.filter(function(b){return isBlockDone(b,work);}).length;return {work:work,total:req.length,done:done,ready:req.length===0||done===req.length};}
  function layout(){
    var app=document.getElementById('app');
    if(!app)return;
    app.className='';
    app.innerHTML='<div class="player-shell"><main id="main" aria-live="polite"></main></div>';
  }

  function returnToSchool(){
    var params=new URLSearchParams(location.search);
    var courseId=String(params.get('course')||(selectedCourse&&selectedCourse._id)||'').trim();
    var target=new URL('./world.html',location.href);
    target.searchParams.set('space','escuela');
    if(courseId)target.searchParams.set('course',courseId);
    target.searchParams.set('fromMission','1');
    location.replace(target.toString());
  }
  function navigate(view,replace){
    if(view!=='modulo'){
      returnToSchool();
      return;
    }
    var url=location.pathname+location.search+'#modulo';
    if(replace)history.replaceState({view:'modulo'},'',url);
    else if(location.hash!=='#modulo')history.pushState({view:'modulo'},'',url);
    document.body.classList.add('cafasso-mission-mode');
    document.getElementById('app')?.classList.remove('cafasso-boot-ready');
    render('modulo');
  }
  window.CafassoNavigate=navigate;
  function render(view){
    var main=document.getElementById('main');
    if(!main)return;
    if(view==='modulo'&&selectedCourse&&selectedModule){
      renderModule();
      return;
    }
    returnToSchool();
  }

  function loadCourseSubmissions(courseId){return fetch(SUBMISSION_API+'?userId='+encodeURIComponent(session.user._id)+'&courseId='+encodeURIComponent(courseId),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudieron cargar las respuestas.');courseSubmissions=x.j.submissions||[];}).catch(function(e){console.warn(e);courseSubmissions=[];});}
  window.CafassoReloadCourseSubmissions=function(){if(!selectedCourse)return Promise.resolve();var before={};courseSubmissions.forEach(function(s){before[s.activityId]=s.status;});return loadCourseSubmissions(selectedCourse._id).then(function(){courseSubmissions.forEach(function(s){if(s.status==='Aprobada'&&before[s.activityId]!=='Aprobada'){try{window.dispatchEvent(new CustomEvent('cafasso:block-completed',{detail:{blockId:s.activityId,status:s.status}}));}catch(e){}}});if(selectedModule){publishExperience('module');renderModule();}});};
  function openCourse(id,moduleId){var main=document.getElementById('main');var allowed=(assignedCourses()||[]).some(function(c){return String(c._id)===String(id);});if(!allowed&&!isAdmin()){main.innerHTML='<div class="error">Este curso no está asignado a tu cuenta.</div>';return;}try{sessionStorage.setItem('cafassoSelectedCourse',id);}catch(e){}main.innerHTML='<div class="loading">Cargando curso…</div>';fetch(COURSE_API+'?id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo cargar el curso.');selectedCourse=x.j.course;selectedCourse.myProgress=getProgress(id);selectedModule=null;return loadCourseSubmissions(id);}).then(function(){if(moduleId){var mods=publishedModules(),idx=mods.findIndex(function(m){return String(m._id)===String(moduleId);}),doneIds=completedModules(id);if(idx>=0&&moduleUnlocked(mods[idx],idx,mods,doneIds)){selectedModule=mods[idx];navigate('modulo');return;}try{sessionStorage.setItem('cafassoSchoolNotice',idx>=0?'Esta etapa todavía está bloqueada. Completá la anterior para continuar.':'No encontramos esa etapa en el curso.');}catch(e){}}returnToSchool();}).catch(function(e){main.innerHTML='<div class="error"><strong>No pudimos abrir esta misión.</strong><br>'+esc(e.message)+'</div>';document.getElementById('app')?.classList.add('cafasso-boot-ready');});}
  function publishedModules(){return (selectedCourse.modules||[]).filter(function(m){return m.status==='Publicado'||isAdmin();});}
  function moduleUnlocked(mod,index,mods,doneIds){if(index===0)return true;if(mod.unlockAfterPrevious===false)return true;return doneIds.indexOf(mods[index-1]._id)!==-1;}
  function publishExperience(view){if(selectedModule)saveModuleWork(readModuleWork());window.CafassoCourseExperience={view:view,course:selectedCourse,module:selectedModule,submissions:courseSubmissions,work:selectedModule?readModuleWork():null};try{window.dispatchEvent(new CustomEvent('cafasso:course-experience-ready'));}catch(e){}}
  function blockText(block){var c=block.content||{};return c.text||c.body||c.description||c.url||c.link||'';}
  function youtubeEmbed(url){var s=String(url||''),m=s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);return m?'https://www.youtube.com/embed/'+m[1]:'';}
  function safeUrl(value){var s=String(value||'').trim();return /^https?:\/\//i.test(s)?s:'';}
  function renderBlock(block,work){var type=String(block.type||'Texto'),low=type.toLowerCase(),body=blockText(block),required=block.required!==false,done=isBlockDone(block,work),submission=submissionFor(block._id),settings=block.settings||{},reward=Math.max(0,Number(settings.rewardAlmitas||0)),criteria=String(settings.reviewCriteria||'').trim(),html='<article class="card block" data-block-card="'+esc(block._id)+'"><div class="block-meta"><div class="block-type">'+esc(type)+'</div>'+(required?'<span class="required">OBLIGATORIO</span>':'<span class="optional">Opcional</span>')+(required&&done?'<span class="badge">✓ LISTO</span>':'')+(submission?'<span class="badge '+(submission.status==='Aprobada'?'':'gold')+'">'+esc(submission.status||'Pendiente')+'</span>':'')+'</div><h4>'+esc(block.title||type||'Contenido')+'</h4>';
    if(low==='imagen'){var img=safeUrl(body);html+=img?'<img class="media-img" src="'+esc(img)+'" alt="'+esc(block.title||'Imagen del módulo')+'">':'<div class="block-text">'+esc(body||'Agregá la URL de la imagen desde el editor del curso.')+'</div>';}
    else if(low==='video'){var emb=youtubeEmbed(body),url=safeUrl(body);if(emb)html+='<div class="video-frame"><iframe src="'+esc(emb)+'" title="'+esc(block.title||'Video')+'" allowfullscreen></iframe></div>';else if(url)html+='<a class="btn alt resource-link" href="'+esc(url)+'" target="_blank" rel="noopener">Abrir video ↗</a>';else html+='<div class="block-text">'+esc(body||'Agregá la URL del video desde el editor del curso.')+'</div>';}
    else if(low==='documento'){var doc=safeUrl(body);html+=doc?'<a class="btn alt resource-link" href="'+esc(doc)+'" target="_blank" rel="noopener">Abrir documento ↗</a>':'<div class="block-text">'+esc(body||'Agregá el enlace al documento desde el editor del curso.')+'</div>';}
    else if(low==='desafío'){var challengeAnswer=activityAnswer(block._id,work),approved=submission&&submission.status==='Aprobada',challengeReward=Number(submission?.rewardAlmitas||reward||0);html+='<div class="challenge-reward">⭐ '+esc(challengeReward||reward||0)+' almitas · aprobación del formador</div>'+(criteria?'<div class="challenge-criteria"><strong>Qué va a mirar el formador</strong><br>'+esc(criteria)+'</div>':'')+'<div class="block-text" style="margin-top:12px">'+esc(body||'Realizá el desafío y entregá tu evidencia para continuar.')+'</div>'+(approved?'<div class="activity challenge-approved"><strong>✓ Desafío aprobado</strong><br>Las almitas ya fueron acreditadas. ¡Gracias por poner el corazón en la misión!</div>':'<div class="activity"><label>Tu entrega</label><textarea data-answer="'+esc(block._id)+'" placeholder="Contá qué hiciste y cómo lo realizaste…">'+esc(challengeAnswer)+'</textarea><div class="activity-actions"><span class="saved-note">'+(submission?'✓ Entrega enviada · '+esc(submission.status||'Pendiente'):challengeAnswer?'✓ Guardada en este dispositivo':'')+'</span><button class="btn" data-save-answer="'+esc(block._id)+'">'+(submission?'Actualizar entrega':'Enviar desafío')+'</button></div></div>')+(submission&&submission.feedback?'<div class="feedback"><strong>Devolución del equipo formador</strong><p>'+esc(submission.feedback)+'</p></div>':'');}
    else if(low==='reflexión'||low==='entrega'||low==='evaluación'){var answer=activityAnswer(block._id,work);html+='<div class="block-text">'+esc(body||'Respondé la consigna para continuar.')+'</div><div class="activity"><label>Tu respuesta</label><textarea data-answer="'+esc(block._id)+'" placeholder="Escribí acá…">'+esc(answer)+'</textarea><div class="activity-actions"><span class="saved-note">'+(submission?'✓ Guardada en CAFASSO':answer?'✓ Guardada en este dispositivo':'')+'</span><button class="btn" data-save-answer="'+esc(block._id)+'">'+(submission?'Actualizar respuesta':'Guardar respuesta')+'</button></div></div>'+(submission&&submission.feedback?'<div class="feedback"><strong>Devolución del equipo formador</strong><p>'+esc(submission.feedback)+'</p></div>':'');}
    else html+='<div class="block-text">'+esc(body||'Este contenido se completará desde el editor del curso.')+'</div>';
    if(required&&!(low==='reflexión'||low==='entrega'||low==='evaluación'||low==='desafío'))html+='<div class="review-row"><small>'+(done?'Este contenido ya cuenta como revisado.':'Marcá este contenido cuando hayas terminado de revisarlo.')+'</small><button class="btn '+(done?'done':'alt')+'" data-review="'+esc(block._id)+'">'+(done?'✓ Revisado':'Marcar como revisado')+'</button></div>';return html+'</article>';}
  function renderModule(){
    var c=selectedCourse,m=selectedModule,main=document.getElementById('main');
    if(!c||!m||!main){returnToSchool();return;}
    var doneIds=completedModules(c._id);
    var done=doneIds.indexOf(m._id)!==-1;
    var status=requiredStatus();
    var blocks=(m.contents||[]).map(function(b){return renderBlock(b,status.work);}).join('');
    var pct=status.total?Math.round(status.done/status.total*100):100;

    main.innerHTML='<div class="module-detail">'+
      '<div class="module-progress"><strong>Contenidos obligatorios: '+status.done+' de '+status.total+'</strong>'+
      '<div class="mini"><span style="width:'+pct+'%"></span></div>'+
      '<small style="color:var(--muted)">'+(status.ready?'Ya cumpliste todos los requisitos de este módulo.':'Completá los contenidos señalados como obligatorios para poder cerrar el módulo.')+'</small></div>'+
      (blocks||'<div class="card empty">Este módulo todavía no tiene contenidos cargados.</div>')+
      '<div class="complete-box '+(status.ready?'ready':'')+'"><div><strong>'+
      (done?'Módulo completado':status.ready?'¡Módulo listo para completar!':'Todavía faltan contenidos obligatorios')+
      '</strong><p>'+(done?'El progreso de esta etapa ya quedó guardado.':status.ready?'CAFASSO cerrará esta etapa cuando completes la última misión.':'Cuando completes los contenidos obligatorios se habilitará el cierre de la etapa.')+
      '</p></div><button id="completeModule" class="btn '+(done?'done':'')+'" '+(!done&&!status.ready?'disabled':'')+'>'+
      (done?'✓ Completado':'Completar etapa')+'</button></div></div>';

    var complete=document.getElementById('completeModule');
    if(complete)complete.onclick=function(){saveModuleProgress(!done);};
    Array.prototype.forEach.call(document.querySelectorAll('[data-review]'),function(b){b.onclick=function(){toggleReview(b.getAttribute('data-review'));};});
    Array.prototype.forEach.call(document.querySelectorAll('[data-save-answer]'),function(b){b.onclick=function(){saveAnswer(b.getAttribute('data-save-answer'));};});
    Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'),function(field){
      field.addEventListener('input',function(){
        var blockId=field.getAttribute('data-answer');
        if(!blockId)return;
        var work=readModuleWork();
        work.answers=work.answers||{};
        work.answers[blockId]=field.value;
        storeModuleWorkLocal(work);
        var card=field.closest('[data-block-card]');
        var note=card&&card.querySelector('.saved-note');
        if(note&&!submissionFor(blockId))note.textContent='Borrador guardado en este dispositivo';
      });
    });
    publishExperience('module');
  }

  function toggleReview(blockId){var work=readModuleWork();work.done=work.done||{};work.done[blockId]=!work.done[blockId];saveModuleWork(work);renderModule();if(work.done[blockId]){try{window.dispatchEvent(new CustomEvent('cafasso:block-completed',{detail:{blockId:blockId}}));}catch(e){}}}
  function saveAnswer(blockId){var el=document.querySelector('[data-answer="'+CSS.escape(blockId)+'"]'),value=el?el.value.trim():'';if(!value){alert('Escribí una respuesta antes de guardarla.');return;}var block=(selectedModule.contents||[]).filter(function(b){return b._id===blockId;})[0];if(!block)return;var existing=submissionFor(blockId);if(String(block.type||'').toLowerCase()==='desafío'&&existing&&existing.status==='Aprobada'){alert('Este desafío ya fue aprobado y sus almitas ya fueron acreditadas.');return;}var work=readModuleWork();work.answers=work.answers||{};work.answers[blockId]=value;saveModuleWork(work);var btn=document.querySelector('[data-save-answer="'+CSS.escape(blockId)+'"]');if(btn){btn.disabled=true;btn.textContent='Enviando…';}fetch(SUBMISSION_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,activityId:blockId,type:block.type||'Entrega',content:value})}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo guardar la respuesta.');var s=x.j.submission,found=false;for(var i=0;i<courseSubmissions.length;i++){if(courseSubmissions[i].activityId===blockId){courseSubmissions[i]=s;found=true;break;}}if(!found)courseSubmissions.push(s);if(window.CafassoAnimatorState){window.CafassoAnimatorState.data= data;window.dispatchEvent(new CustomEvent('cafasso:state-ready'));}renderModule();try{window.dispatchEvent(new CustomEvent('cafasso:block-completed',{detail:{blockId:blockId,status:s.status||'Pendiente'}}));}catch(e){}try{if(String(block.type||'').toLowerCase().includes('desaf'))window.dispatchEvent(new CustomEvent('cafasso:challenge-submitted',{detail:{courseId:selectedCourse._id,moduleId:selectedModule._id,blockId:blockId,status:s.status||'Pendiente'}}));}catch(e){}}).catch(function(e){alert('La respuesta quedó guardada en este dispositivo, pero no pudimos enviarla a CAFASSO: '+(e.message||'error de conexión'));renderModule();});}
  function saveModuleProgress(completed){if(completed&&!requiredStatus().ready){alert('Todavía faltan contenidos obligatorios por completar.');return;}var btn=document.getElementById('completeModule');if(btn){btn.disabled=true;btn.textContent='Guardando…';}fetch(PROGRESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,completed:completed})}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo guardar el progreso.');var record=x.j.progress||{},list=data.progress||[],found=false;for(var i=0;i<list.length;i++){if(list[i].userId===record.userId&&list[i].courseId===record.courseId){list[i]=record;found=true;break;}}if(!found)list.push(record);data.progress=list;selectedCourse.myProgress=Number(record.percent||0);publishAnimatorState();renderModule();}).catch(function(e){alert(e.message||'No se pudo guardar el progreso.');renderModule();});}
  window.CafassoCompleteModule=function(moduleId){if(!selectedCourse||!moduleId)return Promise.resolve();return fetch(PROGRESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:moduleId,completed:true})}).then(function(r){return r.json();}).then(function(j){if(!j||!j.ok)throw new Error(j&&j.error||'No se pudo completar el módulo.');var record=j.progress||{},list=data.progress||[],found=false;for(var i=0;i<list.length;i++){if(list[i].userId===record.userId&&list[i].courseId===record.courseId){list[i]=record;found=true;break;}}if(!found)list.push(record);data.progress=list;publishAnimatorState();try{window.dispatchEvent(new CustomEvent('cafasso:module-completed',{detail:{courseId:selectedCourse._id,moduleId:moduleId}}));}catch(e){}return j;});};
  function fail(message){var app=document.getElementById('app');if(!app)return;app.className='cafasso-boot-ready';app.innerHTML='<div class="error"><strong>No pudimos cargar tu espacio.</strong><br>'+esc(message)+'</div>';}
  function publishAnimatorState(){
    window.CafassoAnimatorState={data:data,session:session};
    try{window.dispatchEvent(new CustomEvent('cafasso:state-ready'));}catch(e){}
  }
  function init(){
    session=readSession();
    if(!session||!session.user||!session.user.email){location.replace('./login.html');return;}
    var playerParams=new URLSearchParams(location.search);
    var directCourse=String(playerParams.get('course')||'').trim();
    var directModule=String(playerParams.get('module')||'').trim();
    if(playerParams.get('player')!=='1'||!directCourse||!directModule){returnToSchool();return;}

    var timedOut=false,timer=setTimeout(function(){
      timedOut=true;
      fail('La conexión con CAFASSO demoró demasiado. Probá recargar la página.');
    },12000);

    fetch(initialDataApi(),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){
      if(timedOut)return;
      clearTimeout(timer);
      if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo cargar CAFASSO.');
      data=x.j;
      if(!Array.isArray(data.users)&&data.user)data.users=[data.user];
      if(!Array.isArray(data.groups))data.groups=[];
      var fresh=(data.users||[]).filter(function(u){return String(u.email||'').toLowerCase()===String(session.user.email||'').toLowerCase();})[0];
      if(!fresh||fresh.status==='Bloqueado'||fresh.status==='Inactivo'){localStorage.removeItem('cafassoSession');location.replace('./login.html');return;}
      for(var k in fresh)session.user[k]=fresh[k];
      localStorage.setItem('cafassoSession',JSON.stringify(session));
      publishAnimatorState();
      layout();
      openCourse(directCourse,directModule);
    }).catch(function(e){
      if(timedOut)return;
      clearTimeout(timer);
      fail(e.message||'Error al conectar con CAFASSO.');
    });
  }

  window.addEventListener('pagehide',function(){
    if(!selectedCourse||!selectedModule)return;
    var work=readModuleWork();
    work.answers=work.answers||{};
    Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'),function(field){
      var id=field.getAttribute('data-answer');
      if(id)work.answers[id]=field.value;
    });
    storeModuleWorkLocal(work);
  });
  window.addEventListener('popstate',function(){if((location.hash||'#modulo')!=='#modulo')returnToSchool();});init();
})();
</script>
