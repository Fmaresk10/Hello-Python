    var autoPercent=closedMax?Math.round(earned/closedMax*100):100,closedPassed=autoPercent>=Number(ev.passingScore||0),state={_cafassoEval:1,attempts:attempts+1,answers:answers,results:results,autoPercent:autoPercent,earned:earned,closedMax:closedMax,pendingReview:false,passed:false,submittedAt:new Date().toISOString()};

  }
  function renderBlock(block,work){var type=String(block.type||'Texto'),low=type.toLowerCase(),body=blockText(block),required=block.required!==false,done=isBlockDone(block,work),submission=submissionFor(block._id),settings=block.settings||{},reward=Math.max(0,Number(settings.rewardAlmitas||0)),criteria=String(settings.reviewCriteria||'').trim(),html='<article class="card block" data-block-card="'+esc(block._id)+'"><div class="block-meta"><div class="block-type">'+esc(type)+'</div>'+(required?'<span class="required">OBLIGATORIO</span>':'<span class="optional">Opcional</span>')+(required&&done?'<span class="badge">✓ LISTO</span>':'')+(submission?'<span class="badge '+(submission.status==='Aprobada'?'':'gold')+'">'+esc(submission.status||'Pendiente')+'</span>':'')+'</div><h4>'+esc(block.title||type||'Contenido')+'</h4>';

  function renderModule(){
    var c=selectedCourse,m=selectedModule,main=document.getElementById('main');
    if(!c||!m||!main){returnToSchool();return;}
    var missionMode=moduleUsesMissions(m);
    document.body.classList.toggle('cafasso-mission-mode',missionMode);
    document.body.classList.toggle('cafasso-linear-module-mode',!missionMode);
    document.documentElement.dataset.cafassoPlayerReady='1';
    var doneIds=completedModules(c._id);
    var done=doneIds.indexOf(m._id)!==-1;
    var status=requiredStatus();
    var blocks=(m.contents||[]).map(function(b){return renderBlock(b,status.work);}).join('');
    var pct=status.total?Math.round(status.done/status.total*100):100;

    main.innerHTML='<div class="module-detail">'+
      (!missionMode?renderLinearNav('top'):'')+
      '<div class="module-progress"><strong>Contenidos obligatorios: '+status.done+' de '+status.total+'</strong>'+
      '<div class="mini"><span style="width:'+pct+'%"></span></div>'+
      '<small style="color:var(--muted)">'+(status.ready?'Ya cumpliste todos los requisitos de este módulo.':'Completá los contenidos señalados como obligatorios para poder cerrar el módulo.')+'</small></div>'+
      (blocks||'<div class="card empty">Este módulo todavía no tiene contenidos cargados.</div>')+
      '<div class="complete-box '+(status.ready?'ready':'')+'"><div><strong>'+
      (done?'Módulo completado':status.ready?'¡Módulo listo para completar!':'Todavía faltan contenidos obligatorios')+
      '</strong><p>'+(done?'El progreso de esta etapa ya quedó guardado.':status.ready?'CAFASSO cerrará esta etapa cuando completes la última misión.':'Cuando completes los contenidos obligatorios se habilitará el cierre de la etapa.')+
      '</p></div><button id="completeModule" class="btn '+(done?'done':'')+'" '+(done||!status.ready?'disabled':'')+'>'+
      (done?'✓ Completado':'Completar etapa')+'</button></div>'+
      (!missionMode?renderLinearNav('bottom'):'')+
      '</div>';

    if(!missionMode)bindLinearNav();
    var complete=document.getElementById('completeModule');
    if(complete&&!done)complete.onclick=function(){saveModuleProgress(true);};
    Array.prototype.forEach.call(document.querySelectorAll('[data-review]'),function(b){b.onclick=function(){toggleReview(b.getAttribute('data-review'));};});
    Array.prototype.forEach.call(document.querySelectorAll('[data-save-answer]'),function(b){b.onclick=function(){saveAnswer(b.getAttribute('data-save-answer'));};});
    Array.prototype.forEach.call(document.querySelectorAll('[data-submit-evaluation]'),function(b){b.onclick=function(){submitEvaluation(b.getAttribute('data-submit-evaluation'));};});
    Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'),function(field){
      field.addEventListener('input',function(){
        var blockId=field.getAttribute('data-answer');
        if(!blockId)return;
        var work=readModuleWork();
        work.answers=work.answers||{};
        work.answers[blockId]=field.value;
        storeModuleWorkLocal(work);
        var card=field.closest('[data-block-card]');
        var note=card&&card.querySelector('.saved-note');

      });
    });
    publishExperience('module');
    if(!missionMode)document.getElementById('app')?.classList.add('cafasso-boot-ready');
  }

  function toggleReview(blockId){var work=readModuleWork();work.done=work.done||{};work.done[blockId]=!work.done[blockId];saveModuleWork(work);renderModule();if(work.done[blockId]){try{window.dispatchEvent(new CustomEvent('cafasso:block-completed',{detail:{blockId:blockId}}));}catch(e){}}}
  function saveAnswer(blockId){var el=document.querySelector('[data-answer="'+CSS.escape(blockId)+'"]'),value=el?el.value.trim():'';if(!value){alert('Escribí una respuesta antes de guardarla.');return;}var block=(selectedModule.contents||[]).filter(function(b){return b._id===blockId;})[0];if(!block)return;var minimum=String(block.type||'').toLowerCase()==='evaluación'?Math.max(0,Number(block.settings&&block.settings.minimumCharacters||0)):0;if(minimum&&value.length<minimum){alert('Esta evaluación necesita una respuesta de al menos '+minimum+' caracteres. Ahora tiene '+value.length+'.');return;}var existing=submissionFor(blockId);if(String(block.type||'').toLowerCase()==='desafío'&&existing&&existing.status==='Aprobada'){alert('Este desafío ya fue aprobado y sus almitas ya fueron acreditadas.');return;}var work=readModuleWork();work.answers=work.answers||{};work.answers[blockId]=value;saveModuleWork(work);var btn=document.querySelector('[data-save-answer="'+CSS.escape(blockId)+'"]');if(btn){btn.disabled=true;btn.textContent='Enviando…';}fetch(SUBMISSION_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,activityId:blockId,type:block.type||'Entrega',content:value})}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo guardar la respuesta.');var s=x.j.submission,found=false;for(var i=0;i<courseSubmissions.length;i++){if(courseSubmissions[i].activityId===blockId){courseSubmissions[i]=s;found=true;break;}}if(!found)courseSubmissions.push(s);if(window.CafassoAnimatorState){window.CafassoAnimatorState.data= data;window.dispatchEvent(new CustomEvent('cafasso:state-ready'));}renderModule();try{window.dispatchEvent(new CustomEvent('cafasso:block-completed',{detail:{blockId:blockId,status:s.status||'Pendiente'}}));}catch(e){}try{if(String(block.type||'').toLowerCase().i   function saveModuleProgress(completed){
    if(!completed)return;
    if(!requiredStatus().ready){alert('Todavía faltan contenidos obligatorios por completar.');return;}
    var btn=document.getElementById('completeModule');
    if(btn){btn.disabled=true;btn.textContent='Guardando…';}
    fetch(PROGRESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:selectedModule._id,completed:true})})
      .then(function(r){return r.json().then(function(j){return {r:r,j:j};});})
      .then(function(x){
        if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo guardar el progreso.');
        var record=x.j.progress||{},list=data.progress||[],found=false;
        for(var i=0;i<list.length;i++){
          if(list[i].userId===record.userId&&list[i].courseId===record.courseId){list[i]=record;found=true;break;}
        }
        if(!found)list.push(record);
        data.progress=list;
        selectedCourse.myProgress=Number(record.percent||0);
        publishAnimatorState();
        try{window.dispatchEvent(new CustomEvent('cafasso:module-completed',{detail:{courseId:selectedCourse._id,moduleId:selectedModule._id}}));}catch(e){}
        var mods=publishedModules(),doneIds=completedModules(selectedCourse._id).map(String);
        var allPublishedDone=mods.length>0&&mods.every(function(mod){return doneIds.indexOf(String(mod._id))!==-1;});
        var courseDone=selectedModuleIsFinal()&&(Number(record.percent||0)>=100||allPublishedDone);
        if(courseDone){showCourseCompletion();return;}
        renderModule();
      })
      .catch(function(e){alert(e.message||'No se pudo guardar el progreso.');renderModule();});
  }
  window.CafassoCompleteModule=function(moduleId){
    if(!selectedCourse||!moduleId)return Promise.resolve();
    return fetch(PROGRESS_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:session.user._id,courseId:selectedCourse._id,moduleId:moduleId,completed:true})})
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j||!j.ok)throw new Error(j&&j.error||'No se pudo completar el módulo.');
        var record=j.progress||{},list=data.progress||[],found=false;
        for(var i=0;i<list.length;i++){
          if(list[i].userId===record.userId&&list[i].courseId===record.courseId){list[i]=record;found=true;break;}
        }
        if(!found)list.push(record);
        data.progress=list;
        selectedCourse.myProgress=Number(record.percent||0);
        publishAnimatorState();
        try{window.dispatchEvent(new CustomEvent('cafasso:module-completed',{detail:{courseId:selectedCourse._id,moduleId:moduleId}}));}catch(e){}
        return j;
      });
  };
  function fail(message){document.documentElement.dataset.cafassoPlayerReady='1';var app=document.getElementById('app');if(!app)return;app.className='cafasso-boot-ready';app.innerHTML='<div class="error"><strong>No pudimos cargar tu espacio.</strong><br>'+esc(message)+'</div>';}
  function publishAnimatorState(){
    window.CafassoAnimatorState={data:data,session:session};
    try{window.dispatchEvent(new CustomEvent('cafasso:state-ready'));}catch(e){}
  }
  function init(){
    session=readSession();
    if(!session||!session.user||!session.user.email){location.replace('./login.html');return;}
    var playerParams=new URLSearchParams(location.search);
    var directCourse=String(playerParams.get('course')||'').trim();
    var directModule=String(playerParams.get('module')||'').trim();
    if(playerParams.get('player')!=='1'||!directCourse||!directModule){returnToSchool();return;}

    var timedOut=false,timer=setTimeout(function(){
      timedOut=true;
      fail('La conexión con CAFASSO demoró demasiado. Probá recargar la página.');
    },12000);

    fetch(initialDataApi(),{cache:'no-store'}).then(function(r){return r.json().then(function(j){return {r:r,j:j};});}).then(function(x){
      if(timedOut)return;
      clearTimeout(timer);
      if(!x.r.ok||!x.j.ok)throw new Error(x.j.error||'No se pudo cargar CAFASSO.');
      data=x.j;
      if(!Array.isArray(data.users)&&data.user)data.users=[data.user];
      if(!Array.isArray(data.groups))data.groups=[];
      var fresh=(data.users||[]).filter(function(u){return String(u.email||'').toLowerCase()===String(session.user.email||'').toLowerCase();})[0];
      if(!fresh||fresh.status==='Bloqueado'||fresh.status==='Inactivo'){localStorage.removeItem('cafassoSession');location.replace('./login.html');return;}
      for(var k in fresh)session.user[k]=fresh[k];
      localStorage.setItem('cafassoSession',JSON.stringify(session));
      publishAnimatorState();
      layout();
      openCourse(directCourse,directModule);
    }).catch(function(e){
      if(timedOut)return;
      clearTimeout(timer);
      fail(e.message||'Error al conectar con CAFASSO.');
    });
  }

  window.addEventListener('pagehide',function(){
    if(!selectedCourse||!selectedModule)return;
    var work=readModuleWork();
    work.answers=work.answers||{};
    Array.prototype.forEach.call(document.querySelectorAll('[data-answer]'),function(field){
      var id=field.getAttribute('data-answer');
      if(id)work.answers[id]=field.value;
    });
    storeModuleWorkLocal(work);
  });
  window.addEventListener('popstate',function(){
    if((location.hash||'#modulo')!=='#modulo'){returnToSchool();return;}
    if(!selectedCourse)return;
    var moduleId=String(new URLSearchParams(location.search).get('module')||'').trim();
    if(!moduleId)return;
    if(selectedModule&&String(selectedModule._id)===moduleId)return;
    activatePlayerModule(moduleId,true);
  });init();
})();
