<!doctype html><html lang="es"><head><script src="./auth-guard.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAFASSO · Prueba de autorización de correo</title><style>:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--ink:#11233A;--muted:#687386;--line:#E8DCCB;--green:#2E7D59;--red:#A64747}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#fffdf9;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 16px 50px rgba(15,45,77,.08)}h1{font:32px Georgia,serif;color:var(--navy);margin:0 0 8px}p{color:var(--muted);line-height:1.5}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit}.btn{width:100%;border:0;background:var(--gold);color:var(--navy);font-weight:800;border-radius:12px;padding:13px;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.55;cursor:wait}.msg{margin-top:16px;padding:14px;border-radius:12px;background:#F7F2E9;display:none;white-space:pre-wrap;overflow-wrap:anywhere}.msg.ok{background:#EDF5F1;color:var(--green)}.msg.err{background:#FFF1F1;color:var(--red)}.back{display:inline-block;margin-top:16px;color:var(--navy);text-decoration:none;font-weight:700}</style></head><body><div class="card"><h1>Prueba de autorización CAFASSO</h1><p>Esta prueba usa tu sesión actual de administrador. Si CAFASSO la valida, Apps Script envía el correo de bienvenida.</p><div class="field"><label>Nombre</label><input id="name" value="Federico"></div><div class="field"><label>Correo de prueba</label><input id="email" type="email" value="federico.maresca@maturana.edu.uy" readonly></div><div class="field"><label>Contraseña temporal de prueba</label><input id="password" value="CAFASSO-Prueba-2026"></div><button class="btn" id="send">Probar autorización y envío</button><div class="msg" id="msg"></div><a class="back" href="./animadores.html">← Volver a Animadores</a></div><script>const APP='https://script.google.com/macros/s/AKfycbwwFIjRoNrptAA1_hjgE-gkX3lxxY1yjv6AzNpohH5Csx37VbAR-sjCLm9apnyAha0/exec';function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}const msg=document.getElementById('msg'),btn=document.getElementById('send');function show(text,type=''){msg.className='msg '+type;msg.style.display='block';msg.textContent=text}btn.onclick=async()=>{const auth=read('cafassoAuth');if(!auth?.sessionToken){show('No hay una sesión activa de CAFASSO. Volvé a iniciar sesión como administrador.','err');return}const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!name||!email||!password){show('Completá los tres campos.','err');return}btn.disabled=true;show('Validando administrador y enviando…');try{await fetch(APP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:auth.sessionToken,name,email,password})});show('Solicitud enviada. Si tu sesión fue validada como Administrador, el correo va a llegar en unos segundos.','ok')}catch(e){console.error(e);show('No se pudo enviar la solicitud.','err')}finally{btn.disabled=false}};</script></body></html>
