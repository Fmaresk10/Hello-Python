name: CAFASSO mobile animator

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_mobile_animador.py'
      - '.github/workflows/mobile-animador.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_mobile_animador.py
      - name: Commit patched mobile view
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Improve CAFASSO mobile animator experience"
            git push
          fi
