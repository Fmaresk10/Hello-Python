name: CAFASSO admin mobile v1
on:
  push:
    paths:
      - '.github/workflows/admin-mobile-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_admin_mobile_v1.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/admin.html
          git diff --cached --quiet || git commit -m "Build mobile-first admin dashboard"
          git push
