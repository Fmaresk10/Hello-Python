name: Auto CAFASSO temporary password UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/auto-temp-passwords-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch import and users UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('cafasso-wix-import/importar-usuarios.html')
          s=p.read_text()
          s=s.replace("let admin={users:[],groups:[]},rows=[];","let admin={users:[],groups:[]},rows=[],credentials=[];",1)
          s=s.replace('<div class="actions"><button class="btn green" id="import" disabled>Importar a CAFASSO</button></div></section>','<div class="actions"><button class="btn green" id="import" disabled>Importar a CAFASSO</button><button class="btn alt" id="credentials" disabled>Descargar accesos nuevos</button></div></section>',1)
          old="""async function importRows(){const valid=rows.filter(r=>!r.errors.length);if(!valid.length)return;$('import').disabled=true;$('clear').disabled=true;let done=0,failed=0;$('bar').style.width='0%';for(const row of valid){try{const groupId=await ensureGroup(row.groupName);const existing=admin.users.find(u=>normEmail(u.email)===row.email);await api('saveUser',{user:{_id:existing?._id, name:row.name,email:row.email,groupId,role:row.role,status:row.status}});row.existing=admin.users.find(u=>normEmail(u.email)===row.email);}catch(e){row.errors.push(e.message||'Error al importar');failed++;}done++;const pct=Math.round(done/valid.length*100);$('bar').style.width=pct+'%';$('progressText').textContent=`${done} de ${valid.length}`;render()}setStatus(failed?`Importación terminada con ${failed} error(es).`:`Importación completa: ${done} animadores procesados.` ,failed?'err':'ok');$('clear').disabled=false;await loadAdmin();rows=rows.map(r=>({...r,existing:admin.users.find(u=>normEmail(u.email)===r.email)}));render()}"""
          new="""async function importRows(){const valid=rows.filter(r=>!r.errors.length);if(!valid.length)return;$('import').disabled=true;$('clear').disabled=true;credentials=[];$('credentials').disabled=true;let done=0,failed=0;$('bar').style.width='0%';for(const row of valid){try{const groupId=await ensureGroup(row.groupName);const existing=admin.users.find(u=>normEmail(u.email)===row.email);const result=await api('saveUser',{user:{_id:existing?._id,name:row.name,email:row.email,groupId,role:row.role,status:row.status}});if(!existing&&result.temporaryPassword)credentials.push({name:row.name,email:row.email,password:result.temporaryPassword});row.existing=admin.users.find(u=>normEmail(u.email)===row.email);}catch(e){row.errors.push(e.message||'Error al importar');failed++;}done++;const pct=Math.round(done/valid.length*100);$('bar').style.width=pct+'%';$('progressText').textContent=`${done} de ${valid.length}`;render()}setStatus(failed?`Importación terminada con ${failed} error(es).`:`Importación completa: ${done} animadores procesados.${credentials.length?' Se generaron '+credentials.length+' contraseñas temporales.':''}`,failed?'err':'ok');$('clear').disabled=false;$('credentials').disabled=!credentials.length;await loadAdmin();rows=rows.map(r=>({...r,existing:admin.users.find(u=>normEmail(u.email)===r.email)}));render()}function exportCredentials(){if(!credentials.length)return;const data=[['Nombre','Correo','Contraseña temporal'],...credentials.map(x=>[x.name,x.email,x.password])];const csv='\\ufeff'+data.map(r=>r.map(v=>`\"${String(v??'').replace(/\"/g,'\"\"')}\"`).join(';')).join('\\r\\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CAFASSO_Accesos_Temporales.csv';a.click();URL.revokeObjectURL(a.href)}"""
          if old not in s:
              raise SystemExit('importRows pattern not found')
          s=s.replace(old,new,1)
          s=s.replace("$('clear').onclick=()=>{rows=[];$('file').value='';$('bar').style.width='0';$('progressText').textContent='0 de 0';setStatus('Esperando una planilla…');render()};$('import').onclick=importRows;","$('clear').onclick=()=>{rows=[];credentials=[];$('credentials').disabled=true;$('file').value='';$('bar').style.width='0';$('progressText').textContent='0 de 0';setStatus('Esperando una planilla…');render()};$('import').onclick=importRows;$('credentials').onclick=exportCredentials;",1)
          p.write_text(s)

          p=Path('cafasso-wix-import/animadores.html')
          s=p.read_text()
          old="""state=await post({action:'saveUser',user:{_id:editing?editing._id:undefined,name,email,groupId:$('mGroup').value,role:$('mRole').value,status:$('mStatus').value}});closeModal();fillFilters();renderKpis();render();setStatus('Guardado en Wix CMS',true)"""
          new="""const result=await post({action:'saveUser',user:{_id:editing?editing._id:undefined,name,email,groupId:$('mGroup').value,role:$('mRole').value,status:$('mStatus').value}});state=result;closeModal();fillFilters();renderKpis();render();setStatus('Guardado en Wix CMS',true);if(result.temporaryPassword)alert(`Usuario creado.\\n\\nContraseña temporal: ${result.temporaryPassword}\\n\\nCopiala ahora. La persona deberá cambiarla al ingresar.`)"""
          if old not in s:
              raise SystemExit('saveModal pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/importar-usuarios.html cafasso-wix-import/animadores.html
          git diff --cached --quiet || git commit -m "Automate temporary passwords for new CAFASSO users"
          git push