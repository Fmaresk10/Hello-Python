name: CAFASSO Recursos cache bust

on:
  push:
    branches: ["main"]
    paths:
      - "cafasso-wix-import/wix-resources-cms.js"
      - "cafasso-wix-import/data/resources.json"
      - ".github/workflows/cafasso-resources-cache-bust.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cambiar versión del lector de Recursos
        env:
          CACHE_VERSION: "${{ github.run_number }}-${{ github.run_attempt }}"
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('cafasso-wix-import/index.html')
          text = path.read_text(encoding='utf-8')
          version = os.environ['CACHE_VERSION']
          updated = re.sub(r'wix-resources-cms\.js\?v=[^"\']+', f'wix-resources-cms.js?v={version}', text)
          if updated == text:
              raise SystemExit('No encontré la referencia a wix-resources-cms.js')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Publicar cambio de versión
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/index.html
          git commit -m "Actualizar versión del lector de Biblioteca"
          git push
