name: CAFASSO mobile animator patch simple
on:
  push:
    paths:
      - '.github/workflows/mobile-animator-patch-simple.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_mobile_animator.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/index.html
          git diff --cached --quiet || git commit -m "Build mobile-first animator experience"
          git push
