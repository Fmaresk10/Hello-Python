name: Clean legacy CAFASSO groups UI
on:
  push:
    paths:
      - '.github/workflows/cleanup-admin-groups.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove legacy groups code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('cafasso-wix-import/admin.html')
          s=p.read_text(encoding='utf-8')

          # Remove the obsolete inline groups panel. grupos.html is now canonical.
          s,n=re.subn(r'<section id="grupos" class="panel">.*?</section>', '', s, count=1, flags=re.S)
          assert n==1, 'Legacy groups section not found'

          # Stop rendering the removed groups panel.
          s=s.replace(';renderGroups();renderCourses()', ';renderCourses()')

          # Remove obsolete groups renderer.
          s,n=re.subn(r'function renderGroups\(\)\{.*?\}function renderCourses\(\)', 'function renderCourses()', s, count=1, flags=re.S)
          assert n==1, 'renderGroups function not found'

          # Remove obsolete group modal branch, but keep group data available for animador filters/forms.
          s,n=re.subn(r"if\(mode==='group'\)\{.*?\}if\(mode==='assignment'\)", "if(mode==='assignment')", s, count=1, flags=re.S)
          if n==0:
              # Assignments branch was already removed in prior cleanup; remove group branch up to modalFields.
              s,n=re.subn(r"if\(mode==='group'\)\{.*?\}\$\('modalFields'\)", "$('modalFields')", s, count=1, flags=re.S)
          assert n==1, 'Group modal branch not found'

          # Remove obsolete save branch.
          s=s.replace(";if(modalMode==='group')body={action:'saveGroup',group:{_id:editing._id,name:$('mName').value,description:$('mDesc').value,active:$('mActive').value==='true'}}", '')

          # Remove edit-group click handler.
          s,n=re.subn(r";const g=e\.target\.closest\('\[data-edit-group\]'\);if\(g\)return openModal\('group',state\.groups\.find\(x=>x\._id===g\.dataset\.editGroup\)\|\|\{\}\)", '', s, count=1)
          assert n==1, 'Group click handler not found'

          # Remove obsolete add button binding.
          s=s.replace(";$('addGroup').onclick=()=>openModal('group',{})", '')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/admin.html
          git commit -m "Remove legacy groups UI from admin"
          git push
