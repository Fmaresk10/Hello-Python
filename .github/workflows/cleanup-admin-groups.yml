name: Finalize CAFASSO admin cleanup
on:
  push:
    paths:
      - '.github/workflows/cleanup-admin-groups.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Final cleanup and hash navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cafasso-wix-import/admin.html')
          s=p.read_text(encoding='utf-8')

          # Remove stale initial-only arrays from the old inline screens.
          old="let state={users:[],groups:[],courses:[],assignments:[],progress:[],submissions:[],summary:{}};"
          new="let state={users:[],groups:[],courses:[],summary:{}};"
          assert old in s, 'Old state initializer not found'
          s=s.replace(old,new,1)

          # Make tab navigation reusable and keep the URL hash in sync.
          old_handler="const tab=e.target.closest('[data-tab]');if(tab){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab.dataset.tab));window.scrollTo(0,0);return}"
          new_handler="const tab=e.target.closest('[data-tab]');if(tab){activateTab(tab.dataset.tab,true);return}"
          assert old_handler in s, 'Old tab click handler not found'
          s=s.replace(old_handler,new_handler,1)

          marker="document.addEventListener('click',async e=>{"
          helper="function activateTab(id,updateHash=false){const allowed=['resumen','usuarios','cursos'];const target=allowed.includes(id)?id:'resumen';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===target));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===target));if(updateHash)history.replaceState(null,'','#'+target);window.scrollTo(0,0)}"
          assert marker in s, 'Click listener marker not found'
          s=s.replace(marker,helper+marker,1)

          # Honor links such as admin.html#cursos when returning from the course editor.
          old_end=";$('importBtn').onclick=()=>location.href='./importar-usuarios.html';load();</script>"
          new_end=";$('importBtn').onclick=()=>location.href='./importar-usuarios.html';activateTab(location.hash.replace('#','')||'resumen');window.addEventListener('hashchange',()=>activateTab(location.hash.replace('#','')||'resumen'));load();</script>"
          assert old_end in s, 'Admin startup marker not found'
          s=s.replace(old_end,new_end,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/admin.html
          git commit -m "Finalize CAFASSO admin cleanup and tab navigation"
          git push
