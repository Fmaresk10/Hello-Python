name: CAFASSO profile password logout v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-password-logout-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch-cafasso-profile.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add self-service password change and secure logout"
          git push
