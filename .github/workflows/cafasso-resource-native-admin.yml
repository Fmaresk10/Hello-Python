name: CAFASSO Resource Native Admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cafasso-resource-native-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build native CAFASSO resource manager
        run: |
          python <<'PY'
          from pathlib import Path

          RESOURCE_TITLE = 'CAFASSO · Recursos internos'

          # 1) Native CAFASSO admin view for resources.
          resource_admin = Path('cafasso-wix-import/resource-admin.html')
          resource_admin.write_text(r'''<!doctype html>
<html lang="es">
<head>
<script src="./auth-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFASSO · Recursos</title>
<style>
:root{--navy:#0F2D4D;--cream:#F6EFE4;--gold:#F2C94C;--green:#2E7D59;--red:#A64747;--muted:#687386;--card:#FFFDF9;--line:#E8DCCB;--ink:#11233A}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{background:linear-gradient(180deg,var(--navy),#0A2440);color:#fff;padding:26px 20px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:12px;align-items:center}.brand img{width:42px;height:50px;object-fit:contain}.brand b{font-family:Georgia,serif;font-size:25px}.brand small{display:block;opacity:.72;margin-top:4px}.menu{margin-top:32px;display:grid;gap:8px}.menu a{display:block;color:#fff;text-decoration:none;padding:12px 13px;border-radius:13px;font-weight:700}.menu a:hover,.menu a.active{background:rgba(255,255,255,.11)}.side-foot{position:absolute;bottom:24px;left:20px;right:20px}.back{display:block;color:#fff;text-decoration:none;border-top:1px solid rgba(255,255,255,.18);padding-top:16px;font-weight:700}.motto{font-family:Georgia,serif;font-style:italic;color:#F7D276;margin-bottom:16px}main{padding:34px 36px 50px;max-width:1450px;width:100%;margin:auto;min-width:0}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#B77D00}.head h1{font-family:Georgia,serif;color:var(--navy);font-size:38px;margin:8px 0 5px}.head p{margin:0;color:var(--muted);line-height:1.5}.status{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.status.ok{color:var(--green)}.status.bad{color:var(--red)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.btn{border:0;background:var(--gold);color:var(--navy);font-weight:800;border-radius:12px;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-block}.btn.alt{background:#fff;border:1px solid var(--line)}.btn.red{background:#fff2f2;color:var(--red);border:1px solid #e9c1c1}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 9px 24px rgba(25,37,54,.05)}.metric{padding:17px}.metric small{display:block;color:var(--muted);font-weight:700}.metric strong{display:block;margin-top:4px;font:30px Georgia,serif;color:var(--navy)}.box{padding:20px}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.modal input,.modal select,.modal textarea{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}.filters input{flex:1;min-width:240px}.table{overflow:auto;border:1px solid var(--line);border-radius:17px;background:#fff}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:#FBF7F0}td strong{color:var(--navy)}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#EDF5F1;color:var(--green);font-size:10px;font-weight:800}.badge.gray{background:#F0F1F2;color:#687386}.badge.gold{background:#FFF4CC;color:#876700}.tiny{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none}.tiny.danger{color:var(--red);border-color:#ebc7c7;background:#fff8f8}.empty{padding:32px;text-align:center;color:var(--muted)}.note{margin-top:14px;padding:13px 15px;border-radius:14px;background:#FFF7D7;border:1px solid #F3DF91;color:#6C5500;font-size:12px;line-height:1.5}.modal-wrap{position:fixed;inset:0;background:rgba(10,25,45,.48);display:none;place-items:center;padding:18px;z-index:50}.modal-wrap.show{display:grid}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:22px;padding:24px;border:1px solid var(--line);box-shadow:0 22px 70px rgba(0,0,0,.22)}.modal h2{font:29px Georgia,serif;color:var(--navy);margin:0 0 18px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:92px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:grid;gap:9px;margin-top:12px}.check{display:flex;align-items:center;gap:9px;color:var(--navy);font-size:13px;font-weight:700}.check input{width:auto}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.busy{opacity:.55;pointer-events:none}
@media(max-width:900px){.shell{grid-template-columns:88px minmax(0,1fr)}.brand div,.menu span,.side-foot{display:none}.brand{justify-content:center}.menu a{text-align:center}.summary{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:700px){body{padding-bottom:18px}.shell{display:block}.side{height:auto;position:static;padding:11px 12px;display:flex;align-items:center;gap:8px}.brand img{width:34px;height:40px}.menu{margin:0;display:flex;overflow:auto;gap:4px}.menu a{white-space:nowrap;padding:10px}.brand div{display:none}main{padding:20px 14px 36px}.head{flex-direction:column}.head h1{font-size:31px}.summary{grid-template-columns:1fr 1fr 1fr;gap:8px}.metric{padding:13px}.metric strong{font-size:24px}.filters{display:grid;grid-template-columns:1fr}.filters input{min-width:0;width:100%}.table{overflow:visible;border:0;background:transparent}table{min-width:0;display:block}thead{display:none}tbody{display:grid;gap:10px}tr{display:block;background:#fff;border:1px solid var(--line);border-radius:17px;padding:8px 13px}td{display:grid;grid-template-columns:105px minmax(0,1fr);gap:9px;padding:9px 0;border-bottom:1px solid #EEE6DB}td:before{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}td:nth-child(1):before{content:'Recurso'}td:nth-child(2):before{content:'Categoría'}td:nth-child(3):before{content:'Tipo'}td:nth-child(4):before{content:'Biblioteca'}td:nth-child(5):before{content:'Cursos'}td:nth-child(6):before{content:'Acciones'}td:last-child{border-bottom:0}.two{grid-template-columns:1fr}.modal-wrap{align-items:end;padding:10px}.modal{border-radius:24px 24px 16px 16px;padding:20px}.modal-actions{display:grid;grid-template-columns:1fr}.modal-actions .btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><a href="./admin.html" title="Administración"><img src="./cafasso-mark.svg" alt="CAFASSO"></a><div><b>CAFASSO</b><small>Administración</small></div></div>
    <nav class="menu"><a href="./admin.html"><span>⌂ &nbsp; Inicio</span></a><a href="./animadores.html"><span>👥 &nbsp; Animadores</span></a><a href="./admin.html#cursos"><span>📚 &nbsp; Cursos</span></a><a class="active" href="./resource-admin.html"><span>🗂 &nbsp; Recursos</span></a><a href="./entregas.html"><span>📥 &nbsp; Entregas</span></a></nav>
    <div class="side-foot"><div class="motto">Caminamos juntos,<br>animamos con el corazón.</div><a class="back" href="./admin.html">← Volver a Administración</a></div>
  </aside>
  <main id="main">
    <header class="head"><div><div class="eyebrow">Administración CAFASSO</div><h1>Recursos</h1><p>Gestioná la biblioteca desde CAFASSO. Wix queda detrás como almacenamiento, sin salir de este espacio.</p></div><div class="status" id="status">Conectando…</div></header>
    <div class="toolbar"><button class="btn" id="newResource">＋ Nuevo recurso</button><a class="btn alt" href="./?space=recursos">Ver biblioteca</a><button class="btn alt" id="reload">Recargar</button></div>
    <section class="summary"><article class="card metric"><small>Recursos</small><strong id="mTotal">0</strong></article><article class="card metric"><small>En biblioteca</small><strong id="mLibrary">0</strong></article><article class="card metric"><small>Para cursos</small><strong id="mCourses">0</strong></article></section>
    <section class="card box">
      <div class="filters"><input id="search" placeholder="Buscar recurso"><select id="category"><option value="">Todas las categorías</option></select></div>
      <div class="table"><table><thead><tr><th>Recurso</th><th>Categoría</th><th>Tipo</th><th>Biblioteca</th><th>Cursos</th><th>Acciones</th></tr></thead><tbody id="body"></tbody></table></div>
      <div class="note">Los recursos se guardan en el mismo ecosistema de contenidos de CAFASSO. Más adelante podremos reutilizarlos directamente dentro de los cursos sin duplicar archivos ni enlaces.</div>
    </section>
  </main>
</div>
<div class="modal-wrap" id="modalWrap"><section class="modal"><h2 id="modalTitle">Nuevo recurso</h2><form id="resourceForm">
  <input type="hidden" id="resourceId">
  <div class="field"><label>Título</label><input id="title" required placeholder="Ej.: Sistema Preventivo · presentación"></div>
  <div class="two"><div class="field"><label>Categoría</label><input id="resourceCategory" placeholder="Formación, oración, dinámica…"></div><div class="field"><label>Tipo</label><select id="type"><option>Presentación</option><option>PDF</option><option>Documento</option><option>Video</option><option>Imagen</option><option>Link</option><option>Dinámica</option><option>Oración</option></select></div></div>
  <div class="field"><label>Archivo o enlace</label><input id="url" type="url" placeholder="https://…"><small style="display:block;color:var(--muted);margin-top:6px">Puede ser un enlace de Drive, Canva, YouTube, Wix Media u otra fuente.</small></div>
  <div class="field"><label>Descripción</label><textarea id="description" placeholder="Breve descripción del material"></textarea></div>
  <div class="field"><label>Cursos donde se usa (opcional)</label><input id="courses" placeholder="Separados por coma"></div>
  <div class="checks"><label class="check"><input type="checkbox" id="showLibrary" checked> Mostrar como libro en la Biblioteca</label><label class="check"><input type="checkbox" id="availableCourses" checked> Disponible para usar en cursos</label></div>
  <div class="modal-actions"><button type="button" class="btn alt" id="cancel">Cancelar</button><button type="submit" class="btn">Guardar recurso</button></div>
</form></section></div>
<script>
const API='https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';
const RESOURCE_TITLE='CAFASSO · Recursos internos';
const $=id=>document.getElementById(id);
let catalog=null,editingId='',busy=false;
function uid(){return 'local-'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function emptyCatalog(){return{title:RESOURCE_TITLE,slug:'cafasso-recursos-internos',description:'Catálogo central de recursos de CAFASSO',subtitle:'Uso interno',status:'Oculto',version:1,certificateEnabled:false,modules:[{_id:uid(),title:'Biblioteca',desc:'',status:'Publicado',required:false,unlockAfterPrevious:false,estimatedMinutes:0,settings:{resourceCatalog:true},contents:[]}]}}
function normalizeCourse(c){const base=emptyCatalog();if(!c)return base;return{_id:c._id,title:c.title||RESOURCE_TITLE,slug:c.slug||base.slug,description:c.description||base.description,subtitle:c.subtitle||base.subtitle,status:'Oculto',version:Number(c.version||1),certificateEnabled:false,modules:(c.modules&&c.modules.length?c.modules:base.modules).map(m=>({_id:m._id||uid(),title:m.title||'Biblioteca',desc:m.desc||m.description||'',status:m.status||'Publicado',required:false,unlockAfterPrevious:false,estimatedMinutes:Number(m.estimatedMinutes||0),settings:m.settings||{},contents:(m.contents||[]).map(b=>({_id:b._id||uid(),type:b.type||'Documento',title:b.title||'Recurso',required:false,content:b.content||{body:b.body||''},settings:b.settings||{}}))}))}}
function blocks(){return catalog?.modules?.[0]?.contents||[]}
function resources(){return blocks().filter(b=>b?.settings?.cafassoResource===true).map(b=>({id:b._id,titulo:b.title,categoria:b.settings.categoria||'',tipo:b.settings.resourceType||b.type||'Documento',url:b.content?.body||'',descripcion:b.settings.descripcion||'',mostrarEnBiblioteca:b.settings.mostrarEnBiblioteca===true,disponibleParaCursos:b.settings.disponibleParaCursos===true,cursos:Array.isArray(b.settings.cursos)?b.settings.cursos:[]}))}
function courseType(t){if(t==='Video')return'Video';if(t==='Imagen')return'Imagen';return'Documento'}
function setStatus(text,kind=''){const s=$('status');s.textContent=text;s.className='status'+(kind?' '+kind:'')}
function setBusy(v){busy=v;$('main').classList.toggle('busy',v)}
async function load(){setBusy(true);setStatus('Conectando…');try{const r=await fetch(`${API}?title=${encodeURIComponent(RESOURCE_TITLE)}`,{cache:'no-store'});let j={};try{j=await r.json()}catch(e){}if(r.ok&&j.ok&&j.course){catalog=normalizeCourse(j.course);setStatus('Conectado', 'ok')}else{catalog=emptyCatalog();setStatus('Biblioteca lista', 'ok')}render()}catch(e){console.error(e);catalog=emptyCatalog();setStatus('Sin conexión', 'bad');render()}finally{setBusy(false)}}
async function save(){setBusy(true);setStatus('Guardando…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:catalog})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'No se pudo guardar');catalog=normalizeCourse(j.course);render();setStatus('Guardado en CAFASSO', 'ok');return true}catch(e){console.error(e);alert(e.message||'No se pudo guardar');setStatus('Error al guardar','bad');return false}finally{setBusy(false)}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const list=resources(),q=$('search').value.trim().toLowerCase(),cat=$('category').value;const cats=[...new Set(list.map(r=>r.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));const oldCat=$('category').value;$('category').innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('category').value=cats.includes(oldCat)?oldCat:'';const filtered=list.filter(r=>(!q||[r.titulo,r.categoria,r.tipo,r.descripcion].join(' ').toLowerCase().includes(q))&&(!cat||r.categoria===cat));$('mTotal').textContent=list.length;$('mLibrary').textContent=list.filter(r=>r.mostrarEnBiblioteca).length;$('mCourses').textContent=list.filter(r=>r.disponibleParaCursos).length;$('body').innerHTML=filtered.length?filtered.map(r=>`<tr><td><strong>${esc(r.titulo)}</strong>${r.url?`<div style="margin-top:4px"><a class="tiny" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir</a></div>`:''}</td><td>${esc(r.categoria||'—')}</td><td>${esc(r.tipo)}</td><td>${r.mostrarEnBiblioteca?'<span class="badge">Sí</span>':'<span class="badge gray">No</span>'}</td><td>${r.disponibleParaCursos?'<span class="badge gold">Disponible</span>':'<span class="badge gray">No</span>'}</td><td><button class="tiny" data-edit="${esc(r.id)}">Editar</button> <button class="tiny danger" data-delete="${esc(r.id)}">Eliminar</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Todavía no hay recursos.</td></tr>'}
function openForm(id=''){editingId=id;const r=resources().find(x=>x.id===id);$('modalTitle').textContent=r?'Editar recurso':'Nuevo recurso';$('resourceId').value=id;$('title').value=r?.titulo||'';$('resourceCategory').value=r?.categoria||'';$('type').value=r?.tipo||'Presentación';$('url').value=r?.url||'';$('description').value=r?.descripcion||'';$('courses').value=(r?.cursos||[]).join(', ');$('showLibrary').checked=r?r.mostrarEnBiblioteca:true;$('availableCourses').checked=r?r.disponibleParaCursos:true;$('modalWrap').classList.add('show');setTimeout(()=>$('title').focus(),30)}
function closeForm(){$('modalWrap').classList.remove('show');editingId=''}
$('resourceForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const title=$('title').value.trim();if(!title)return;const blockList=blocks();let block=editingId?blockList.find(x=>x._id===editingId):null;if(!block){block={_id:uid(),type:'Documento',title:'',required:false,content:{body:''},settings:{cafassoResource:true}};blockList.push(block)}block.title=title;block.type=courseType($('type').value);block.required=false;block.content={body:$('url').value.trim()};block.settings={...(block.settings||{}),cafassoResource:true,categoria:$('resourceCategory').value.trim(),resourceType:$('type').value,descripcion:$('description').value.trim(),mostrarEnBiblioteca:$('showLibrary').checked,disponibleParaCursos:$('availableCourses').checked,cursos:$('courses').value.split(',').map(x=>x.trim()).filter(Boolean)};const ok=await save();if(ok)closeForm()};
document.addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]');if(edit){openForm(edit.dataset.edit);return}const del=e.target.closest('[data-delete]');if(del){const r=resources().find(x=>x.id===del.dataset.delete);if(!r||!confirm(`¿Eliminar “${r.titulo}”?`))return;const arr=blocks();const i=arr.findIndex(x=>x._id===r.id);if(i>=0)arr.splice(i,1);await save();return}});
$('newResource').onclick=()=>openForm();$('cancel').onclick=closeForm;$('reload').onclick=load;$('search').oninput=render;$('category').onchange=render;$('modalWrap').onclick=e=>{if(e.target===$('modalWrap'))closeForm()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeForm()});
load();
</script>
</body>
</html>
''', encoding='utf-8')

          # 2) Administrator menu now stays inside CAFASSO.
          dashboard = Path('cafasso-wix-import/admin-dashboard.js')
          d = dashboard.read_text(encoding='utf-8')
          wix_url = 'https://manage.wix.com/dashboard/c6a6ef36-f36a-453a-b787-5762b698f820/wix-cms/data/cafasso-recursos'
          d = d.replace(f"link.href='{wix_url}';\n      link.target='_blank';\n      link.rel='noopener noreferrer';", "link.href='./resource-admin.html';")
          dashboard.write_text(d, encoding='utf-8')

          # 3) Hide the internal resource catalog from the normal courses list.
          admin = Path('cafasso-wix-import/admin.html')
          a = admin.read_text(encoding='utf-8')
          a = a.replace("function renderCourses(){const all=state.courses||[];", "function renderCourses(){const all=(state.courses||[]).filter(c=>c.title!=='CAFASSO · Recursos internos');", 1)
          admin.write_text(a, encoding='utf-8')

          # 4) Library reads the same internal resource catalog through the existing CAFASSO course backend.
          js = Path('cafasso-wix-import/animator-foundation-v1.js')
          s = js.read_text(encoding='utf-8')
          old_constants = """  const WIX_RESOURCE_COLLECTION_ID = 'cafasso-recursos';
  const WIX_OAUTH_CLIENT_ID = 'c4378c2e-b8fa-4e76-b0e1-7fbd7336de44';
  const WIX_TOKEN_URL = 'https://www.wixapis.com/oauth2/token';
  const WIX_DATA_QUERY_URL = 'https://www.wixapis.com/data/v2/items/query';
  const WIX_TOKEN_CACHE_KEY = 'cafasso-wix-visitor-token-v1';
"""
          new_constants = """  const RESOURCE_API = 'https://federicomaresca.wixstudio.com/my-site-1/_functions/cafassoCourse';
  const RESOURCE_COURSE_TITLE = 'CAFASSO · Recursos internos';
"""
          if old_constants in s:
              s = s.replace(old_constants, new_constants, 1)
          else:
              raise SystemExit('No se encontraron las constantes Wix de recursos')

          start = s.index('  async function getWixVisitorToken() {')
          end = s.index('\n\n  loadResourceLibrary();', start)
          replacement = r'''  async function loadResourceLibrary() {
    if (space !== 'recursos') return;
    try {
      const response = await fetch(`${RESOURCE_API}?title=${encodeURIComponent(RESOURCE_COURSE_TITLE)}`, { cache: 'no-store' });
      if (!response.ok) {
        renderResourceLibrary([]);
        return;
      }
      const payload = await response.json();
      if (!payload?.ok || !payload?.course) {
        renderResourceLibrary([]);
        return;
      }
      const contents = Array.isArray(payload.course?.modules)
        ? payload.course.modules.flatMap((module) => Array.isArray(module?.contents) ? module.contents : [])
        : [];
      const resources = contents
        .filter((block) => block?.settings?.cafassoResource === true)
        .map((block) => ({
          id: block._id,
          titulo: block.title || 'Recurso',
          categoria: block.settings?.categoria || '',
          tipo: block.settings?.resourceType || block.type || 'Documento',
          url: block.content?.body || '',
          descripcion: block.settings?.descripcion || '',
          mostrarEnBiblioteca: block.settings?.mostrarEnBiblioteca === true,
          disponibleParaCursos: block.settings?.disponibleParaCursos === true,
          cursos: Array.isArray(block.settings?.cursos) ? block.settings.cursos : []
        }));
      renderResourceLibrary(resources);
    } catch (error) {
      console.warn('CAFASSO: no se pudo cargar la biblioteca de recursos.', error);
      renderResourceLibrary([]);
    }
  }'''
          s = s[:start] + replacement + s[end:]
          js.write_text(s, encoding='utf-8')

          # 5) Cache busting.
          index = Path('cafasso-wix-import/index.html')
          i = index.read_text(encoding='utf-8')
          import re
          i = re.sub(r'animator-foundation-v1\.js\?v=[0-9-]+', 'animator-foundation-v1.js?v=20260914-27', i, count=1)
          index.write_text(i, encoding='utf-8')
          PY

      - name: Commit native resource admin
        run: |
          git config user.name "CAFASSO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cafasso-wix-import/resource-admin.html cafasso-wix-import/admin-dashboard.js cafasso-wix-import/admin.html cafasso-wix-import/animator-foundation-v1.js cafasso-wix-import/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
