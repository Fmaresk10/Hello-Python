name: CAFASSO Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Forzar Home nuevo del animador
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('cafasso-wix-import/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="cafasso-home-v2-direct">'
          if marker not in s:
              inject = '''<script id="cafasso-home-v2-direct">if(new URLSearchParams(location.search).get('previewRole')==='animador'||new URLSearchParams(location.search).get('previewUser'))document.documentElement.dataset.cafassoPreviewRole='animador';</script>\n<script src="./course-cover-home.js?v=20260907-4"></script>\n<script src="./animator-home.js?v=20260907-5"></script>\n<script src="./animator-home-tweaks.js?v=20260907-3"></script>\n<script src="./animator-home-refine.js?v=20260907-2"></script>\n'''
              s = s.replace('</body>', inject + '</body>')
          profile_script = '<script src="./animator-profile-chip.js?v=20260907-2"></script>'
          import re
          s = re.sub(r'<script src="\./animator-profile-chip\.js\?v=[^"]+"></script>\s*', '', s)
          s = s.replace('</body>', profile_script + '\n</body>')
          p.write_text(s, encoding='utf-8')

          editor = Path('cafasso-wix-import/curso-editor.html')
          es = editor.read_text(encoding='utf-8')
          for old in ['course-cover-editor.js?v=20260907-1','course-cover-editor.js?v=20260907-2']:
              if old in es:
                  es = es.replace(old,'course-cover-editor.js?v=20260907-3')
          if 'course-cover-editor.js?v=20260907-3' not in es:
              es = es.replace('</body>', '<script src="./course-cover-editor.js?v=20260907-3"></script>\n</body>')
          es = re.sub(r'<script src="\./course-editor-nav\.js\?v=[^"]+"></script>\s*', '', es)
          es = es.replace('</body>', '<script src="./course-editor-nav.js?v=20260907-3"></script>\n</body>')
          editor.write_text(es, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./cafasso-wix-import
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
