name: CAFASSO Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Forzar versión fresca de Recursos
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('cafasso-wix-import/index.html')
          text = path.read_text(encoding='utf-8')
          version = os.environ['GITHUB_SHA'][:12]
          updated = re.sub(r'wix-resources-cms\.js\?v=[^"\']+', f'wix-resources-cms.js?v={version}', text)
          if updated == text:
              raise SystemExit('No encontré la referencia a wix-resources-cms.js')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./cafasso-wix-import
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
