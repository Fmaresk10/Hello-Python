name: CAFASSO Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Forzar versiones frescas de CAFASSO
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          path = Path('cafasso-wix-import/index.html')
          text = path.read_text(encoding='utf-8')
          version = os.environ['GITHUB_SHA'][:12]

          updated = re.sub(
              r'wix-resources-cms\.js\?v=[^"\']+',
              f'wix-resources-cms.js?v={version}',
              text
          )
          if updated == text:
              raise SystemExit('No encontré la referencia a wix-resources-cms.js')

          updated_loader = re.sub(
              r'cafasso-book-size-rule\.js\?v=[^"\']+',
              f'cafasso-book-size-rule.js?v={version}',
              updated
          )
          if updated_loader == updated:
              raise SystemExit('No encontré la referencia a cafasso-book-size-rule.js')
          updated = updated_loader

          ruah_tag = f'<script src="./cafasso-ruah-fix.js?v={version}"></script>'
          if 'cafasso-ruah-fix.js' in updated:
              updated = re.sub(
                  r'<script src="\./cafasso-ruah-fix\.js\?v=[^"]+"></script>',
                  ruah_tag,
                  updated
              )
          else:
              marker = '<script src="./cafasso-global-counters.js?v=1"></script>'
              if marker not in updated:
                  raise SystemExit('No encontré el contador global para insertar RUAH fix')
              updated = updated.replace(marker, marker + ruah_tag, 1)

          path.write_text(updated, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./cafasso-wix-import
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
