name: CAFASSO Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Forzar versiones frescas de CAFASSO
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          world_path = Path('cafasso-wix-import/world.html')
          legacy_path = Path('cafasso-wix-import/index.html')
          path = world_path if world_path.exists() else legacy_path
          text = path.read_text(encoding='utf-8')
          version = os.environ['GITHUB_SHA'][:12]

          updated = re.sub(
              r'wix-resources-cms\.js\?v=[^"\']+',
              f'wix-resources-cms.js?v={version}',
              text
          )
          if updated == text:
              raise SystemExit('No encontré la referencia a wix-resources-cms.js')

          updated_loader = re.sub(
              r'cafasso-book-size-rule\.js\?v=[^"\']+',
              f'cafasso-book-size-rule.js?v={version}',
              updated
          )
          if updated_loader == updated:
              raise SystemExit('No encontré la referencia a cafasso-book-size-rule.js')
          updated = updated_loader

          updated_counter = re.sub(
              r'cafasso-global-counters\.js\?v=[^"\']+',
              f'cafasso-global-counters.js?v={version}',
              updated
          )
          if updated_counter == updated:
              raise SystemExit('No encontré la referencia a cafasso-global-counters.js')
          updated = updated_counter

          ruah_tag = f'<script src="./cafasso-ruah-fix.js?v={version}"></script>'
          if 'cafasso-ruah-fix.js' in updated:
              updated = re.sub(
                  r'<script src="\./cafasso-ruah-fix\.js\?v=[^"]+"></script>',
                  ruah_tag,
                  updated
              )
          else:
              marker = f'<script src="./cafasso-global-counters.js?v={version}"></script>'
              if marker not in updated:
                  raise SystemExit('No encontré el contador global para insertar RUAH fix')
              updated = updated.replace(marker, marker + ruah_tag, 1)

          path.write_text(updated, encoding='utf-8')

          admin_path = Path('cafasso-wix-import/admin.html')
          admin_text = admin_path.read_text(encoding='utf-8')
          gift_tag = f'<script src="./cafasso-admin-almitas-gifts-v2.js?v={version}"></script>'
          fix_tag = f'<script src="./cafasso-admin-almitas-mount-fix.js?v={version}"></script>'
          admin_text = re.sub(
              r'<script src="\./cafasso-admin-almitas-gifts(?:-v2)?\.js\?v=[^"]+"></script>',
              '',
              admin_text
          )
          admin_text = re.sub(
              r'<script src="\./cafasso-admin-almitas-mount-fix\.js\?v=[^"]+"></script>',
              '',
              admin_text
          )
          if '</body>' not in admin_text:
              raise SystemExit('No encontré </body> en admin.html para insertar regalos de Almitas')
          admin_text = admin_text.replace('</body>', gift_tag + fix_tag + '</body>', 1)
          admin_path.write_text(admin_text, encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./cafasso-wix-import
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
