name: Integrate CAFASSO animator management
on:
  push:
    paths:
      - '.github/workflows/cleanup-admin-users.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move animator management to dedicated center
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('cafasso-wix-import/admin.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<button data-tab="usuarios"><span>👥 &nbsp; Animadores</span></button>', '<button onclick="location.href=\'./animadores.html\'"><span>👥 &nbsp; Animadores</span></button>')
          s=re.sub(r'<section id="usuarios" class="panel">.*?</section>', '', s, count=1, flags=re.S)
          s=s.replace(';renderFilters();renderUsers();renderCourses()', ';renderCourses()')
          s=re.sub(r'function renderFilters\(\)\{.*?\}function renderUsers\(\)\{.*?\}function renderCourses\(\)', 'function renderCourses()', s, count=1, flags=re.S)
          s=re.sub(r'function openModal\(mode,item=\{\}\)\{.*?\}function closeModal\(\)', 'function closeModal()', s, count=1, flags=re.S)
          s=re.sub(r'async function saveModal\(\)\{.*?\}async function mutate\(body\)', 'async function mutate(body)', s, count=1, flags=re.S)
          s=s.replace("const allowed=['resumen','usuarios','cursos'];", "const allowed=['resumen','cursos'];")
          s=re.sub(r"const u=e\.target\.closest\('\[data-edit-user\]'\);if\(u\).*?;const dup=", 'const dup=', s, count=1, flags=re.S)

          for old in [
            "$('addUser').onclick=()=>openModal('user',{});",
            "$('cancelModal').onclick=closeModal;",
            "$('saveModal').onclick=saveModal;",
            "$('modalWrap').onclick=e=>{if(e.target===$('modalWrap'))closeModal()};",
            "$('userSearch').oninput=renderUsers;",
            "$('groupFilter').onchange=renderUsers;",
            "$('statusFilter').onchange=renderUsers;",
            "$('importBtn').onclick=()=>location.href='./importar-usuarios.html';"
          ]:
            s=s.replace(old,'')

          s=re.sub(r'</main></div><div class="modal-wrap" id="modalWrap">.*?</div></div></div><script>', '</main></div><script>', s, count=1, flags=re.S)

          assert './animadores.html' in s, 'Animator center link was not added'
          assert '<section id="usuarios"' not in s, 'Legacy users section still present'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Fmaresk10@users.noreply.github.com"
          git add cafasso-wix-import/admin.html
          git commit -m "Use dedicated animator management center"
          git push
