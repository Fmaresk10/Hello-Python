name: Add CAFASSO password management UI
on:
  push:
    paths:
      - '.github/workflows/add-password-management-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch animadores password UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cafasso-wix-import/animadores.html')
          s=p.read_text()
          old='<th>Último acceso</th><th>Acciones</th>'
          new='<th>Último acceso</th><th>Contraseña</th><th>Acciones</th>'
          if old in s:
              s=s.replace(old,new)
          old_row="<td>${fmtDate(u.lastAccess)}</td><td><a class=\"tiny\" href=\"./animador.html?id=${encodeURIComponent(u._id)}\">Ver perfil</a> <button class=\"tiny\" data-edit=\"${u._id}\">Editar</button></td>"
          new_row="<td>${fmtDate(u.lastAccess)}</td><td>${u.mustChangePassword?'<span class=\"badge gold\">Temporal</span>':u.hasPassword?'<span class=\"badge\">Configurada</span>':'<span class=\"badge gray\">Sin contraseña</span>'}</td><td><a class=\"tiny\" href=\"./animador.html?id=${encodeURIComponent(u._id)}\">Ver perfil</a> <button class=\"tiny\" data-edit=\"${u._id}\">Editar</button> <button class=\"tiny\" data-password=\"${u._id}\">Contraseña</button></td>"
          if old_row in s:
              s=s.replace(old_row,new_row)
          s=s.replace('colspan="8" class="empty"','colspan="9" class="empty"')
          marker="async function applyBulk(){"
          fn="""async function resetPassword(user){if(!user)return;if(!confirm(`Generar una nueva contraseña temporal para ${user.name}? Se cerrarán sus sesiones activas.`))return;busy(true);setStatus('Generando contraseña temporal…');try{const j=await post({action:'resetPassword',id:user._id});state=j;fillFilters();renderKpis();render();setStatus('Contraseña temporal generada',true);window.prompt(`Contraseña temporal de ${user.name}. Copiala y compartila de forma privada. Al ingresar deberá cambiarla:`,j.temporaryPassword||'');}catch(e){alert(e.message);setStatus('No se pudo restablecer la contraseña')}finally{busy(false)}}\n"""
          if marker in s and 'async function resetPassword(user)' not in s:
              s=s.replace(marker,fn+marker)
          old_click="const edit=e.target.closest('[data-edit]');if(edit)return openModal((state.users||[]).find(u=>u._id===edit.dataset.edit)||{});const cb=e.target.closest('[data-select]');"
          new_click="const edit=e.target.closest('[data-edit]');if(edit)return openModal((state.users||[]).find(u=>u._id===edit.dataset.edit)||{});const pwd=e.target.closest('[data-password]');if(pwd)return resetPassword((state.users||[]).find(u=>u._id===pwd.dataset.password));const cb=e.target.closest('[data-select]');"
          if old_click in s:
              s=s.replace(old_click,new_click)
          p.write_text(s)
          PY
      - name: Commit frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/animadores.html
          git commit -m "Add password management to animadores" || exit 0
          git push
