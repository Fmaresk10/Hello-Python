name: Install CAFASSO motion loader
on:
  push:
    paths:
      - '.github/workflows/install-cafasso-motion.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add global motion loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cafasso-wix-import/auth-guard.js')
          s=p.read_text(encoding='utf-8')
          if 'cafassoMotionLoader' in s:
              print('Loader already installed')
          else:
              marker="  function installReadOnly(){"
              insert="""  function installMotion(){\n    if(document.getElementById('cafassoMotionLoader'))return;\n    const s=document.createElement('script');\n    s.id='cafassoMotionLoader';\n    s.src='./cafasso-motion.js?v=20260904-1';\n    s.defer=true;\n    document.head.appendChild(s);\n  }\n\n"""
              if marker not in s:
                  raise SystemExit('auth-guard marker not found')
              s=s.replace(marker,insert+marker,1)
              ready="""  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',installReadOnly,{once:true});"""
              replacement="""  installMotion();\n\n  if(document.readyState==='loading'){\n    document.addEventListener('DOMContentLoaded',installReadOnly,{once:true});"""
              if ready not in s:
                  raise SystemExit('DOMContentLoaded marker not found')
              s=s.replace(ready,replacement,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "CAFASSO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cafasso-wix-import/auth-guard.js
          git diff --cached --quiet || git commit -m "Load lightweight motion system across CAFASSO"
          git push
