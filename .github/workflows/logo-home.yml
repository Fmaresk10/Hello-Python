name: CAFASSO logo home
on:
  push:
    paths:
      - '.github/workflows/logo-home.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_logo_home.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/*.html
          git diff --cached --quiet || git commit -m "Make CAFASSO crest return to home"
          git push
