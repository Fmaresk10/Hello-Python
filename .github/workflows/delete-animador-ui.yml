name: CAFASSO delete animator UI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_delete_animador_ui.py'
      - '.github/workflows/delete-animador-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply delete animator UI patch
        run: python scripts/patch_delete_animador_ui.py
      - name: Commit frontend changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/animadores.html
          git commit -m "Add CAFASSO delete animator action"
          git push
