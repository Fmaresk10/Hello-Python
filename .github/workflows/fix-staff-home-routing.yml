name: Fix CAFASSO staff home routing
on:
  push:
    paths:
      - '.github/workflows/fix-staff-home-routing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce role-specific home screens
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cafasso-wix-import/auth-guard.js')
          s=p.read_text(encoding='utf-8')
          old="""  const isAdmin=role.includes('admin');\n  const isFormador=role.includes('formador');\n  const adminOnly=new Set(['admin.html','animadores.html','grupos.html','grupo.html','asignaciones.html','importar-usuarios.html','animador.html']);\n"""
          new="""  const isAdmin=role.includes('admin');\n  const isFormador=role.includes('formador');\n  const requestedPreviewRole=String(params0.get('previewRole')||'').toLowerCase();\n  const requestedPreviewUser=String(params0.get('previewUser')||'').trim();\n  const staffAnimatorPreview=(isAdmin||isFormador)&&requestedPreviewRole==='animador';\n  const exactAnimatorPreview=isAdmin&&!!requestedPreviewUser;\n\n  // Cada rol tiene su propia casa. Admin/Formador solo ven la home de Animador mediante \"Ver como…\".\n  if(page==='index.html'&&!staffAnimatorPreview&&!exactAnimatorPreview){\n    if(isAdmin){location.replace('./admin.html');return;}\n    if(isFormador){location.replace('./formador.html');return;}\n  }\n\n  const adminOnly=new Set(['admin.html','animadores.html','grupos.html','grupo.html','asignaciones.html','importar-usuarios.html','animador.html']);\n"""
          if old not in s:
              raise SystemExit('role routing marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "CAFASSO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cafasso-wix-import/auth-guard.js
          git diff --cached --quiet || git commit -m "Enforce separate CAFASSO homes by role"
          git push
