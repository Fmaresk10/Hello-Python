name: CAFASSO bulk password reset UI
on:
  push:
    paths:
      - '.github/workflows/bulk-password-reset-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch animadores UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('cafasso-wix-import/animadores.html')
          s=p.read_text()
          s=s.replace('<button class="btn" id="applyBulk">Aplicar</button><button class="btn alt" id="clearSel">Cancelar selección</button>', '<button class="btn" id="applyBulk">Aplicar</button><button class="btn alt" id="bulkPasswords">Generar contraseñas</button><button class="btn alt" id="clearSel">Cancelar selección</button>')
          anchor="async function applyBulk(){if(!selected.size)return;"
          func="""async function bulkPasswords(){if(!selected.size)return;const users=(state.users||[]).filter(u=>selected.has(u._id));if(!confirm(`Generar nuevas contraseñas temporales para ${users.length} personas? Se cerrarán sus sesiones activas y deberán cambiar la contraseña al ingresar.`))return;busy(true);setStatus(`Generando ${users.length} contraseñas temporales…`);try{const j=await post({action:'resetPasswords',ids:users.map(u=>u._id)});state=j;fillFilters();renderKpis();selected.clear();render();setStatus(`${(j.credentials||[]).length} contraseñas temporales generadas`,true);const rows=(j.credentials||[]);if(!rows.length)return alert('No se generaron contraseñas.');const data=[['Nombre','Correo','Contraseña temporal'],...rows.map(x=>[x.name,x.email,x.temporaryPassword])];const csv='\\ufeff'+data.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\\r\\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cafasso-accesos-temporales.csv';a.click();URL.revokeObjectURL(a.href);alert(`Listo. Se generaron ${rows.length} contraseñas temporales y se descargó el archivo de accesos.`)}catch(e){alert(e.message);setStatus('No se pudieron generar las contraseñas')}finally{busy(false)}}
"""
          if 'async function bulkPasswords()' not in s:
              if anchor not in s: raise SystemExit('applyBulk anchor not found')
              s=s.replace(anchor,func+anchor)
          s=s.replace("$('applyBulk').onclick=applyBulk;$('clearSel').onclick", "$('applyBulk').onclick=applyBulk;$('bulkPasswords').onclick=bulkPasswords;$('clearSel').onclick")
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/animadores.html
          git diff --cached --quiet || git commit -m "Add bulk temporary password management"
          git push
# rerun