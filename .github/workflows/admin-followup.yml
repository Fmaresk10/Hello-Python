name: CAFASSO admin follow-up
on:
  push:
    paths:
      - '.github/workflows/admin-followup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_admin_followup.py
      - run: python scripts/patch_admin_mobile_core.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/admin.html cafasso-wix-import/animadores.html cafasso-wix-import/grupos.html cafasso-wix-import/asignaciones.html
          git diff --cached --quiet || git commit -m "Adapt admin core screens for mobile"
          git push
