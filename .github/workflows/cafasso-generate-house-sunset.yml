name: CAFASSO Generate House Sunset

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cafasso-generate-house-sunset.yml"
      - "cafasso-wix-import/tools/generate-house-sunset.py"
      - "cafasso-wix-import/assets/cafasso-casa-interior-v2.jpg"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy imageio imageio-ffmpeg

      - name: Generate Casa sunset loop
        run: python cafasso-wix-import/tools/generate-house-sunset.py

      - name: Commit generated MP4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cafasso-wix-import/assets/loops/house-sunset.mp4
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Generar loop piloto Casa atardecer"
          git push
