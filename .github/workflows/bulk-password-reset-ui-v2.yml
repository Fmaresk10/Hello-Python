name: CAFASSO bulk password UI v2
on:
  push:
    paths:
      - '.github/workflows/bulk-password-reset-ui-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_bulk_passwords.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/animadores.html
          git diff --cached --quiet || git commit -m "Add bulk temporary password management"
          git push
