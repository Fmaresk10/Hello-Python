name: Enable CAFASSO daily Word

on:
  push:
    paths:
      - '.github/workflows/enable-daily-word.yml'
      - 'scripts/enable_daily_word.py'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/enable_daily_word.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/index.html
          git diff --cached --quiet || git commit -m "Show daily Word on CAFASSO home"
          git push
