name: CAFASSO isolated profile photo
on:
  push:
    paths:
      - '.github/workflows/profile-photo-isolated.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/patch_profile_photo_isolated.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cafasso-wix-import/index.html
          git diff --cached --quiet || git commit -m "Load isolated profile photo module"
          git push
