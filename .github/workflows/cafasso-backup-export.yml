name: CAFASSO Backup Export

on:
  push:
    paths:
      - '.github/workflows/cafasso-backup-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build frontend source archive
        run: |
          mkdir -p backup
          zip -r backup/cafasso-frontend-source.zip cafasso-wix-import .github/workflows/cafasso-pages.yml
      - name: Upload frontend source archive
        uses: actions/upload-artifact@v4
        with:
          name: cafasso-frontend-source
          path: backup/cafasso-frontend-source.zip
          retention-days: 7
